<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin — Badge Manager | SPIKE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-deep: #070b10;
      --bg-surface: #0d1520;
      --bg-card: rgba(20, 32, 48, 0.7);
      --bg-glass: rgba(13, 21, 32, 0.85);
      --border-color: rgba(255,255,255,0.08);
      --primary: #00a884;
      --primary-hover: #00c29a;
      --primary-glow: rgba(0,168,132,0.3);
      --gold: #ffd700;
      --gold-glow: rgba(255,215,0,0.25);
      --error: #f43f5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius-card: 20px;
      --transition: 0.2s ease;
    }
    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 20px;
    }
    body::before {
      content: ''; position: fixed; top: -100px; left: -100px; width: 400px; height: 400px;
      background: var(--gold); opacity: 0.04; border-radius: 50%; filter: blur(120px);
      pointer-events: none; z-index: 0;
    }
    .admin-wrapper {
      max-width: 1000px; width: 100%; position: relative; z-index: 2;
    }
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
      background: var(--bg-glass); backdrop-filter: blur(12px);
      padding: 12px 20px; border-radius: 60px;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      /* ── safe-area inset for notched devices ── */
      padding-top: calc(12px + constant(safe-area-inset-top, 0px));
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    .admin-header .brand {
      font-size: 1.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--gold), #f5a623);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .admin-header .brand span { background: none; -webkit-text-fill-color: var(--text-muted); }
    .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .admin-actions button {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-main);
      backdrop-filter: blur(4px);
    }
    .admin-actions button:hover { background: rgba(255,215,0,0.08); color: var(--gold); border-color: var(--gold); }
    .admin-actions .logout { color: var(--error); border-color: rgba(244,63,94,0.2); }
    .admin-actions .logout:hover { background: rgba(244,63,94,0.1); border-color: var(--error); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card); backdrop-filter: blur(8px);
      border: 1px solid var(--border-color); border-radius: var(--radius-card);
      padding: 14px 12px; text-align: center;
    }
    .stat-card .num { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }

    .control-bar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin-bottom: 20px; background: var(--bg-glass);
      padding: 12px 16px; border-radius: 40px;
      border: 1px solid var(--border-color);
    }
    .control-bar .filter-group {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .control-bar .filter-group button {
      background: transparent; border: none; color: var(--text-muted);
      padding: 4px 14px; border-radius: 30px; font-size: 0.72rem;
      font-weight: 600; cursor: pointer; transition: var(--transition);
      font-family: var(--font-main);
    }
    .control-bar .filter-group button.active {
      background: rgba(255,215,0,0.12); color: var(--gold);
      box-shadow: 0 0 12px rgba(255,215,0,0.05);
    }
    .control-bar .filter-group button:hover { color: var(--text-main); }
    .search-box {
      margin-left: auto; display: flex; align-items: center;
      background: rgba(0,0,0,0.3); border-radius: 40px;
      padding: 2px 6px 2px 14px;
      border: 1px solid var(--border-color);
      flex: 1 1 180px;
    }
    .search-box input {
      background: transparent; border: none; color: var(--text-main);
      padding: 6px 4px; width: 100%; font-family: var(--font-main);
      font-size: 0.8rem; outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box button {
      background: var(--gold); border: none; color: #0d1520;
      font-weight: 700; padding: 4px 12px; border-radius: 30px;
      font-size: 0.7rem; cursor: pointer;
    }

    .request-list {
      display: flex; flex-direction: column; gap: 16px;
    }
    .request-card {
      background: var(--bg-card); backdrop-filter: blur(8px);
      border: 1px solid var(--border-color); border-radius: var(--radius-card);
      padding: 18px 16px;
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 12px 16px;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .request-card:hover { border-color: rgba(255,215,0,0.15); }
    .request-card .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #1e2a3a, #2a3a4e);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem;
      flex-shrink: 0; border: 1px solid var(--border-color);
      color: var(--gold);
    }
    .request-info {
      flex: 1; min-width: 150px;
    }
    .request-info .name {
      font-weight: 700; font-size: 1rem;
    }
    .request-info .email {
      font-size: 0.75rem; color: var(--text-muted);
    }
    .request-info .plan-badge {
      display: inline-block; background: rgba(255,215,0,0.1);
      padding: 1px 12px; border-radius: 20px;
      font-size: 0.6rem; font-weight: 600; color: var(--gold);
      border: 1px solid rgba(255,215,0,0.1);
    }
    .request-meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-size: 0.7rem; color: var(--text-muted);
      align-items: center;
    }
    .request-meta .ref { background: rgba(255,255,255,0.03); padding: 2px 8px; border-radius: 20px; }
    .request-meta .amount { color: var(--gold); font-weight: 700; }
    .request-meta .status {
      text-transform: capitalize; font-weight: 600;
      padding: 2px 12px; border-radius: 40px;
      font-size: 0.65rem;
    }
    .status-pending { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .status-approved { background: rgba(0,168,132,0.12); color: #00a884; }
    .status-rejected { background: rgba(244,63,94,0.12); color: #f43f5e; }

    .action-group {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-left: auto;
    }
    .action-group button {
      border: none; padding: 6px 14px; border-radius: 30px;
      font-weight: 600; font-size: 0.7rem; cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-main);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .action-group button.approve { background: rgba(0,168,132,0.1); color: #00a884; border-color: rgba(0,168,132,0.2); }
    .action-group button.approve:hover { background: rgba(0,168,132,0.2); }
    .action-group button.reject { background: rgba(244,63,94,0.08); color: #f43f5e; border-color: rgba(244,63,94,0.15); }
    .action-group button.reject:hover { background: rgba(244,63,94,0.2); }
    .action-group button.view { background: rgba(255,255,255,0.02); }
    .action-group button.view:hover { background: rgba(255,255,255,0.06); }
    .action-group button:disabled { opacity: 0.3; pointer-events: none; }

    .empty-state {
      text-align: center; padding: 50px 20px;
      background: var(--bg-card); border-radius: var(--radius-card);
      border: 1px dashed var(--border-color);
    }
    .empty-state .icon { font-size: 3rem; opacity: 0.4; margin-bottom: 8px; }
    .empty-state h3 { font-weight: 600; color: var(--text-muted); }

    .toast-container {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 999; max-width: 400px; width: calc(100% - 32px);
      background: var(--bg-glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border-color); border-radius: 16px;
      padding: 12px 18px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0; transform: translateY(-12px) scale(0.96);
      pointer-events: none;
    }
    .toast-container.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .toast-container .msg { flex: 1; font-size: 0.85rem; font-weight: 500; }
    .toast-container .close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(3,7,13,0.8);
      backdrop-filter: blur(16px); z-index: 2000;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: 24px; max-width: 480px; width: 100%;
      padding: 24px 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .modal-box .sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }
    .modal-box .detail-row {
      display: flex; justify-content: space-between; padding: 6px 0;
      border-bottom: 1px solid var(--border-color); font-size: 0.85rem;
    }
    .modal-box .detail-row .label { color: var(--text-muted); }
    .modal-box .receipt-img {
      width: 100%; max-height: 300px; object-fit: contain;
      border-radius: 12px; border: 1px solid var(--border-color);
      margin: 10px 0; background: #0a0f18;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .modal-actions button {
      flex: 1; padding: 10px; border-radius: 40px; border: none;
      font-weight: 700; font-family: var(--font-main);
      cursor: pointer; transition: var(--transition);
      min-width: 80px;
    }
    .modal-actions .btn-close { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border-color); }
    .modal-actions .btn-close:hover { background: rgba(255,255,255,0.08); }

    @media (max-width: 640px) {
      .admin-header { flex-direction: column; align-items: stretch; border-radius: 28px; }
      .control-bar { flex-direction: column; align-items: stretch; border-radius: 28px; }
      .search-box { margin-left: 0; }
      .request-card { flex-direction: column; align-items: stretch; }
      .action-group { margin-left: 0; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="admin-wrapper">

  <!-- header -->
  <div class="admin-header">
    <div class="brand">⚡ SPIKE <span>admin</span></div>
    <div class="admin-actions">
      <button id="refreshBtn" title="Refresh list">⟳ Refresh</button>
      <button class="logout" id="logoutBtn">⏻ Logout</button>
    </div>
  </div>

  <!-- stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total requests</div></div>
    <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="num" id="statApproved">0</div><div class="label">Approved</div></div>
    <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">Rejected</div></div>
  </div>

  <!-- controls -->
  <div class="control-bar">
    <div class="filter-group" id="filterGroup">
      <button class="active" data-filter="all">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="approved">Approved</button>
      <button data-filter="rejected">Rejected</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search name, email, ref...">
      <button id="searchBtn">🔍</button>
    </div>
  </div>

  <!-- request list -->
  <div id="requestList" class="request-list">
    <!-- dynamic cards -->
  </div>

  <!-- empty state (hidden by default) -->
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="icon">📭</div>
    <h3>No verification requests</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem;">All caught up!</p>
  </div>
</div>

<!-- toast -->
<div id="toast" class="toast-container">
  <span class="msg" id="toastMsg">Done</span>
  <button class="close" id="toastClose">✕</button>
</div>

<!-- modal -->
<div id="detailModal" class="modal-overlay">
  <div class="modal-box">
    <h2 id="modalTitle">Request details</h2>
    <div class="sub" id="modalSub">User & payment info</div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-close" id="modalCloseBtn">Close</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, query, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
    authDomain: "grazzy-9e736.firebaseapp.com",
    projectId: "grazzy-9e736",
    storageBucket: "grazzy-9e736.firebasestorage.app",
    messagingSenderId: "750326949170",
    appId: "1:750326949170:web:5d19744aafc8675918632b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allRequests = [];
  let currentFilter = 'all';
  let searchTerm = '';

  // DOM refs
  const listEl = document.getElementById('requestList');
  const emptyEl = document.getElementById('emptyState');
  const statTotal = document.getElementById('statTotal');
  const statPending = document.getElementById('statPending');
  const statApproved = document.getElementById('statApproved');
  const statRejected = document.getElementById('statRejected');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const modalOverlay = document.getElementById('detailModal');
  const modalBody = document.getElementById('modalBody');

  // toast
  function showToast(msg, duration = 3000) {
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }
  document.getElementById('toastClose').addEventListener('click', () => toast.classList.remove('show'));

  // modal
  function openModal(html) {
    modalBody.innerHTML = html;
    modalOverlay.classList.add('active');
  }
  document.getElementById('modalCloseBtn').addEventListener('click', () => modalOverlay.classList.remove('active'));
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

  // ===== FIXED: Render receipt image (supports both URL and base64) =====
  function getReceiptHtml(req) {
    // Check for receiptUrl first (Cloudinary), then receipt (base64)
    const receipt = req.receiptUrl || req.receipt || null;
    if (!receipt) {
      return '<div style="color:var(--text-muted);font-size:0.8rem;margin:8px 0;">📎 No receipt uploaded</div>';
    }
    
    // If it's a URL (starts with http) or a data URI, render as image
    if (typeof receipt === 'string' && (receipt.startsWith('http://') || receipt.startsWith('https://') || receipt.startsWith('data:image'))) {
      return `<img src="${receipt}" class="receipt-img" alt="Receipt" loading="lazy">`;
    }
    
    // Fallback: just show the text
    return `<div style="color:var(--text-muted);font-size:0.8rem;margin:8px 0;">📎 Receipt: ${receipt}</div>`;
  }

  // render list
  function renderRequests(requests) {
    if (!requests || requests.length === 0) {
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    let html = '';
    requests.forEach(req => {
      const status = req.status || 'pending';
      const statusClass = `status-${status}`;
      const plan = req.plan || 'monthly';
      const amount = req.amount || '₦150';
      // Use reference field (fallback to ref)
      const ref = req.reference || req.ref || 'N/A';
      const name = req.name || 'User';
      const email = req.email || 'no-email';
      const uid = req.uid || 'unknown';
      const avatar = name.charAt(0).toUpperCase();

      html += `
        <div class="request-card" data-uid="${uid}">
          <div class="avatar">${avatar}</div>
          <div class="request-info">
            <div class="name">${name} <span class="plan-badge">${plan}</span></div>
            <div class="email">${email}</div>
            <div class="request-meta">
              <span class="ref">#${ref.slice(0,12)}</span>
              <span class="amount">${amount}</span>
              <span class="status ${statusClass}">${status}</span>
            </div>
          </div>
          <div class="action-group">
            <button class="view" data-uid="${uid}">👁 View</button>
            ${status === 'pending' ? `
              <button class="approve" data-uid="${uid}">✅ Approve</button>
              <button class="reject" data-uid="${uid}">❌ Reject</button>
            ` : `
              <button class="reject" data-uid="${uid}" style="opacity:0.4;" disabled>Done</button>
            `}
          </div>
        </div>
      `;
    });
    listEl.innerHTML = html;

    // update stats
    const totals = { total: requests.length, pending: 0, approved: 0, rejected: 0 };
    requests.forEach(r => { if (r.status === 'pending') totals.pending++; else if (r.status === 'approved') totals.approved++; else if (r.status === 'rejected') totals.rejected++; });
    statTotal.textContent = totals.total;
    statPending.textContent = totals.pending;
    statApproved.textContent = totals.approved;
    statRejected.textContent = totals.rejected;

    // attach event listeners
    document.querySelectorAll('.request-card .view').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const uid = btn.dataset.uid;
        const req = allRequests.find(r => r.uid === uid);
        if (req) showDetailModal(req);
      });
    });

    document.querySelectorAll('.request-card .approve').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const uid = btn.dataset.uid;
        await handleApprove(uid);
      });
    });

    document.querySelectorAll('.request-card .reject').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const uid = btn.dataset.uid;
        await handleReject(uid);
      });
    });
  }

  // ===== FIXED: Show detail modal with correct receipt =====
  function showDetailModal(req) {
    const status = req.status || 'pending';
    const statusClass = `status-${status}`;
    const receiptHtml = getReceiptHtml(req);
    const ref = req.reference || req.ref || 'N/A';
    
    const html = `
      <div class="detail-row"><span class="label">Name</span><span>${req.name || 'N/A'}</span></div>
      <div class="detail-row"><span class="label">Email</span><span>${req.email || 'N/A'}</span></div>
      <div class="detail-row"><span class="label">Plan</span><span>${req.plan || 'N/A'}</span></div>
      <div class="detail-row"><span class="label">Amount</span><span>${req.amount || 'N/A'}</span></div>
      <div class="detail-row"><span class="label">Currency</span><span>${req.currency || 'NGN'}</span></div>
      <div class="detail-row"><span class="label">Reference</span><span>${ref}</span></div>
      <div class="detail-row"><span class="label">Status</span><span class="status ${statusClass}">${status}</span></div>
      <div class="detail-row"><span class="label">Submitted</span><span>${req.submittedDate ? new Date(req.submittedDate).toLocaleString() : 'N/A'}</span></div>
      ${receiptHtml}
    `;
    openModal(html);
  }

  // approve
  async function handleApprove(uid) {
    if (!uid) return;
    try {
      const reqRef = doc(db, "verification_requests", uid);
      await updateDoc(reqRef, {
        status: 'approved',
        reviewedAt: new Date().toISOString()
      });
      const userRef = doc(db, "users", uid);
      await updateDoc(userRef, {
        verified: true,
        isVerified: true,
        verificationStatus: 'approved',
        verifiedSince: new Date().toISOString(),
        verificationExpiry: 'Lifetime'
      });
      showToast(`✅ ${uid} approved`);
    } catch (e) {
      showToast('Error approving: ' + e.message, 4000);
    }
  }

  // reject
  async function handleReject(uid) {
    if (!uid) return;
    try {
      const reqRef = doc(db, "verification_requests", uid);
      await updateDoc(reqRef, {
        status: 'rejected',
        reviewedAt: new Date().toISOString()
      });
      const userRef = doc(db, "users", uid);
      await updateDoc(userRef, {
        verificationStatus: 'rejected',
        verificationRejected: Date.now(),
        verified: false,
        isVerified: false
      });
      showToast(`❌ ${uid} rejected`);
    } catch (e) {
      showToast('Error rejecting: ' + e.message, 4000);
    }
  }

  // fetch & listen
  function listenRequests() {
    const q = query(collection(db, "verification_requests"), orderBy("submittedAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const requests = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        requests.push({ ...data, uid: doc.id });
      });
      allRequests = requests;
      applyFilters();
    }, (error) => {
      console.error('Snapshot error:', error);
      showToast('Error loading requests', 3000);
    });
  }

  function applyFilters() {
    let filtered = [...allRequests];
    if (currentFilter !== 'all') {
      filtered = filtered.filter(r => r.status === currentFilter);
    }
    if (searchTerm.trim()) {
      const term = searchTerm.trim().toLowerCase();
      filtered = filtered.filter(r =>
        (r.name && r.name.toLowerCase().includes(term)) ||
        (r.email && r.email.toLowerCase().includes(term)) ||
        (r.reference && r.reference.toLowerCase().includes(term)) ||
        (r.ref && r.ref.toLowerCase().includes(term)) ||
        (r.uid && r.uid.toLowerCase().includes(term))
      );
    }
    renderRequests(filtered);
  }

  // setup filters
  document.querySelectorAll('#filterGroup button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filterGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    applyFilters();
  });
  document.getElementById('searchBtn').addEventListener('click', () => applyFilters());

  document.getElementById('refreshBtn').addEventListener('click', () => {
    applyFilters();
    showToast('🔄 Refreshed');
  });

  // logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
      await signOut(auth);
      showToast('Logged out');
      setTimeout(() => window.location.href = 'profile.html', 600);
    } catch (e) { showToast('Logout error', 3000); }
  });

  // auth guard
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      showToast('Please login as admin', 2000);
      setTimeout(() => window.location.href = 'profile.html', 800);
      return;
    }
    // start listening
    listenRequests();
  });

  console.log('Admin badge manager ready (fixed)');
</script>
</body>
</html>

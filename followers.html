  <script id="spike-theme-bootstrap">(()=>{try{const k='spike-theme-choice-v3',v='spike-theme-version';const prior=localStorage.getItem(k);let n=parseInt(prior||'1',10);if(localStorage.getItem(v)!=='4'){if(prior!==null){if(n<1||n>3)n=1;localStorage.setItem(k,String(n))}localStorage.setItem(v,'4');localStorage.removeItem('spike-theme-2-mode')}if(n<1||n>5)n=1;const t={1:'dark',2:'light',3:'dark',4:'light',5:'dark'};document.documentElement.dataset.spikeStyle=String(n);document.documentElement.dataset.theme=t[n];document.documentElement.dataset.spikeThemeMode=t[n];document.documentElement.dataset.spikeThemeId=String(n);document.documentElement.dataset.spikeThemeVersion='4';document.documentElement.style.colorScheme=t[n]}catch(_){}})();</script>

  <style>
    :root{--social-bg:var(--spike-bg,#080a10);--social-panel:var(--spike-surface,#111522);--social-line:var(--spike-line,rgba(255,255,255,.12));--social-text:var(--spike-text,#f5f7ff);--social-muted:var(--spike-muted,#9ca8ba);--social-accent:var(--spike-primary,#42d8ef)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--social-bg);color:var(--social-text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh}.social-page{width:min(100%,820px);min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
    .social-top{display:flex;align-items:center;gap:14px;padding:4px 0 18px;border-bottom:1px solid var(--social-line)}.social-back{width:44px;height:44px;flex:none;border:1px solid var(--social-line);border-radius:14px;background:var(--social-panel);color:inherit;font-size:23px;cursor:pointer}.social-heading{min-width:0;flex:1}.social-eyebrow{font-size:10px;letter-spacing:.17em;font-weight:850;color:var(--social-accent)}.social-heading h1{margin:4px 0 0;font-size:clamp(24px,5vw,30px);letter-spacing:-.04em}.social-count{flex:none;text-align:right;color:var(--social-muted);font-size:12px}.social-count strong{display:block;color:var(--social-text);font-size:19px}
    .social-mutual-link{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;margin:12px 0 0;padding:9px 13px;border:1px solid var(--social-line);border-radius:12px;background:var(--social-panel);color:var(--social-text);text-decoration:none;font-size:12px;font-weight:750}.social-mutual-link[hidden]{display:none}.social-tools{padding:16px 0 10px}.social-search{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--social-line);border-radius:15px;background:var(--social-panel)}.social-search span{font-size:21px;color:var(--social-muted)}.social-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--social-text);font:inherit;font-size:14px}.social-search input::placeholder{color:var(--social-muted)}#searchScope{display:block;min-height:16px;padding:5px 2px 0;color:var(--social-muted);font-size:10px}
    .social-list{display:grid;gap:0}.social-person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--social-line)}.social-person[hidden]{display:none}.social-person-main{min-width:0;flex:1;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.social-avatar{width:48px;height:48px;flex:none;border-radius:50%;object-fit:cover;background:var(--social-panel);border:1px solid var(--social-line)}.social-avatar-fallback{display:grid;place-items:center;font-weight:850;font-size:17px;color:var(--social-accent)}.social-person-copy{min-width:0;display:grid;gap:4px}.social-person-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.social-person-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--social-muted);font-size:12px}.social-person-actions{display:flex;align-items:center;gap:7px;flex:none}.social-follow-button,.social-secondary-action{min-height:36px;padding:0 13px;border:1px solid var(--social-accent);border-radius:12px;background:var(--social-accent);color:#071018;font:inherit;font-size:11px;font-weight:850;cursor:pointer}.social-follow-button.is-following{background:transparent;color:var(--social-text);border-color:var(--social-line)}.social-follow-button:disabled{opacity:.75;cursor:default}.social-secondary-action{background:transparent;color:var(--social-muted);border-color:var(--social-line)}
    .social-status{padding:28px 14px;text-align:center;color:var(--social-muted);font-size:13px;line-height:1.5}.social-status[data-type="error"]{color:#ff9aa8}.social-load-more{width:100%;min-height:46px;margin:14px 0;border:1px solid var(--social-line);border-radius:14px;background:var(--social-panel);color:var(--social-text);font:inherit;font-weight:750;cursor:pointer}.social-load-more[hidden]{display:none}.social-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);padding:12px 16px;border:1px solid var(--social-line);border-radius:14px;background:var(--social-panel);box-shadow:0 12px 36px #0005;font-size:13px}.social-toast[hidden]{display:none}
    @media(max-width:420px){.social-page{padding-left:14px;padding-right:14px}.social-avatar{width:44px;height:44px}.social-follow-button{padding:0 9px}.social-person{gap:7px}.social-person-actions{max-width:126px;flex-wrap:wrap;justify-content:flex-end}.social-secondary-action{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 7px;font-size:9px}}
    @media(prefers-reduced-motion:no-preference){.social-person{animation:social-in .18s ease both}@keyframes social-in{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}}

<body data-social-kind="followers">
<script src="js/spike-dialog.js?v=global-dialog-v3"></script>
  <main class="social-page">
    <header class="social-top">
      <button class="social-back" id="backButton" type="button" aria-label="Back to profile">‹</button>
      <div class="social-heading"><div class="social-eyebrow" id="pageEyebrow">YOUR CONNECTIONS</div><h1 id="pageTitle">Followers</h1></div>
      <div class="social-count"><strong id="connectionCount">—</strong><span>total</span></div>
    </header>
    <a class="social-mutual-link" id="mutualLink" href="followers.html?kind=mutuals" hidden>✦ See mutual connections</a>
    <div class="social-tools">
      <label class="social-search"><span aria-hidden="true">⌕</span><input id="socialSearch" type="search" placeholder="Search names or usernames…" autocomplete="off" aria-label="Search followers"></label>
      <small id="searchScope"></small>
    </div>
    <section class="social-list" id="socialList" aria-label="Followers list" aria-live="polite"></section>
    <div class="social-status" id="socialStatus" role="status" aria-live="polite">Loading connections…</div>
    <div class="social-status" id="socialSearchEmpty" hidden>No matching members in the loaded list.</div>
    <button class="social-load-more" id="loadMore" type="button" hidden>Load more</button>
  </main>
  <div class="social-toast" id="socialToast" role="status" hidden></div>

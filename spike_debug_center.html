<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIKE Debug Center</title><script id="spike-theme-bootstrap">(()=>{try{let n=parseInt(localStorage.getItem('spike-feed-style')||'1',10);if(n<1||n>10)n=1;document.documentElement.dataset.spikeStyle=String(n);document.documentElement.dataset.theme=(n===6||n===8)?'light':'dark';document.documentElement.style.colorScheme=(n===6||n===8)?'light':'dark'}catch(_){}})();</script><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/spike-mobile-safe-area.css"><link rel="stylesheet" href="css/ui-fix.css"><style>body{margin:0;font-family:system-ui,sans-serif;background:var(--bg,#f5f7fb);color:var(--text,#111)}main{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:16px;padding:16px;margin:14px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{padding:9px 12px;border-radius:10px;border:1px solid #bbb;background:transparent}.report{border:1px solid rgba(127,127,127,.2);border-radius:14px;margin:10px 0;overflow:hidden}.report summary{cursor:pointer;padding:12px;font-weight:700}.report pre{white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;padding:12px;margin:0;background:rgba(127,127,127,.07);font-size:12px}.muted{opacity:.7}</style><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/spike-debugger.css"><script src="js/theme.js" defer></script></head><body><main><div class="top"><div><h1>🐛 SPIKE Debug Center</h1><div class="muted">Remote diagnostics · admin only</div></div><div class="toolbar"><button id="refresh">Refresh</button><button id="purge">Purge expired</button><button onclick="location.href='admin.html'">Back to Admin</button></div></div><div class="card" id="status">Loading…</div><div id="reports"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script><script>const SUPABASE_URL='https://cjqpyndceqyqsijihxbb.supabase.co';const SUPABASE_KEY='sb_publishable_Tqz0TbLLRLwu4XirPTVuiw_sSC9o4Jw';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){ $('status').textContent='Loading remote reports…';const r=await sb.rpc('get_spike_debug_reports',{p_limit:200,p_hours:168});if(r.error){$('status').textContent='Access/error: '+r.error.message;$('reports').textContent='';return}const rows=Array.isArray(r.data)?r.data:[];$('status').textContent=rows.length+' reports in the last 7 days';$('reports').innerHTML=rows.map((x,i)=>'<details class="report"><summary>#'+esc(x.id)+' · '+esc(x.page||'unknown')+' · '+esc(x.created_at)+' · session '+esc((x.session_id||'').slice(0,12))+'</summary><pre>'+esc(JSON.stringify(x.report,null,2))+'</pre></details>').join('')||'<div class="card">No remote diagnostics yet.</div>'}async function purge(){const r=await sb.rpc('purge_spike_debug_reports');$('status').textContent=r.error?'Purge failed: '+r.error.message:'Purged '+(r.data||0)+' expired reports';await load()}$('refresh').onclick=load;$('purge').onclick=purge;load();</script><script src="js/spike-debugger.js"></script></body></html>

<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── brand ─── */
.brand .brand-title {
  font-weight:950; text-transform:uppercase; letter-spacing:.08em;
  background:linear-gradient(90deg,#7aff4f,#3fffd8,#7aa7ff,#d86cff,#ff5fb7,#7aff4f);
  background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:brandSparkle 3s linear infinite;
  filter:drop-shadow(0 0 10px rgba(100,235,100,.25));
}
@keyframes brandSparkle{to{background-position:300% center}}
:root {
  --bg:#070b10; --surface:#0d1520; --card:#142030; --glass:rgba(13,21,32,.88);
  --line:rgba(255,255,255,.08); --text:#f1f5f9; --muted:#94a3b8;
  --primary:#00a884; --primary2:#00c29a; --danger:#f43f5e; --warning:#f59e0b;
  --blue:#0ea5e9; --gold:#ffd700; --shadow:0 18px 60px rgba(0,0,0,.42);
  --radius:20px; --radius-sm:11px;
}
body.light {
  --bg:#f0f4fa; --surface:#e8edf4; --card:#fff; --glass:rgba(255,255,255,.94);
  --line:rgba(0,0,0,.08); --text:#0f1824; --muted:#5a6e8a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
body{display:flex;flex-direction:column;overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:100;height:70px;width:100%;padding:8px max(12px,calc((100vw - 620px)/2)) 8px;display:flex;align-items:center;justify-content:space-between;background:var(--glass);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;text-decoration:none;font-size:1.8rem}
.header-actions{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:var(--text);display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--danger);font-size:.55rem;font-weight:800;display:none;place-items:center;color:#fff;border:2px solid var(--bg)}
.badge.show{display:grid}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),#005c4b);font-weight:800;color:#fff;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{width:min(620px,100%);margin:auto;padding:14px 12px 35px;display:flex;flex-direction:column;gap:14px}
.card{background:rgba(20,32,48,.72);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
body.light .card{background:rgba(255,255,255,.9)}
.tool{min-height:40px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.035);color:var(--muted);font-size:.72rem;font-weight:700;transition:.15s}
.tool:hover{color:var(--text);background:rgba(255,255,255,.06)}
.primary{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.danger{color:#fb7185!important}
.hidden{display:none!important}

/* ─── profile ─── */
.profile-cover{height:190px;position:relative;background:linear-gradient(135deg,#123c36,#0e1d29);overflow:hidden;cursor:default}
.profile-cover.clickable{cursor:pointer}
.profile-cover img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.profile-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 52%,rgba(0,0,0,.5));pointer-events:none}
.profile-cover .upload-hint-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:#fff;backdrop-filter:blur(3px);pointer-events:none}
.profile-cover.clickable:hover .upload-hint-overlay{display:flex}
.profile-body{padding:0 15px 16px}
.profile-head{display:flex;gap:12px;align-items:flex-end;margin-top:-48px;position:relative;z-index:3}
.profile-avatar-large{width:96px;height:96px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),#005c4b);border:4px solid var(--card);font-size:2rem;font-weight:800;color:#fff;box-shadow:var(--shadow);flex:0 0 auto;cursor:default;position:relative}
.profile-avatar-large img{width:100%;height:100%;object-fit:cover}
.profile-avatar-large .upload-hint{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;font-size:.6rem;font-weight:600;color:#fff;border-radius:50%;backdrop-filter:blur(4px)}
.profile-avatar-large.clickable{cursor:pointer}
.profile-avatar-large.clickable:hover .upload-hint{display:grid}
.profile-identity{min-width:0;flex:1;padding-bottom:5px}
.profile-name{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-handle{font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-verified{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;margin-left:3px;vertical-align:1px}
.profile-bio{font-size:.78rem;line-height:1.55;padding:13px 2px 4px;overflow-wrap:anywhere}
.profile-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.63rem;color:var(--muted);padding:4px 2px}
.profile-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.profile-stats{display:flex;gap:22px;border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.profile-stat{font-size:.68rem;color:var(--muted);border:0;background:none;padding:0}
.profile-stat b{color:var(--text);font-size:.86rem;margin-right:4px}
.profile-tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}
.profile-tab{white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.03);color:var(--muted);font-size:.68rem;font-weight:700}
.profile-tab.active{background:rgba(0,168,132,.12);border-color:rgba(0,168,132,.4);color:var(--primary)}
.profile-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.profile-media-item{aspect-ratio:1;background:var(--card);overflow:hidden}
.profile-media-item img,.profile-media-item video{width:100%;height:100%;object-fit:cover;display:block}
.follow-list{display:flex;flex-direction:column}
.follow-row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.follow-row:last-child{border-bottom:0}
.follow-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--primary),#005c4b);display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto}
.follow-avatar img{width:100%;height:100%;object-fit:cover}
.follow-info{min-width:0;flex:1}
.follow-name{font-size:.75rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-handle{font-size:.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-picker-input{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;z-index:-1}

/* ─── posts ─── */
.posts{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;color:var(--muted);padding:35px 15px;font-size:.8rem}
.post{padding:14px}
.post-head{display:flex;gap:10px;align-items:center}
.author{display:flex;gap:9px;align-items:center;min-width:0;flex:1}
.author .avatar{width:42px;height:42px}
.author-info{min-width:0}
.author-name{font-size:.8rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.62rem;color:var(--muted)}
.post-content{padding:12px 2px;font-size:.86rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.post-media{border-radius:15px;overflow:hidden;border:1px solid var(--line);background:#000}
.post-media img,.post-media video{width:100%;max-height:430px;display:block;object-fit:cover}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.action{flex:1;min-height:39px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.025);color:var(--muted);font-size:.7rem;font-weight:700;min-width:44px}
.action.active{color:#ff5c78;border-color:rgba(244,63,94,.25);background:rgba(244,63,94,.07)}

/* ─── overlays ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(15px);z-index:300;display:none;align-items:center;justify-content:center;padding:15px;overflow-y:auto}
.overlay.open{display:flex}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);margin:auto}
.modal h2{font-size:1rem;margin-bottom:12px}
.modal p{font-size:.73rem;color:var(--muted);line-height:1.5}
.modal-row{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.modal-row button{flex:1;min-width:80px}
.modal input,.modal textarea,.modal select{width:100%;margin-top:6px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.modal textarea{min-height:100px;resize:vertical}
.field{margin-top:8px}
.field label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.menu-list{display:grid;gap:6px}
.menu-list button{padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.03);color:var(--text);text-align:left;font-size:.85rem}
.menu-list button:hover{background:rgba(255,255,255,.06)}
.toast{position:fixed;z-index:1000;top:80px;left:50%;transform:translate(-50%,-15px);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.72rem;transition:.2s;box-shadow:var(--shadow);max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
footer{padding:18px;text-align:center;color:var(--muted);font-size:.65rem;border-top:1px solid var(--line);margin-top:auto}

@media(max-width:480px){.header{height:64px}.brand{font-size:1.5rem}.icon{width:37px;height:37px}.main{padding:10px 8px 25px}.profile-cover{height:165px}.profile-head{margin-top:-42px}.profile-avatar-large{width:84px;height:84px}.profile-stats{gap:14px}}

</style></head>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.57.0";

const SUPABASE_URL = "https://bkrrewagsbjqgmxaaqyt.supabase.co";
const SUPABASE_KEY = "sb_publishable_24Z2PQpdG13cf6_9w8C7nA_zXEzr60O";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

// ─── SPIKE shared user settings ─────────────────────────────────────
window.SPIKE_SETTINGS = window.SPIKE_SETTINGS || { theme:"dark" };
window.SPIKE_PRIVACY = window.SPIKE_PRIVACY || {};

window.spikeApplyTheme = function(theme){
  const t = theme === "light" ? "light" :
            theme === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") :
            "dark";
  document.documentElement.dataset.theme = t;
  document.body.classList.toggle("light", t === "light");
  document.documentElement.style.colorScheme = t;
  localStorage.setItem("spike-theme", t);
};

window.spikeLoadSettings = async function(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return null;
    const [{data:settings},{data:privacy}] = await Promise.all([
      supabase.from("user_settings").select("*").eq("user_id",user.id).maybeSingle(),
      supabase.from("user_privacy_settings").select("*").eq("user_id",user.id).maybeSingle()
    ]);
    window.SPIKE_SETTINGS = {...(settings||{}), theme:settings?.theme||"dark"};
    window.SPIKE_PRIVACY = privacy||{};
    window.spikeApplyTheme(window.SPIKE_SETTINGS.theme);
    window.dispatchEvent(new CustomEvent("spike-settings-changed",{detail:{settings:window.SPIKE_SETTINGS,privacy:window.SPIKE_PRIVACY}}));
    return {user,settings:window.SPIKE_SETTINGS,privacy:window.SPIKE_PRIVACY};
  }catch(e){
    console.warn("SPIKE settings load:",e);
    window.spikeApplyTheme(localStorage.getItem("spike-theme")==="light" ? "light" : "dark");
    return null;
  }
};

window.spikeSetTheme = async function(theme){
  window.SPIKE_SETTINGS = {...window.SPIKE_SETTINGS,theme};
  window.spikeApplyTheme(theme);
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(user){
      const {error}=await supabase.from("user_settings").upsert(
        {user_id:user.id,theme,updated_at:new Date().toISOString()},
        {onConflict:"user_id"}
      );
      if(error) throw error;
    }
  }catch(e){ console.warn("Could not save theme:",e); }
};

window.spikeListenSettings = async function(){
  try{
    const {data:{user}} = await supabase.auth.getUser();
    if(!user) return;
    const channel=supabase.channel("spike-settings-"+user.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"user_settings",filter:"user_id=eq."+user.id},
        payload=>{
          window.SPIKE_SETTINGS={...window.SPIKE_SETTINGS,...(payload.new||{})};
          window.spikeApplyTheme(window.SPIKE_SETTINGS.theme||"dark");
          window.dispatchEvent(new CustomEvent("spike-settings-changed",{detail:{settings:window.SPIKE_SETTINGS,privacy:window.SPIKE_PRIVACY}}));
        })
      .on("postgres_changes",{event:"*",schema:"public",table:"user_privacy_settings",filter:"user_id=eq."+user.id},
        payload=>{
          window.SPIKE_PRIVACY={...window.SPIKE_PRIVACY,...(payload.new||{})};
          window.dispatchEvent(new CustomEvent("spike-settings-changed",{detail:{settings:window.SPIKE_SETTINGS,privacy:window.SPIKE_PRIVACY}}));
        })
      .subscribe();
    window.__spikeSettingsChannel=channel;
    addEventListener("visibilitychange",()=>{if(!document.hidden)window.spikeLoadSettings();});
    addEventListener("focus",()=>window.spikeLoadSettings());
  }catch(e){ console.warn("SPIKE settings realtime:",e); }
};

async function getDoc(path) {
  const { data, error } = await supabase.from("app_documents").select("*").eq("path", path).maybeSingle();
  if (error) throw error;
  return data?.data || {};
}

async function putDoc(path, data, ownerId = me?.id, parent = "") {
  const { data: old, error: e } = await supabase.from("app_documents").select("created_at").eq("path", path).maybeSingle();
  if (e && e.code !== "PGRST116") throw e;
  const row = {
    path,
    parent_path: parent,
    collection_name: path.split("/")[0],
    document_id: path.split("/").pop(),
    owner_id: ownerId || null,
    data,
    created_at: old?.created_at || now(),
    updated_at: now()
  };
  const { error } = await supabase.from("app_documents").upsert(row, { onConflict: "path" });
  if (error) throw error;
}

async function listDocs(collection, parent = "") {
  const { data, error } = await supabase.from("app_documents").select("*").eq("collection_name", collection).eq("parent_path", parent);
  if (error) throw error;
  return data || [];
}

// ─── Cloudinary upload ──────────────────────────────────────────────
async function uploadToCloudinary(file, kind) {
  if (!file) return null;
  if (!file.type.startsWith("image/")) { toast("Please select an image."); return null; }
  if (file.size > 8 * 1024 * 1024) { toast("Maximum image size is 8 MB."); return null; }

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY.uploadPreset);

  toast(kind === "avatar" ? "Uploading profile picture…" : "Uploading cover photo…");

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, {
      method: "POST",
      body: form,
    });
    if (!res.ok) throw new Error("Cloudinary upload failed");
    const data = await res.json();
    return data.secure_url;
  } catch (e) {
    console.error("Upload error:", e);
    toast("Upload failed. Please try again.");
    return null;
  }
}

async function uploadImageForProfile(file, kind) {
  if (!isSelf()) return toast("Only the profile owner can upload.");
  if (!file) return;
  const url = await uploadToCloudinary(file, kind);
  if (!url) return;

  try {
    if (kind === "avatar") {
      const { error } = await supabase.from("profiles").update({ avatar_url: url, updated_at: now() }).eq("id", me.id);
      if (error) throw error;
      target = { ...target, avatar_url: url };
    } else {
      const { error } = await supabase.from("profiles").update({ cover_url: url, updated_at: now() }).eq("id", me.id);
      if (error) throw error;
      target = { ...target, cover_url: url };
      targetDoc = { ...targetDoc, cover_url: url };
      await putDoc(`users/${me.id}`, targetDoc, me.id, "");
    }
    render();
    toast(kind === "avatar" ? "Profile picture updated ✅" : "Cover photo updated ✅");
  } catch (e) {
    console.error("DB update failed:", e);
    toast("Failed to save image. Please try again.");
  }
}

// ─── File picker ──────────────────────────────────────────────────
function openFilePicker(id) {
  const input = $(id);
  if (!input) return toast("File picker unavailable.");
  if (!isSelf()) return toast("Only the profile owner can upload.");
  input.value = "";
  try { input.click(); } catch (_) { toast("Could not open file picker."); }
}

// ─── Render ──────────────────────────────────────────────────────
function render() {
  const self = isSelf();
  const av = avatarOf(target);
  const cover = target?.cover_url || targetDoc?.cover_url;

  // Name & handle
  $("name").innerHTML = esc(nameOf(target)) + (target?.activated ? ` <span class="profile-verified">✓</span>` : "");
  $("handle").textContent = handleOf(target);
  $("bio").textContent = target?.bio || targetDoc?.bio || "";

  // Meta
  const meta = [];
  if (target?.location || targetDoc?.location) meta.push("📍 " + (target.location || targetDoc.location));
  if (target?.website || targetDoc?.website) meta.push("🔗 " + (target.website || targetDoc.website));
  if (target?.created_at) meta.push("Joined " + new Date(target.created_at).toLocaleDateString(undefined, { month: "short", year: "numeric" }));
  $("meta").textContent = meta.join("  •  ");

  // Avatar
  const avatarEl = $("avatar");
  avatarEl.innerHTML = av ? `<img src="${esc(av)}" alt=""><div class="upload-hint">📷 Tap to change</div>` : initials(target) + `<div class="upload-hint">📷 Tap to change</div>`;
  avatarEl.classList.toggle("clickable", self);
  avatarEl.onclick = () => { if (self) openFilePicker("avatarFile"); };

  // Cover: image + clickable area (no button)
  const coverEl = $("cover");
  // Remove existing img if any, then prepend new one
  const existingImg = coverEl.querySelector("img");
  if (existingImg) existingImg.remove();
  if (cover) {
    const img = document.createElement("img");
    img.src = cover;
    img.alt = "Cover photo";
    coverEl.prepend(img);
  }
  // Make cover clickable (like avatar) when self
  coverEl.classList.toggle("clickable", self);
  coverEl.onclick = () => {
    if (self) openFilePicker("coverFile");
  };

  // Edit button
  const editBtn = $("edit");
  if (editBtn) editBtn.classList.toggle("hidden", !self);

  // Follow / message / call / more
  $("follow").classList.toggle("hidden", self);
  $("message").classList.toggle("hidden", self);
  $("audioCall").classList.toggle("hidden", self);
  $("videoCall").classList.toggle("hidden", self);
  $("more").classList.toggle("hidden", self);

  if (!self) {
    $("follow").textContent = following.has(targetId) ? "Following" : "Follow";
    $("follow").style.color = following.has(targetId) ? "var(--primary)" : "";
  }

  // Stats
  $("postsCount").textContent = posts.length;
  $("followersCount").textContent = Array.isArray(targetDoc.followers) ? targetDoc.followers.length : Number(targetDoc.followers_count || 0);
  $("followingCount").textContent = Array.isArray(targetDoc.following) ? targetDoc.following.length : Number(targetDoc.following_count || 0);

  // Mute
  $("mute").textContent = muted.has(targetId) ? "🔇 Unmute user" : "🔇 Mute user";

  // Header avatar (if self, use latest)
  if (self) {
    const hAv = avatarOf(target);
    $("headerAvatar").innerHTML = hAv ? `<img src="${esc(hAv)}">` : initials(target);
  }
}

// ─── Posts ──────────────────────────────────────────────────────────
function postCard(p) {
  const likes = Array.isArray(p.likes) ? p.likes : [];
  const liked = likes.includes(me?.id);
  const own = p.authorUid === me?.id;
  const authorName = p.authorName || nameOf(target);
  const authorAv = p.authorAvatar || avatarOf(target);
  return `<article class="card post" data-id="${esc(p.id)}">
    <div class="post-head">
      <div class="author">
        <div class="avatar">${authorAv ? `<img src="${esc(authorAv)}">` : initials({ name: authorName })}</div>
        <div class="author-info">
          <div class="author-name">${esc(authorName)}</div>
          <div class="meta">${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : ""}</div>
        </div>
      </div>
    </div>
    <div class="post-content">${esc(p.text || p.body || "")}</div>
    ${p.mediaUrl ? `<div class="post-media">${p.mediaType === "video" ? `<video src="${esc(p.mediaUrl)}" controls playsinline></video>` : `<img src="${esc(p.mediaUrl)}" loading="lazy">`}</div>` : ""}
    <div class="actions">
      <button class="action ${liked ? "active" : ""}" data-like>♥ ${likes.length}</button>
      <button class="action">💬 ${Array.isArray(p.comments) ? p.comments.length : Number(p.comments_count || 0)}</button>
      <button class="action" data-share>↗ Share</button>
      ${own ? `<button class="action danger" data-delete>🗑 Delete</button>` : ""}
    </div>
  </article>`;
}

async function loadPosts() {
  const rows = await listDocs("posts", "");
  posts = rows
    .map(r => ({ id: r.document_id, ...(r.data || {}) }))
    .filter(p => (p.authorUid || p.author_id) === targetId && !p.deleted);
  posts.sort((a, b) => new Date(b.createdAt || b.created_at || 0) - new Date(a.createdAt || a.created_at || 0));
  render();
  await renderTab();
}

async function renderTab() {
  if (tab === "media") {
    const m = posts.filter(p => p.mediaUrl);
    $("content").innerHTML = m.length
      ? `<div class="profile-media-grid">${m.map(p =>
          `<div class="profile-media-item">${p.mediaType === "video" ? `<video src="${esc(p.mediaUrl)}" controls></video>` : `<img src="${esc(p.mediaUrl)}" loading="lazy">`}</div>`
        ).join("")}</div>`
      : `<div class="card empty">No media yet.</div>`;
    return;
  }
  let list = posts;
  if (tab === "replies") list = posts.filter(p => p.replyTo || p.type === "reply");
  if (tab === "likes") {
    const rows = await listDocs("posts", "");
    list = rows.map(r => ({ id: r.document_id, ...(r.data || {}) })).filter(p => Array.isArray(p.likes) && p.likes.includes(targetId) && !p.deleted);
  }
  $("content").innerHTML = list.length
    ? list.map(postCard).join("")
    : `<div class="card empty">No ${tab === "likes" ? "liked posts" : "posts"} here yet.</div>`;
  bindPostEvents();
}

function bindPostEvents() {
  document.querySelectorAll("[data-like]").forEach(b => {
    b.onclick = async () => {
      const id = b.closest("[data-id]").dataset.id;
      const { data, error } = await supabase.from("app_documents").select("*").eq("path", `posts/${id}`).maybeSingle();
      if (error) return toast(error.message);
      const p = { ...(data?.data || {}) };
      const s = new Set(p.likes || []);
      s.has(me.id) ? s.delete(me.id) : s.add(me.id);
      p.likes = [...s];
      await putDoc(`posts/${id}`, p, data?.owner_id || p.authorUid || null, "");
      await loadPosts();
    };
  });

  document.querySelectorAll("[data-delete]").forEach(b => {
    b.onclick = () => {
      if (!isSelf()) return toast("You can only delete your own posts.");
      const id = b.closest("[data-id]").dataset.id;
      confirmBox("Delete post?", "This permanently removes your post.", async () => {
        const { error } = await supabase.from("app_documents").delete().eq("path", `posts/${id}`);
        if (error) return toast(error.message);
        await loadPosts();
        toast("Post deleted.");
      });
    };
  });

  document.querySelectorAll("[data-share]").forEach(b => {
    b.onclick = () => {
      const u = `${location.origin}${location.pathname}?uid=${encodeURIComponent(targetId)}`;
      navigator.clipboard?.writeText(u).then(() => toast("Profile link copied."));
    };
  });
}

// ─── Follow ──────────────────────────────────────────────────────────
async function followToggle() {
  if (isSelf()) return toast("You cannot follow yourself.");
  const d = await getDoc(`users/${me.id}`);
  const s = new Set(d.following || []);
  const add = !s.has(targetId);
  add ? s.add(targetId) : s.delete(targetId);
  d.following = [...s];
  following = s;
  await putDoc(`users/${me.id}`, d, me.id, "");
  if (add) {
    try {
      await putDoc(`users/${targetId}/notifications/${crypto.randomUUID()}`,
        { type: "follow", from: me.id, createdAt: now(), read: false, message: `${nameOf(target)} followed you` },
        me.id, `users/${targetId}/notifications`);
    } catch (_) {}
  }
  render();
  toast(add ? "Following" : "Unfollowed");
}

// ─── Confirm dialog ─────────────────────────────────────────────────
function confirmBox(title, text, fn) {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  confirmAction = fn;
  $("confirmOverlay").classList.add("open");
}
$("confirmNo").onclick = () => { $("confirmOverlay").classList.remove("open"); confirmAction = null; };
$("confirmYes").onclick = async () => {
  const f = confirmAction;
  confirmAction = null;
  $("confirmOverlay").classList.remove("open");
  if (f) await f();
};

// ─── Edit profile ──────────────────────────────────────────────────
$("edit").onclick = () => {
  if (!isSelf()) return;
  $("fName").value = target.display_name || "";
  $("fUsername").value = target.username || "";
  $("fBio").value = target.bio || targetDoc.bio || "";
  $("fWebsite").value = targetDoc.website || "";
  $("fLocation").value = targetDoc.location || "";
  $("editOverlay").classList.add("open");
};
$("editCancel").onclick = () => $("editOverlay").classList.remove("open");
$("editSave").onclick = async () => {
  if (!isSelf()) return;
  const patch = {
    display_name: $("fName").value.trim(),
    username: $("fUsername").value.trim().replace(/^@/, ""),
    bio: $("fBio").value.trim(),
    updated_at: now()
  };
  const { error } = await supabase.from("profiles").update(patch).eq("id", me.id);
  if (error) return toast(error.message);
  target = { ...target, ...patch };
  targetDoc = { ...targetDoc, bio: patch.bio, website: $("fWebsite").value.trim(), location: $("fLocation").value.trim() };
  await putDoc(`users/${me.id}`, targetDoc, me.id, "");
  $("editOverlay").classList.remove("open");
  render();
  toast("Profile updated.");
};

// ─── Upload buttons (edit modal) ──────────────────────────────────
$("avatarUpload").onclick = e => { e.preventDefault(); openFilePicker("avatarFile"); };
$("coverUpload").onclick = e => { e.preventDefault(); openFilePicker("coverFile"); };

// ─── File input events ─────────────────────────────────────────────
$("avatarFile").onchange = async e => {
  const f = e.target.files?.[0];
  if (f) await uploadImageForProfile(f, "avatar");
  e.target.value = "";
};
$("coverFile").onchange = async e => {
  const f = e.target.files?.[0];
  if (f) await uploadImageForProfile(f, "cover");
  e.target.value = "";
};

// ─── Followers / Following list ────────────────────────────────────
$("followersStat").onclick = () => showList("Followers", targetDoc.followers || []);
$("followingStat").onclick = () => showList("Following", targetDoc.following || []);
$("listClose").onclick = () => $("listOverlay").classList.remove("open");

async function showList(title, ids) {
  $("listTitle").textContent = title;
  $("listOverlay").classList.add("open");
  const wanted = [...new Set((ids || []).filter(Boolean))];
  if (!wanted.length) return $("listContent").innerHTML = "<div class='empty'>None yet.</div>";
  const rows = await listDocs("users", "");
  const map = new Map(rows.map(r => ({ id: r.document_id, ...(r.data || {}) })).map(u => [u.id, u]));
  $("listContent").innerHTML = wanted.map(id => {
    const u = map.get(id) || { id, username: id.slice(0, 8) };
    return `<div class="follow-row">
      <div class="follow-avatar">${avatarOf(u) ? `<img src="${esc(avatarOf(u))}">` : initials(u)}</div>
      <div class="follow-info"><div class="follow-name">${esc(nameOf(u))}</div><div class="follow-handle">${esc(handleOf(u))}</div></div>
      <button class="tool" data-open-user="${esc(id)}">View</button>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-open-user]").forEach(b => b.onclick = () => location.href = `profile.html?uid=${encodeURIComponent(b.dataset.openUser)}`);
}

// ─── More menu ─────────────────────────────────────────────────────
$("more").onclick = () => { if (!isSelf()) $("moreOverlay").classList.add("open"); };
$("moreCancel").onclick = () => $("moreOverlay").classList.remove("open");

$("mute").onclick = async () => {
  if (isSelf()) return toast("You cannot mute yourself.");
  const d = await getDoc(`users/${me.id}`);
  const s = new Set(d.mutedAuthors || []);
  s.has(targetId) ? s.delete(targetId) : s.add(targetId);
  d.mutedAuthors = [...s];
  muted = s;
  await putDoc(`users/${me.id}`, d, me.id, "");
  $("moreOverlay").classList.remove("open");
  render();
  toast(s.has(targetId) ? "User muted" : "User unmuted");
};

$("block").onclick = () => {
  if (isSelf()) return toast("You cannot block yourself.");
  confirmBox("Block user?", `Block ${nameOf(target)}? They won't be able to interact with you.`, async () => {
    const d = await getDoc(`users/${me.id}`);
    const s = new Set(d.blockedUsers || []);
    s.add(targetId);
    d.blockedUsers = [...s];
    await putDoc(`users/${me.id}`, d, me.id, "");
    $("moreOverlay").classList.remove("open");
    toast("User blocked");
  });
};

$("report").onclick = () => {
  if (isSelf()) return toast("You cannot report yourself.");
  confirmBox("Report user?", "Your report will be submitted to SPIKE.", async () => {
    await putDoc(`reports/${crypto.randomUUID()}`,
      { reporterId: me.id, targetId, reason: "profile", createdAt: now() },
      me.id, "reports");
    $("moreOverlay").classList.remove("open");
    toast("Report submitted.");
  });
};

// ─── Tabs ──────────────────────────────────────────────────────────
function activateTab(t) {
  tab = t;
  document.querySelectorAll(".profile-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  renderTab();
}
document.querySelectorAll(".profile-tab").forEach(b => b.onclick = () => activateTab(b.dataset.tab));
$("postsStat").onclick = () => activateTab("posts");

// ─── Navigation ────────────────────────────────────────────────────
$("chatBtn").onclick = () => location.href = "chat.html";
$("notificationBtn").onclick = () => location.href = "notifications.html";
$("profileBtn").onclick = () => me && (location.href = `profile.html?uid=${me.id}`);
$("follow").onclick = followToggle;
$("message").onclick = () => !isSelf() && (location.href = `chat.html?uid=${encodeURIComponent(targetId)}`);
$("audioCall").onclick = () => !isSelf() && (location.href = `chat.html?uid=${encodeURIComponent(targetId)}&call=audio`);
$("videoCall").onclick = () => !isSelf() && (location.href = `chat.html?uid=${encodeURIComponent(targetId)}&call=video`);

// ─── Theme ─────────────────────────────────────────────────────────
$("themeBtn").onclick = async () => {
  const current=window.SPIKE_SETTINGS?.theme||"dark";
  await window.spikeSetTheme(current==="light"?"dark":"light");
};

// ─── Init ──────────────────────────────────────────────────────────
async function init() {
  try {
    await window.spikeLoadSettings();
    window.spikeListenSettings();
    const { data: { user }, error } = await supabase.auth.getUser();
    if (error) throw error;
    if (!user) return location.href = "index.html";
    me = user;
    if (!targetId) targetId = me.id;

    // Load profile
    const { data: p, error: pe } = await supabase.from("profiles").select("*").eq("id", targetId).maybeSingle();
    if (pe) throw pe;
    if (!p) return toast("Profile not found.");
    target = p;

    targetDoc = await getDoc(`users/${targetId}`).catch(() => ({}));
    mineDoc = await getDoc(`users/${me.id}`).catch(() => ({}));
    following = new Set(mineDoc.following || []);
    muted = new Set(mineDoc.mutedAuthors || []);

    // Header avatar
    const mp = await supabase.from("profiles").select("display_name,username,avatar_url").eq("id", me.id).maybeSingle();
    if (mp.data) {
      const av = avatarOf(mp.data);
      $("headerAvatar").innerHTML = av ? `<img src="${esc(av)}">` : initials(mp.data);
    }

    render();
    await loadPosts();
  } catch (e) {
    console.error("Init error:", e);
    toast("Could not load profile.");
    $("content").innerHTML = `<div class="card empty">Unable to load profile. Please refresh.</div>`;
  }
}

init();
</script>

<script>document.getElementById("spikeBack")?.addEventListener("click",()=>{location.href="feed.html"});</script>

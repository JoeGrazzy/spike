async function uploadToSupabaseStorage(file){
  const allowed=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','audio/mpeg','audio/mp4','audio/webm','audio/ogg','application/pdf','text/plain','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
  if(!file?.type || !allowed.includes(file.type)) throw new Error('Unsupported attachment type.');
  if(file.size>25*1024*1024) throw new Error('Attachment must be 25 MB or smaller.');
  if(!me?.id) throw new Error('Authentication required.');
  const safe=(file.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${me.id}/${active}/${crypto.randomUUID()}-${safe}`;
  const {error}=await sb.storage.from('dm-media').upload(path,file,{contentType:file.type,upsert:false});
  if(error) throw error;
  const {data}=await sb.storage.from('dm-media').createSignedUrl(path,3600);
  if(!data?.signedUrl) throw new Error('Could not create a secure media URL.');
  return {path,signedUrl:data.signedUrl};
}

  }));

function mediaMarkup(m){if(!m.media_path)return'';const url=m.media_url;const type=m.media_mime_type||'';if(url&&type.startsWith('image/'))return`<div class="media-card"><img src="${esc(url)}" alt="${esc(m.body||'Image')}" loading="eager" decoding="async"></div>`;if(url&&type.startsWith('video/'))return`<div class="media-card"><video src="${esc(url)}" controls preload="metadata"></video></div>`;if(url&&type.startsWith('audio/')){const dur=m.voice_duration_seconds?`${Math.floor(m.voice_duration_seconds/60)}:${String(m.voice_duration_seconds%60).padStart(2,'0')}`:'';return`<div class="media-card voice-message-card"><div style="display:flex;align-items:center;gap:8px;padding:8px 10px 2px;font-size:10px;font-weight:800"><span>🎙️ Voice note</span><span style="margin-left:auto;opacity:.65">${esc(dur)}</span></div><audio src="${esc(url)}" controls preload="metadata" style="width:100%"></audio></div>`;}return`<a class="file-card" href="${esc(url||'#')}" ${url?'target="_blank" rel="noopener noreferrer"':''}><i class="fas fa-file"></i><span>${esc((m.body||m.media_path).split('/').pop())}</span></a>`}
function renderMessages(opts={}){const box=$('messages');const oldH=box.scrollHeight,oldTop=box.scrollTop,nearBottom=oldH===0||oldH-oldTop-box.clientHeight<48;if(!messages.length){box.innerHTML='<div class="empty">No messages yet.<br>Say hello 👋</div>';return}let day='';box.innerHTML=messages.map(m=>{const d=new Date(m.created_at),ds=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});let dayHtml='';if(ds!==day){day=ds;dayHtml=`<div class="day">${esc(ds)}</div>`}const mine=m.sender_id===me.id;const body=m.deleted_at?'Message deleted':m.body||'';const quoted=m.reply_to_id?messages.find(x=>x.id===m.reply_to_id):null;const reactions=(m.reactions||[]).map(r=>`<button class="reaction" data-react="${esc(m.id)}" data-r="${esc(r.reaction)}">${esc(r.reaction)}</button>`).join('');return`${dayHtml}<div class="row ${mine?'mine':''}" data-id="${esc(m.id)}"><div class="bubble-wrap"><div class="bubble ${m.deleted_at?'deleted':''}" data-msg="${esc(m.id)}" title="${esc(fullTime(m.created_at))}">${quoted?`<div class="reply-preview">↩ ${esc(quoted.body||'Attachment')}</div>`:''}${mediaMarkup(m)}${body&&!m.deleted_at?`<div class="bubble-text">${linkify(body)}</div>`:''}${m.deleted_at?'<div class="bubble-text">Message deleted</div>':''}<div class="meta"><span>${esc(new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}))}${m.edited_at?' · edited':''}</span>${mine?`<span>${m.read?'✓✓':'✓'}</span>`:''}${m.pinned?'<span>📌</span>':''}</div></div>${reactions?`<div class="reactions">${reactions}</div>`:''}</div></div>`}).join('');const newH=box.scrollHeight;if(opts.stickBottom||nearBottom){box.scrollTop=newH}else if(opts.prepend){box.scrollTop=oldTop+(newH-oldH)}else{box.scrollTop=Math.min(oldTop,Math.max(0,newH-box.clientHeight))}document.querySelectorAll('.bubble').forEach(b=>{b.addEventListener('contextmenu',e=>{e.preventDefault();showContext(b.dataset.msg,e.clientX,e.clientY)});b.addEventListener('dblclick',()=>toggleReact async function sendText(){
  const input=$('messageInput'),send=$('sendBtn'),body=(input?.value||'').trim();
  if(!body||!active)return;
  if(!me?.id)return toast('Your session is not ready. Please sign in again.');

  // Block protection is intentional. It prevents sending when either side
  // has blocked the other, while allowing non-friends to message.
  try{
    const {data:blockRow,error:blockError}=await sb
      .from('private_message_blocks')
      .select('blocker_id,blocked_id')
      .or(`and(blocker_id.eq.${me.id},blocked_id.eq.${active}),and(blocker_id.eq.${active},blocked_id.eq.${me.id})`)
      .limit(1)
      .maybeSingle();

    if(blockError)console.warn('block status check failed',blockError);
    if(blockRow){
      const iBlocked=blockRow.blocker_id===me.id;
      toast(iBlocked?'You blocked this user. Unblock them from Features to send messages.':'This user has blocked you.');
      return;
    }

    broadcastTyping(false);
    const payload={
      sender_id:me.id,
      recipient_id:active,
      body:left(body,10000),
      message_type:'text',
      read:false
    };
    if(reply)payload.reply_to_id=reply.id;

    if(send)send.disabled=true;
    const {data,error}=await sb.from('private_messages').insert(payload).select().single();

    if(error){
      console.error('private_messages INSERT failed',error);
      if(error.code==='42501'||/row-level security|RLS/i.test(error.message||'')){
        toast('Message blocked by your current privacy/block settings.');
      }else{
        toast(error.message||'Could not send message');
      }
      return;
    }

    input.value='';
    resizeInput(input);
    clearReply();
    await clearDraft();
    messages.push({...data,reactions:[]});
    renderMessages({stickBottom:true});
    updateThread(data);
    broadcastTyping(false);
  }catch(e){
    console.error('sendText',e);
    toast(e?.message||'Could not send message');
  }finally{
    if(send)send.disabled=false;
  }
}

async function startTypingChannel(){
  if(typingChannel){try{await sb.removeChannel(typingChannel)}catch{}typingChannel=null}
  clearTimeout(startTypingChannel.hideTimer);clearInterval(startTypingChannel.heartbeat);
  $('typing').textContent=''; if(!active)return;
  const room=`spike-typing-${[me.id,active].sort().join('-')}`;
  const ch=sb.channel(room,{config:{broadcast:{ack:true}}});
  typingChannel=ch;
  ch.on('broadcast',{event:'typing'},({payload})=>{
    if(!payload||payload.user_id===me.id||payload.user_id!==active)return;
    if(payload.active){
      const p=threads.find(x=>x.user_id===active)?.profile||friends.find(x=>x.user_id===active)||{id:active};
      $('typing').textContent=`${nameOf(p)} is typing…`;
      clearTimeout(startTypingChannel.hideTimer);
      startTypingChannel.hideTimer=setTimeout(()=>{$('typing').textContent=''},2500);
    }else{$('typing').textContent='';clearTimeout(startTypingChannel.hideTimer)}
  });
  await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};ch.subscribe(status=>{if(status==='SUBSCRIBED'||status==='CHANNEL_ERROR'||status==='TIMED_OUT')finish()});setTimeout(finish,4000)});
}
async function broadcastTyping(on){
  if(!typingChannel||!me||!active)return;
  const payload={user_id:me.id,active:!!on,ts:Date.now()};
  try{await typingChannel.send({type:'broadcast',event:'typing',payload})}catch(e){console.warn('typing broadcast',e)}
  if(on){
    clearInterval(startTypingChannel.heartbeat);
    startTypingChannel.heartbeat=setInterval(()=>{if(active&&typingChannel)typingChannel.send({type:'broadcast',event:'typing',payload:{user_id:me.id,active:true,ts:Date.now()}}).catch(()=>{})},1200);
  }else clearInterval(startTypingChannel.heartbeat);
}

async function toggleRecording(){

 if(recording){stopVoiceRecording(false);return}

  recordingMime=voiceMime();

  recording.onerror=()=>{stopVoiceRecording(true);toast('Voice recording failed')};
  recording.onstop=()=>finishVoiceRecording();
  recording.start(250);setVoicePanel(true);$('voiceRecLabel').textContent='Recording voice note…';$('voiceRecTime').textContent='00:00';
  recordingTimer=setInterval(updateVoiceTimer,500);toast('Recording started');

}

async function translateText(text,target='en'){
  const clean=String(text||'').trim();
  if(!clean)throw new Error('There is no text to translate.');
  if(clean.length>5000)throw new Error('Message is too long to translate.');
  const cacheKey='spike_translation_'+target+'_'+await hashString(clean);
  try{const cached=localStorage.getItem(cacheKey);if(cached)return cached}catch{}

  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(clean);
    const res=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},signal:controller.signal});
    if(!res.ok)throw new Error('Translation service returned '+res.status+'.');
    const data=await res.json();
    const translated=Array.isArray(data)&&Array.isArray(data[0])?data[0].map(x=>x?.[0]||'').join(''):'';
    if(!translated.trim())throw new Error('The translation service returned no translation.');
    try{localStorage.setItem(cacheKey,translated)}catch{}
    return translated;
  }catch(e){
    if(e?.name==='AbortError')throw new Error('Translation timed out. Please try again.');
    throw e;
  }finally{clearTimeout(timer)}
}

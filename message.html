async function init(){if(!db){notice('Messaging client failed to load.',true);return}try{const s=await db.auth.getSession();if(s.error)throw s.error;me=s.data.session?.user;if(!me){location.href='index.html?next='+encodeURIComponent(location.pathname+location.search);return}if(!uuidRE.test(other)||other===me.id)throw Error('Choose a valid SPIKE member to message.');

await loadMessages(true);channel=db.channel('spike-dm-'+[me.id,other].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages',filter:'recipient_id=eq.'+me.id},payload=>{const m=payload.new;if(m?.sender_id===other&&m.recipient_id===me.id&&!items.some(x=>x.id===m.id)){items.push(m);items.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));render();scrollBottom();db.from('private_messages').update({read:true}).eq('id',m.id).then(({error})=>{if(error)console.warn('[SPIKE message] read status:',error.message)})}}).subscribe();

function archiveChat(){try{const k='spike:archived-conversations:'+me.id;const a=JSON.parse(localStorage.getItem(k)||'[]');if(!a.includes(other))a.push(other);localStorage.setItem(k,JSON.stringify(a));$('status').textContent='Conversation archived on this device. Inbox filtering must support archived conversations to hide it there.'}catch(e){$('status').textContent='Could not archive this conversation on this device.'}closeMessageMenu()}
$('cancelReply').addEventListener('click',()=>{replyTo=null;$('replyPreview').classList.remove('show')});$('messageMenuShade').addEventListener('click',e=>{if(e.target===$('messageMenuShade'))closeMessageMenu()});$('messageMenuShade').querySelectorAll('[data-msg-action]').forEach(b=>b.addEventListener('click',()=>{const m=menuMessage;if(!m&&b.dataset.msgAction!=='close')return;switch(b.dataset.msgAction){case'reply':setReply(m);break;case'like':toggleLike(m);break;case'share':shareMessage(m);break;case'archive':archiveChat();break;case'delete':deleteMessage(m);break;default:closeMessageMenu()}}));
$('thread').addEventListener('touchstart',e=>{const el=e.target.closest('[data-message-id]');if(!el)return;const t=e.touches?.[0];swipeStart={id:el.dataset.messageId,x:t?.clientX||0,y:t?.clientY||0,el};pressTriggered=false;const id=el.dataset.messageId;pressTimer=setTimeout(()=>{pressTriggered=true;const m=items.find(x=>String(x.id)===id);if(m)openMessageMenu(m)},520)},{passive:true});$('thread').addEventListener('touchend',e=>{clearTimeout(pressTimer);if(!swipeStart)return;const t=e.changedTouches?.[0],dx=(t?.clientX||swipeStart.x)-swipeStart.x,dy=Math.abs((t?.clientY||swipeStart.y)-swipeStart.y);if(Math.abs(dx)>58&&Math.abs(dx)>dy*1.25&&!pressTriggered){const m=items.find(x=>String(x.id)===swipeStart.id);if(m){setReply(m);$('status').textContent='Replying to message. Swipe another message or type your reply.'}}swipeStart=null},{passive:true});$('thread').addEventListener('touchmove',e=>{clearTimeout(pressTimer);if(!swipeStart)return;const t=e.touches?.[0],dx=(t?.clientX||swipeStart.x)-swipeStart.x;if(Math.abs(dx)>8)swipeStart.el.classList.add('swiping')},{passive:true});$('thread').addEventListener('touchend',()=>document.querySelectorAll('.bubble.swiping').forEach(el=>el.classList.remove('swiping')),{passive:true});$('thread').addEventListener('contextmenu',e=>{const el=e.target.closest('[data-message-id]');if(!el)return;e.preventDefault();const m=items.find(x=>String(x.id)===el.dataset.messageId);if(m)openMessageMenu(m)});$('thread').addEventListener('click',e=>{const el=e.target.closest('[data-message-id]');if(!el||pressTriggered)return;const id=el.dataset.messageId,now=Date.now();if(lastTap.id===id&&now-lastTap.at<330){const m=items.find(x=>String(x.id)===id);if(m)toggleLike(m);lastTap={id:null,at:0}}else lastTap={id,at:now}});
function stopRecordingUI(){clearInterval(recordingTicker);recordingTicker=null;$('recordingTray').hidden=true;$('voiceNote').classList.remove('recording');$('voiceNote').innerHTML='<i class="fa-solid fa-microphone"></i>';$('voiceNote').setAttribute('aria-label','Record voice note')}
function cancelRecording(){if(recorder&&recorder.state!=='inactive'){recorder.onstop=null;recorder.stop()}if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());recordingStream=null;recordChunks=[];recordingBlob=null;stopRecordingUI();$('status').textContent='Voice note discarded.'}
async function sendRecordedBlob(blob){if(!blob)return;if(blob.size>1_500_000){$('status').textContent='Voice note is too large. Please record a shorter note.';return}const reader=new FileReader();reader.onload=async()=>{try{const {data,error}=await db.from('private_messages').insert({sender_id:me.id,recipient_id:other,body:reader.result,message_type:'voice'}).select('id,sender_id,recipient_id,body,message_type,read,created_at,deleted_at').single();if(error)throw error;items.push(data);render();scrollBottom();$('status').textContent='Voice note sent.'}catch(e){$('status').textContent='Voice note not sent: '+e.message}};reader.readAsDataURL(blob)}
$('voiceNote').addEventListener('click',async()=>{if(!me||!other)return;if(recorder?.state==='recording'){recorder.stop();return}if(!window.MediaRecorder||!navigator.mediaDevices?.getUserMedia){$('status').textContent='Voice recording is not supported in this browser.';return}try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordingStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());recordingStream=null;recordingBlob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});stopRecordingUI();if(recordingBlob.size){$('recordingTray').hidden=false;$('recordingTime').textContent='Ready to send';$('status').textContent='Voice note ready. Tap Send voice note or Cancel.'} };recorder.start();recordingStarted=Date.now();$('recordingTray').hidden=false;$('recordingTime').textContent='00:00';recordingTicker=setInterval(()=>{const sec=Math.floor((Date.now()-recordingStarted)/1000);$('recordingTime').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},250);$('voiceNote').classList.add('recording');$('voiceNote').innerHTML='<i class="fa-solid fa-stop"></i>';$('voiceNote').setAttribute('aria-label','Stop recording');$('status').textContent='Recording… tap stop, then send or discard.'}catch(e){$('status').textContent='Microphone permission was denied or unavailable.'}});$('cancelRecording').addEventListener('click',cancelRecording);$('sendRecording').addEventListener('click',()=>{if(recorder?.state==='recording'){recorder.stop();return}if(recordingBlob){const blob=recordingBlob;recordingBlob=null;$('recordingTray').hidden=true;sendRecordedBlob(blob)}});
$('body').addEventListener('input',()=>{const el=$('body');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px'});$('refresh').addEventListener('click',()=>loadMessages(true).catch(e=>notice(e.message,true)));window.addEventListener('pagehide',()=>{if(channel&&db)db.removeChannel(channel)});init();

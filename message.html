<!doctype html>
<html lang="en" translate="no"><head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14"><meta name="description" content="SPIKE direct conversation">
<title>SPIKE — Conversation</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://veagqanfilmbchlvlpcc.supabase.co" crossorigin>
<script src="js/supabase.min.js"></script>
<script src="js/spike-platform-bootstrap.js?v=rt-20261124"></script>
<script src="js/spike-call-engine.js?v=compact-end-toast-20261124" defer></script>
<script src="js/spike-media-routing.js" defer></script>
<script src="js/spike-theme-bootstrap.js"></script>
<link rel="stylesheet" href="css/perf.css">
<link rel="stylesheet" href="css/spike-identity.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/spike-mobile-safe-area.css">
<link rel="stylesheet" href="css/spike-messages.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<script src="js/spike-identity.js"></script>
<script src="js/spike-navigation.js"></script>
  <link rel="stylesheet" href="css/spike-modern-finish.css">
  <link rel="stylesheet" href="css/spike-conversation-refined.css?v=20261124">
  <link rel="stylesheet" href="css/spike-private-share.css?v=20261124-1">
<script src="js/spike-icons.js?v=semantic-icons-2"></script>
<style>.msg-sheet [data-msg-action]{display:flex;align-items:center;gap:12px}.msg-action-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--spike-accent,#00d5ff) 11%,transparent);color:var(--spike-accent,#00d5ff)}.msg-action-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.msg-sheet [data-msg-action=report] .msg-action-icon{color:#f6b94b;background:rgba(246,185,75,.12)}.msg-sheet [data-msg-action=delete] .msg-action-icon{color:#fb7185;background:rgba(251,113,133,.12)}@media(prefers-reduced-motion:reduce){.msg-sheet [data-msg-action]{transition:none!important}}</style>
<link rel="stylesheet" href="css/spike-icons.css?v=semantic-icons-2">
</head>
<body data-spike-page="message">
<script src="js/spike-dialog.js"></script>
<div class="msg-app msg-thread-app">
<header class="msg-topbar">
  <a class="msg-back" href="messages.html" aria-label="Back to inbox"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div class="msg-person" data-presence-user="" id="presenceHost">
    <div class="msg-avatar" id="avatar" aria-hidden="true">S</div>
    <div class="msg-person-text"><strong id="name">SPIKE member</strong><small id="sub">Direct message</small></div>
  </div>
  <div class="msg-call-actions">
    <button class="msg-icon" id="voiceCallBtn" disabled aria-disabled="true" type="button" aria-label="Voice call" title="Voice call"><span data-spike-icon="phone" data-spike-icon-size="20"></span></button>
    <button class="msg-icon" id="videoCallBtn" disabled aria-disabled="true" type="button" aria-label="Video call" title="Video call"><span data-spike-icon="video" data-spike-icon-size="20"></span></button>
  </div>
  <button class="msg-icon" id="refresh" type="button" aria-label="Refresh conversation" title="Refresh"><i class="fa-solid fa-rotate" aria-hidden="true"></i></button>
</header>

<main class="msg-main msg-thread-main" id="scroll">
  <div id="notice" class="msg-notice" role="status" hidden></div>
  <div id="connectionState" class="msg-connection" role="status" aria-live="polite" hidden></div>
  <button type="button" id="loadOlder" class="msg-load-older" hidden>Load older messages</button>
  <div id="thread" class="msg-thread"></div>
  <div id="typingIndicator" class="msg-typing" aria-live="polite" hidden></div>
</main>

<footer class="msg-composer-wrap">
  <div id="replyPreview" class="msg-reply"><div><strong>Reply</strong><span id="replyText"></span></div><button type="button" id="cancelReply" aria-label="Cancel reply">×</button></div>
  <div id="recordingTray" class="msg-recording" hidden><span id="voiceRecordingText">Recording voice note</span><button type="button" id="voiceRecordingCancel">Cancel</button></div>
  <div id="mediaPreview" class="msg-media-preview"><div><span id="mediaPreviewName"></span><small id="mediaPreviewMeta"></small></div><button type="button" id="removeMedia" aria-label="Remove attachment">×</button></div>
  <p id="status" class="msg-status" role="status" aria-live="polite"></p>
  <form id="form" class="msg-composer" autocomplete="off">
    <button type="button" id="mediaPlus" class="msg-icon" aria-label="Attach media" title="Attach media" disabled><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
    <button type="button" id="voiceNote" class="msg-icon" aria-label="Record voice note" title="Record voice note" disabled><i class="fa-solid fa-microphone" aria-hidden="true"></i></button>
    <textarea id="body" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message" disabled></textarea>
    <button id="send" class="msg-primary" type="submit" disabled>Send</button>
    <input id="mediaInput" type="file" hidden>
  </form>
</footer>
</div>

<div class="msg-sheet-shade" id="messageMenuShade">
  <div class="msg-sheet" role="dialog" aria-modal="true" aria-label="Message options">
    <p class="msg-sheet-sub" id="menuSub"></p>
    <button type="button" data-msg-action="reply"><span class="msg-action-icon" data-spike-icon="reply" data-spike-icon-size="17"></span>Reply</button>
    <button type="button" data-msg-action="copy"><span class="msg-action-icon" data-spike-icon="copy" data-spike-icon-size="17"></span>Copy text</button>
    <button type="button" data-msg-action="share"><span class="msg-action-icon" data-spike-icon="share" data-spike-icon-size="17"></span>Share</button>
    <button type="button" data-msg-action="like"><span class="msg-action-icon" data-spike-icon="heart" data-spike-icon-size="17"></span>React</button>
    <button type="button" data-msg-action="report"><span class="msg-action-icon" data-spike-icon="flag" data-spike-icon-size="17"></span>Report</button>
    <button type="button" class="danger" id="messageMenuDelete" data-msg-action="delete"><span class="msg-action-icon" data-spike-icon="trash" data-spike-icon-size="17"></span>Delete message</button>
    <button type="button" data-msg-action="close"><span class="msg-action-icon" data-spike-icon="x" data-spike-icon-size="17"></span>Cancel</button>
  </div>
</div>

<div class="msg-sheet-shade msg-private-share-shade" id="mediaShade" aria-hidden="true">
  <section class="msg-sheet msg-private-share" role="dialog" aria-modal="true" aria-labelledby="privateShareTitle" aria-describedby="privateShareDescription" tabindex="-1">
    <div class="msg-private-share-grabber" aria-hidden="true"></div>
    <div class="msg-sheet-head msg-private-share-head">
      <div class="msg-private-share-heading">
        <span class="msg-private-share-eyebrow">PRIVATE CONVERSATION</span>
        <strong id="privateShareTitle">Share privately</strong>
        <p id="privateShareDescription">Choose what you want to share in this chat.</p>
      </div>
      <button type="button" id="closeMediaSheet" aria-label="Close file picker"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="msg-private-share-options" aria-label="File types">
      <button type="button" class="msg-private-share-option" data-media-kind="image"><span class="msg-private-share-icon photo"><i class="fa-regular fa-image" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>Photos</strong><small>JPG, PNG, WebP and AVIF</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
      <button type="button" class="msg-private-share-option" data-media-kind="video"><span class="msg-private-share-icon video"><i class="fa-solid fa-film" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>Videos</strong><small>MP4 video files</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
      <button type="button" class="msg-private-share-option" data-media-kind="audio"><span class="msg-private-share-icon audio"><i class="fa-solid fa-music" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>Audio</strong><small>MP3, M4A and WebM audio</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
      <button type="button" class="msg-private-share-option" data-media-kind="pdf"><span class="msg-private-share-icon document"><i class="fa-regular fa-file-pdf" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>PDF documents</strong><small>Portable Document Format</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
      <button type="button" class="msg-private-share-option" data-media-kind="archive"><span class="msg-private-share-icon archive"><i class="fa-solid fa-file-zipper" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>Archives</strong><small>ZIP, RAR and 7Z files</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
      <button type="button" class="msg-private-share-option" data-media-kind="any"><span class="msg-private-share-icon browse"><i class="fa-regular fa-folder-open" aria-hidden="true"></i></span><span class="msg-private-share-copy"><strong>Browse all files</strong><small>Documents and other supported formats</small></span><i class="fa-solid fa-chevron-right msg-private-share-arrow" aria-hidden="true"></i></button>
    </div>
    <div class="msg-private-share-foot"><i class="fa-solid fa-lock" aria-hidden="true"></i><span>Shared only with members of this conversation</span><span class="msg-private-share-limit">Up to 50 MB</span></div>
  </section>
</div>

<script src="js/spike-messages.js?v=messages-v1-fix-20261124" defer></script>
<script type="module" src="js/spike-supabase-guard.js"></script>
</body></html>

<!doctype html><html lang="en"><head><title>SPIKE Theme Browser Test</title><script id="spike-theme-bootstrap">(()=>{try{let n=parseInt(localStorage.getItem('spike-feed-style')||'1',10);if(n<1||n>10)n=1;const light=n===6||n===8;document.documentElement.dataset.spikeStyle=String(n);document.documentElement.dataset.theme=light?'light':'dark';document.documentElement.dataset.spikeThemeId=String(n);document.documentElement.style.colorScheme=light?'light':'dark'}catch(_){}})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><link rel="stylesheet" href="css/theme.css">

    <link rel="stylesheet" href="css/spike-beauty-v1.css">
</head><body>
<button class="primary" id="p">Primary Action</button><a id="a" href="#">Accent Link</a><div class="card"><span class="muted">Muted text</span></div>
<pre id="out"></pre><script>
function rgb(s){const m=s.match(/rgba?\(([^)]+)\)/);if(!m)return null;return m[1].split(',').slice(0,3).map(x=>parseFloat(x.trim()));}
function lum(c){const x=c.map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*x[0]+.7152*x[1]+.0722*x[2]}
function contrast(a,b){return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)}
const s=new URLSearchParams(location.search).get('t')||'1';document.documentElement.dataset.spikeStyle=s;document.documentElement.dataset.theme=(s==='6'||s==='8')?'light':'dark';
requestAnimationFrame(()=>{const p=document.querySelector('#p'),a=document.querySelector('#a'),m=document.querySelector('.muted'),r=getComputedStyle(document.documentElement),pc=getComputedStyle(p),ac=getComputedStyle(a),mc=getComputedStyle(m);const pb=rgb(pc.backgroundColor),pt=rgb(pc.color),ab=rgb(ac.color),mb=rgb(mc.color),bg=rgb(getComputedStyle(document.body).backgroundColor);const out={theme:+s,actionBg:pc.backgroundImage,actionColor:pc.color,actionContrast:[...pc.backgroundImage.matchAll(/rgb\([^)]*\)|rgba\([^)]*\)/g)].map(x=>x[0]),linkColor:ac.color,muted:mc.color,body:bg};document.querySelector('#out').textContent=JSON.stringify(out);});
</script><script src="js/spike-navigation.js"></script>

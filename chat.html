<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Messages — SPIKE Ultra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070b10;
            --bg-surface: #0d1520;
            --bg-card: rgba(20, 32, 48, 0.7);
            --bg-glass: rgba(13, 21, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 168, 132, 0.3);
            --primary: #00a884;
            --primary-hover: #00c29a;
            --primary-glow: rgba(0, 168, 132, 0.4);
            --accent: #0ea5e9;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.4);
            --success: #00a884;
            --success-glow: rgba(0, 168, 132, 0.4);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; background-color: var(--bg-deep); color: var(--text-main); font-family: var(--font-main); }
        body { display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; min-height: 100dvh; }

        body::before, body::after {
            content: ''; position: fixed; width: 400px; height: 400px; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.1; pointer-events: none;
        }
        body::before { top: -100px; left: -100px; background: var(--primary); }
        body::after { bottom: -100px; right: -100px; background: var(--accent); }

        /* === HEADER === */
        .feed-header {
            width: 100%; max-width: 800px; padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 24px); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            border-bottom: 1px solid var(--border-color); background: var(--bg-glass); backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            gap: 8px;
        }
        .logo { 
            font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 800; letter-spacing: 1px; text-decoration: none; 
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; 
        }
        .user-nav { display: flex; align-items: center; gap: clamp(4px, 2vw, 12px); flex-wrap: wrap; }
        .nav-link { 
            color: var(--text-muted); text-decoration: none; font-size: clamp(0.75rem, 2.5vw, 0.88rem); font-weight: 600; 
            transition: var(--transition); cursor: pointer; padding: 6px 10px; border-radius: 8px; min-height: 36px; display: flex; align-items: center;
            position: relative;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary); background: rgba(0, 168, 132, 0.08); }

        .nav-link .unread-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error);
            color: white;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            display: none;
            box-shadow: 0 0 12px var(--error-glow);
        }
        .nav-link .unread-badge.visible {
            display: block;
        }

        .admin-heart-link {
            display: none !important;
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.08);
            animation: pulse-heart 1.5s infinite ease-in-out;
        }
        .admin-heart-link.visible { display: flex !important; }
        .admin-heart-link:hover { border-color: rgba(244, 63, 94, 0.6); background: rgba(244, 63, 94, 0.2); }
        .admin-heart-link .heart-icon { display: inline-block; font-size: clamp(1rem, 3vw, 1.2rem); }
        @keyframes pulse-heart { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* === MAIN === */
        .chat-main {
            flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px 12px; width: 100%; max-width: 620px; margin: auto; gap: 16px;
        }

        /* === CHAT LIST === */
        .chat-list-section {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .chat-list-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        }

        .chat-list-title {
            font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 800; color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-list-title .total-unread {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .btn-new-chat {
            background: var(--primary); color: white; border: none; padding: clamp(6px, 1.5vw, 8px) clamp(14px, 3vw, 18px);
            border-radius: 12px; font-family: var(--font-main); font-weight: 700; font-size: clamp(0.75rem, 2.2vw, 0.85rem);
            cursor: pointer; transition: var(--transition); box-shadow: 0 0 20px var(--primary-glow); min-height: 40px;
            touch-action: manipulation; display: flex; align-items: center; gap: 6px;
        }
        .btn-new-chat:active { transform: scale(0.95); }
        .btn-new-chat:hover { background: var(--primary-hover); }

        /* === Sort Options === */
        .sort-options {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .sort-btn {
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
            font-family: var(--font-main);
            min-height: 28px;
        }
        .sort-btn:active { transform: scale(0.95); }
        .sort-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .sort-btn:hover {
            background: rgba(255,255,255,0.05);
        }
        .sort-btn.active:hover {
            background: var(--primary-hover);
        }

        /* === Search === */
        .chat-search {
            width: 100%;
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }
        .chat-search-input {
            flex: 1;
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 14px);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: clamp(0.8rem, 2.2vw, 0.85rem);
            outline: none;
            transition: var(--transition);
            min-height: 36px;
        }
        .chat-search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .chat-search-input::placeholder {
            color: var(--text-muted);
        }
        .chat-search-clear {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            padding: 0 12px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            min-height: 36px;
            display: none;
            align-items: center;
        }
        .chat-search-clear.visible {
            display: flex;
        }
        .chat-search-clear:hover {
            background: rgba(244,63,94,0.1);
            color: var(--error);
        }

        /* ===== LOADING SHIMMER ===== */
        .chat-shimmer {
            display: flex; flex-direction: column; gap: 12px; width: 100%;
        }
        .chat-shimmer .shimmer-item {
            background: var(--bg-card); border-radius: 16px; padding: 14px 16px;
            display: flex; align-items: center; gap: 14px;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .chat-shimmer .shimmer-avatar {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .chat-shimmer .shimmer-line {
            height: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; flex: 1;
        }
        .chat-shimmer .shimmer-line.short { width: 60px; flex: none; }

        /* === CHAT ITEM === */
        .chat-item {
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 16px; padding: clamp(12px, 3vw, 16px);
            display: flex; align-items: center; gap: clamp(12px, 3vw, 16px);
            cursor: pointer; transition: var(--transition); width: 100%;
            touch-action: manipulation;
            animation: fadeInItem 0.2s ease-out;
            position: relative;
        }
        .chat-item:active { transform: scale(0.98); }
        .chat-item:hover { border-color: var(--border-glow); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); }
        .chat-item.pinned {
            border-color: var(--primary);
            background: rgba(0, 168, 132, 0.05);
        }
        .chat-item.pinned::before {
            content: '📌';
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 0.8rem;
        }
        .chat-item.hidden {
            display: none;
        }

        @keyframes fadeInItem {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-avatar {
            width: clamp(48px, 12vw, 56px); height: clamp(48px, 12vw, 56px); border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #005c4b);
            display: flex; align-items: center; justify-content: center; font-weight: 700; color: white;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem); overflow: hidden; flex-shrink: 0;
            position: relative;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-avatar .online-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-surface);
        }
        .chat-avatar .online-status.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success-glow);
        }
        .chat-avatar .online-status.offline {
            background: var(--text-muted);
        }

        .chat-info {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 3px;
        }
        .chat-name {
            font-weight: 700; font-size: clamp(0.9rem, 2.8vw, 1rem); color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-name .chat-pin-icon {
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .chat-last-msg {
            font-size: clamp(0.78rem, 2.2vw, 0.85rem); color: var(--text-muted); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-last-msg .sender-name { color: var(--primary); font-weight: 600; }

        .chat-meta {
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;
        }
        .chat-time {
            font-size: clamp(0.6rem, 1.8vw, 0.7rem); color: var(--text-muted);
        }
        .chat-unread {
            background: var(--primary); color: white; font-size: 0.6rem; font-weight: 800;
            padding: 2px 8px; border-radius: 12px; min-width: 20px; text-align: center;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .chat-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: var(--transition);
        }
        .chat-item:hover .chat-actions,
        .chat-item:focus-within .chat-actions {
            opacity: 1;
        }
        .chat-action-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            padding: 2px 6px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: var(--transition);
        }
        .chat-action-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }
        .chat-action-btn.danger:hover {
            background: rgba(244,63,94,0.1);
            color: var(--error);
        }

        .empty-state { text-align: center; color: var(--text-muted); font-size: clamp(0.85rem, 2.5vw, 0.9rem); padding: 40px 20px; }
        .empty-state .icon { font-size: clamp(2.5rem, 6vw, 3rem); margin-bottom: 12px; display: block; }

        /* === NEW CHAT MODAL === */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 7, 13, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); z-index: 10000; display: none; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active { display: flex; opacity: 1; animation: modalFadeIn 0.4s ease-out; }
        @keyframes modalFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes modalSlideUp { 0% { opacity: 0; transform: translateY(30px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .modal-card {
            background: var(--bg-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color); border-radius: clamp(20px, 5vw, 28px);
            padding: clamp(24px, 5vw, 32px) clamp(20px, 4vw, 28px); max-width: 440px; width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8); animation: modalSlideUp 0.3s ease-out;
        }

        .modal-title {
            font-size: clamp(1.1rem, 3.5vw, 1.2rem); font-weight: 800; color: var(--text-main); text-align: center; margin-bottom: 16px;
        }

        .modal-search-input {
            width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color);
            border-radius: 12px; padding: clamp(12px, 3vw, 14px) clamp(14px, 3.5vw, 16px);
            color: var(--text-main); font-family: var(--font-main); font-size: clamp(0.9rem, 2.5vw, 0.95rem);
            outline: none; transition: var(--transition); min-height: 44px;
        }
        .modal-search-input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .user-list {
            display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; margin-top: 12px;
        }
        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

        .user-item {
            display: flex; align-items: center; gap: 12px; padding: clamp(8px, 2vw, 10px) clamp(10px, 3vw, 14px);
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 12px;
            cursor: pointer; transition: var(--transition); touch-action: manipulation;
        }
        .user-item:active { transform: scale(0.98); }
        .user-item:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.12); }

        .user-avatar-sm {
            width: clamp(36px, 9vw, 40px); height: clamp(36px, 9vw, 40px); border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #005c4b);
            display: flex; align-items: center; justify-content: center; font-weight: 700; color: white;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem); overflow: hidden; flex-shrink: 0;
        }
        .user-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

        .user-name { font-weight: 600; font-size: clamp(0.85rem, 2.5vw, 0.92rem); color: var(--text-main); flex: 1; }
        .user-status { font-size: clamp(0.6rem, 1.8vw, 0.7rem); color: var(--text-muted); }

        .modal-actions {
            display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap;
        }
        .modal-btn {
            flex: 1; min-width: 80px; padding: clamp(10px, 3vw, 14px); border-radius: 14px; border: none;
            font-family: var(--font-main); font-weight: 700; font-size: clamp(0.85rem, 2.5vw, 0.92rem);
            cursor: pointer; transition: var(--transition); touch-action: manipulation; min-height: 44px;
        }
        .modal-btn:active { transform: scale(0.95); }
        .modal-btn.primary { background: var(--primary); color: white; box-shadow: 0 0 20px var(--primary-glow); }
        .modal-btn.primary:hover { background: var(--primary-hover); }
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color); }
        .modal-btn.secondary:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }

        /* === CONFIRMATION MODAL === */
        .confirm-modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 7, 13, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-modal-overlay.active { display: flex; opacity: 1; animation: modalFadeIn 0.4s ease-out; }
        @keyframes modalFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes modalSlideUp { 0% { opacity: 0; transform: translateY(30px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .confirm-modal {
            background: var(--bg-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border-color);
            border-radius: clamp(20px, 5vw, 28px); padding: clamp(20px, 5vw, 32px) clamp(16px, 4vw, 28px); max-width: 440px; width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8); animation: modalSlideUp 0.3s ease-out; position: relative; overflow: hidden;
        }
        .confirm-modal::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 0%, var(--toast-glow-color) 0%, transparent 60%); opacity: 0.08; pointer-events: none; z-index: 0;
        }
        .confirm-modal > * { position: relative; z-index: 1; }

        .confirm-modal-icon {
            width: clamp(56px, 15vw, 72px); height: clamp(56px, 15vw, 72px); border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: clamp(1.8rem, 5vw, 2.2rem); margin: 0 auto 16px auto; position: relative;
        }
        .confirm-modal-icon::before {
            content: ''; position: absolute; inset: -3px; border-radius: 50%; background: var(--toast-glow-color); opacity: 0.12; filter: blur(12px);
        }
        .confirm-modal-icon .icon { position: relative; z-index: 1; }

        .confirm-modal.danger { --toast-glow-color: rgba(244, 63, 94, 0.4); }
        .confirm-modal.danger .confirm-modal-icon { background: rgba(244, 63, 94, 0.1); border: 2px solid rgba(244, 63, 94, 0.2); color: var(--error); }
        .confirm-modal.warning { --toast-glow-color: rgba(245, 158, 11, 0.4); }
        .confirm-modal.warning .confirm-modal-icon { background: rgba(245, 158, 11, 0.1); border: 2px solid rgba(245, 158, 11, 0.2); color: var(--warning); }

        .confirm-modal-title { font-size: clamp(1.1rem, 3.5vw, 1.3rem); font-weight: 800; color: var(--text-main); text-align: center; letter-spacing: -0.3px; line-height: 1.3; }
        .confirm-modal-message { font-size: clamp(0.8rem, 2.5vw, 0.92rem); color: var(--text-muted); text-align: center; line-height: 1.6; margin: 8px 0 4px 0; padding: 0 4px; }
        .confirm-modal-details { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; margin: 8px 0 12px 0; font-size: clamp(0.75rem, 2.2vw, 0.82rem); color: var(--text-muted); line-height: 1.5; }

        .confirm-modal-actions { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
        .confirm-modal-actions .btn-confirm {
            flex: 1; min-width: 100px; padding: clamp(10px, 3vw, 14px); border-radius: 14px; border: none; font-family: var(--font-main); 
            font-weight: 700; font-size: clamp(0.8rem, 2.5vw, 0.92rem); cursor: pointer; transition: var(--transition); touch-action: manipulation;
        }
        .confirm-modal-actions .btn-confirm:active { transform: scale(0.95); }
        .confirm-modal-actions .btn-confirm.primary { background: var(--primary); color: white; box-shadow: 0 0 16px var(--primary-glow); }
        .confirm-modal-actions .btn-confirm.primary:hover { background: var(--primary-hover); }
        .confirm-modal-actions .btn-confirm.danger { background: var(--error); color: white; box-shadow: 0 0 16px var(--error-glow); }
        .confirm-modal-actions .btn-confirm.danger:hover { background: #e11d48; }
        .confirm-modal-actions .btn-confirm.secondary { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); border: 1px solid var(--border-color); }
        .confirm-modal-actions .btn-confirm.secondary:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-main); }

        /* === TOAST === */
        .toast-container {
            position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-30px); z-index: 9999;
            width: calc(100% - 32px); max-width: 420px; opacity: 0; visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .toast-container.active { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast-content {

    <script type="module">
        // ===== 🚀 ULTIMATE CHAT PAGE =====
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, doc, getDoc, getDocs, onSnapshot, query, orderBy, 
            where, addDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, setDoc,
            deleteDoc, limit
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAILS = ["eletexjoeytex@gmail.com"];

        // ===== STATE =====
        const CACHE_VERSION = 'v3';
        let currentUser = null;
        let currentUserUid = null; // for offline update
        let currentUserData = {};
        let chatListUnsubscribe = null;
        let toastTimeout = null;
        let chatCache = {};
        let avatarCache = {};
        let isFirstLoad = true;
        let currentSort = 'recent';
        let searchTerm = '';
        let allChats = [];
        let pinnedChats = new Set();

        // ===== ONLINE STATUS MANAGEMENT (unified) =====
        function updateUserOnlineStatus(status) {
            if (!currentUserUid) return;
            const userRef = doc(db, "users", currentUserUid);
            updateDoc(userRef, {
                onlineStatus: status,
                lastSeen: serverTimestamp()
            }).catch(err => console.error("Error updating online status:", err));
        }

        // ===== TOAST =====
        window.showToast = function(message, type = 'success', title = '') {
            const toast = document.getElementById('globalToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }

            toast.className = 'toast-container';
            const titles = { success: '✓ Success', error: '✕ Error', warning: '⚠️ Warning' };
            const icons = { success: '✓', error: '✕', warning: '⚠️' };

            toastTitle.textContent = title || titles[type] || 'Notification';
            toastMessage.textContent = message;
            toastIcon.textContent = icons[type] || '✓';

            void toast.offsetWidth;
            toast.classList.add(type, 'active');

            toastTimeout = setTimeout(() => { dismissToast(); }, 3500);
        };

        window.dismissToast = function() {
            const toast = document.getElementById('globalToast');
            if (!toast.classList.contains('active')) return;
            toast.classList.add('removing');
            setTimeout(() => {
                toast.className = 'toast-container';
                toast.classList.remove('removing');
                if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }
            }, 400);
        };

        // ===== CONFIRMATION MODAL =====
        window.showConfirmModal = function(options) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('confirmModalOverlay');
                const modal = document.getElementById('confirmModal');
                const icon = document.getElementById('confirmModalIcon');
                const title = document.getElementById('confirmModalTitle');
                const message = document.getElementById('confirmModalMessage');
                const confirmBtn = document.getElementById('confirmModalConfirm');
                const cancelBtn = document.getElementById('confirmModalCancel');

                modal.className = 'confirm-modal ' + (options.type || 'warning');
                icon.textContent = options.icon || '⚠️';
                title.textContent = options.title || 'Are you sure?';
                message.textContent = options.message || 'This action cannot be undone.';
                
                if (options.details) {
                    const detailsEl = document.getElementById('confirmModalDetails');
                    detailsEl.innerHTML = options.details;
                    detailsEl.style.display = 'block';
                } else {
                    document.getElementById('confirmModalDetails').style.display = 'none';
                }

                confirmBtn.textContent = options.confirmText || 'Confirm';
                confirmBtn.className = 'btn-confirm ' + (options.confirmType || 'danger');
                cancelBtn.textContent = options.cancelText || 'Cancel';

                window._pendingConfirm = { resolve };
                overlay.classList.add('active');
            });
        };

        window.closeConfirmModal = function() {
            document.getElementById('confirmModalOverlay').classList.remove('active');
        };

        window.handleConfirm = function() {
            if (window._pendingConfirm) {
                window._pendingConfirm.resolve(true);
                window._pendingConfirm = null;
            }
            closeConfirmModal();
        };

        window.handleCancel = function() {
            if (window._pendingConfirm) {
                window._pendingConfirm.resolve(false);
                window._pendingConfirm = null;
            }
            closeConfirmModal();
        };

        document.getElementById('confirmModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) handleCancel();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') handleCancel();
        });

        // ===== HELPERS =====
        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return '';
            let date;
            if (timestamp?.toDate) {
                date = timestamp.toDate();
            } else {
                date = new Date(timestamp);
            }
            if (isNaN(date.getTime())) return '';
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return `${diff}s ago`;
            const minutes = Math.floor(diff / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function getCachedAvatar(uid) {
            try {
                const cached = localStorage.getItem(`avatar_${uid}`);
                if (cached) return cached;
            } catch (e) {}
            return null;
        }

        function setCachedAvatar(uid, url) {
            if (!url) return;
            try { localStorage.setItem(`avatar_${uid}`, url); } catch (e) {}
        }

        // ===== NAVIGATION =====
        window.goToFeed = function() { window.location.href = "feed.html"; };
        window.goToMessages = function() { window.location.href = "chat.html"; };
        window.goToFriends = function() { window.location.href = "friends.html"; };
        window.goToProfile = function() { window.location.href = "profile.html"; };
        window.goToAdmin = function() { window.location.href = "administrator.html"; };
        window.goToGroups = function() { window.location.href = "community.html"; };

        // ===== BUILD CHAT ITEM (with onlineStatus) =====
        function buildChatItem(chat) {
            const avatarURL = chat.avatar || getCachedAvatar(chat.userId) || '';
            const avatarHTML = avatarURL ? 
                `<img src="${avatarURL}" alt="${escapeHTML(chat.name)}">` : 
                getInitials(chat.name);
            
            // Use onlineStatus (boolean) and lastSeen
            const isOnline = chat.isOnline === true;
            const statusClass = isOnline ? 'online' : 'offline';
            const timeStr = formatTimeAgo(chat.lastMessageTime);
            const unread = chat.unread || 0;
            const isPinned = pinnedChats.has(chat.chatId);
            
            let messagePreview = chat.lastMessage || 'No messages yet';
            if (messagePreview.length > 50) {
                messagePreview = messagePreview.substring(0, 50) + '...';
            }
            
            return `
                <div class="chat-item ${isPinned ? 'pinned' : ''}" data-chatid="${chat.chatId}" data-userid="${chat.userId}" onclick="openChat('${chat.chatId}', '${escapeHTML(chat.name)}', '${chat.userId}')">
                    <div class="chat-avatar">
                        ${avatarHTML}
                        <span class="online-status ${statusClass}"></span>
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">
                            ${escapeHTML(chat.name)}
                            ${isPinned ? '<span class="chat-pin-icon">📌</span>' : ''}
                        </div>
                        <div class="chat-last-msg">${escapeHTML(messagePreview)}</div>
                    </div>
                    <div class="chat-meta">
                        ${timeStr ? `<div class="chat-time">${timeStr}</div>` : ''}
                        ${unread > 0 ? `<div class="chat-unread">${unread}</div>` : ''}
                    </div>
                    <div class="chat-actions">
                        <button class="chat-action-btn" onclick="event.stopPropagation(); togglePinChat('${chat.chatId}')" title="Pin/Unpin">
                            📌
                        </button>
                        <button class="chat-action-btn danger" onclick="event.stopPropagation(); deleteChat('${chat.chatId}', '${escapeHTML(chat.name)}')" title="Delete">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }

        // ===== RENDER CHATS =====
        function renderChats(chats) {
            const container = document.getElementById('chatList');
            
            if (!chats || chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">💬</span>
                        No conversations yet.
                        <p style="font-size:0.8rem; margin-top:8px;">Start a new chat by clicking the + button above.</p>
                    </div>
                `;
                return;
            }

            // Apply search filter
            let filtered = chats;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = chats.filter(c => 
                    c.name.toLowerCase().includes(term) || 
                    (c.lastMessage && c.lastMessage.toLowerCase().includes(term))
                );
            }

            // Apply sort
            if (currentSort === 'unread') {
                filtered.sort((a, b) => (b.unread || 0) - (a.unread || 0));
            } else if (currentSort === 'alphabetical') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else {
                // Recent
                filtered.sort((a, b) => {
                    const timeA = a.lastMessageTime?.toMillis?.() || 0;
                    const timeB = b.lastMessageTime?.toMillis?.() || 0;
                    return timeB - timeA;
                });
            }

            // Separate pinned
            const pinned = filtered.filter(c => pinnedChats.has(c.chatId));
            const unpinned = filtered.filter(c => !pinnedChats.has(c.chatId));
            const sorted = [...pinned, ...unpinned];

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        No chats match "${escapeHTML(searchTerm)}"
                        <p style="font-size:0.8rem; margin-top:8px;">Try a different search term.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const chat of sorted) {
                html += buildChatItem(chat);
            }
            container.innerHTML = html;
        }

        // ===== LOAD CHATS =====
        function loadChats() {
            const container = document.getElementById('chatList');
            
            if (chatListUnsubscribe) chatListUnsubscribe();

            const chatsRef = collection(db, "chats");
            const q = query(chatsRef, where("participants", "array-contains", currentUser.uid));
            
            chatListUnsubscribe = onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) {
                    renderChats([]);
                    return;
                }

                const chatPromises = [];
                const chatDocs = [];
                let totalUnread = 0;
                
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const participants = data.participants || [];
                    const otherUserId = participants.find(uid => uid !== currentUser.uid);
                    if (otherUserId) {
                        chatDocs.push({ id: docSnap.id, data, otherUserId });
                        totalUnread += (data.unreadCount?.[currentUser.uid] || 0);
                    }
                });

                // Update unread badge
                updateUnreadBadge(totalUnread);

                // Fetch user data
                for (const chat of chatDocs) {
                    chatPromises.push(
                        getDoc(doc(db, "users", chat.otherUserId))
                            .then(userDoc => {
                                if (userDoc.exists()) {
                                    const userData = userDoc.data();
                                    const avatar = userData.avatar || userData.photoURL || '';
                                    if (avatar) setCachedAvatar(chat.otherUserId, avatar);
                                    
                                    // Check if pinned
                                    if (userData.pinnedChats && userData.pinnedChats[chat.id]) {
                                        pinnedChats.add(chat.id);
                                    }
                                    
                                    // Read onlineStatus (boolean) and lastSeen
                                    const isOnline = userData.onlineStatus === true;
                                    
                                    return {
                                        chatId: chat.id,
                                        userId: chat.otherUserId,
                                        name: userData.name || userData.displayName || 'User',
                                        avatar: avatar || getCachedAvatar(chat.otherUserId) || '',
                                        lastMessage: chat.data.lastMessage || 'New conversation',
                                        lastMessageTime: chat.data.lastMessageTime || null,
                                        unread: chat.data.unreadCount?.[currentUser.uid] || 0,
                                        isOnline: isOnline,
                                        lastSeen: userData.lastSeen || null
                                    };
                                }
                                return null;
                            })
                            .catch(() => null)
                    );
                }

                const results = await Promise.all(chatPromises);
                const chats = results.filter(c => c !== null);
                allChats = chats;

                renderChats(chats);

            }, (error) => {
                console.error("Chat list error:", error);
                if (error.code === 'permission-denied') {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">🔒</span>
                            Permission error loading chats.
                            <p style="font-size:0.8rem; margin-top:8px;">Please check your Firebase security rules.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">⚠️</span>
                            Error loading chats: ${error.message}
                        </div>
                    `;
                }
            });
        }

        // ===== UPDATE UNREAD BADGE =====
        function updateUnreadBadge(total) {
            const badge = document.getElementById('chatUnreadBadge');
            const totalEl = document.querySelector('.total-unread');
            
            if (total > 0) {
                badge.classList.add('visible');
                badge.textContent = total > 99 ? '99+' : total;
                if (totalEl) {
                    totalEl.textContent = `${total} unread`;
                    totalEl.style.display = 'inline-block';
                }
            } else {
                badge.classList.remove('visible');
                if (totalEl) {
                    totalEl.style.display = 'none';
                }
            }
        }

        // ===== OPEN CHAT =====
        window.openChat = function(chatId, userName, userId) {
            window.location.href = `chat_room.html?chatId=${chatId}&userId=${userId}&name=${encodeURIComponent(userName)}`;
        };

        // ===== TOGGLE PIN CHAT =====
        window.togglePinChat = async function(chatId) {
            try {
                const userRef = doc(db, "users", currentUser.uid);
                const isPinned = pinnedChats.has(chatId);
                
                if (isPinned) {
                    pinnedChats.delete(chatId);
                    await updateDoc(userRef, {
                        [`pinnedChats.${chatId}`]: false
                    });
                    showToast("Chat unpinned", "success", "Unpinned");
                } else {
                    pinnedChats.add(chatId);
                    await updateDoc(userRef, {
                        [`pinnedChats.${chatId}`]: true
                    });
                    showToast("Chat pinned", "success", "Pinned");
                }
                renderChats(allChats);
            } catch (err) {
                console.error("Error toggling pin:", err);
                showToast("Failed to toggle pin", "error", "Error");
            }
        };

        // ===== DELETE CHAT =====
        window.deleteChat = async function(chatId, chatName) {
            const confirmed = await showConfirmModal({
                type: 'danger',
                icon: '🗑️',
                title: 'Delete Conversation',
                message: `Are you sure you want to delete this conversation with ${chatName}?`,
                details: 'This will permanently delete all messages in this conversation.',
                confirmText: 'Delete',
                confirmType: 'danger',
                cancelText: 'Cancel'
            });

            if (!confirmed) return;

            try {
                const messagesRef = collection(db, "chats", chatId, "messages");
                const snapshot = await getDocs(messagesRef);
                const deletePromises = snapshot.docs.map(d => deleteDoc(d.ref));
                await Promise.all(deletePromises);
                await deleteDoc(doc(db, "chats", chatId));
                showToast("Chat deleted successfully", "success", "Deleted");
                // Remove from UI
                const chatElement = document.querySelector(`[data-chatid="${chatId}"]`);
                if (chatElement) chatElement.remove();
            } catch (err) {
                console.error("Error deleting chat:", err);
                showToast("Failed to delete chat", "error", "Delete Failed");
            }
        };

        // ===== SORT CHATS =====
        window.sortChats = function(sortType) {
            currentSort = sortType;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sort === sortType);
            });
            renderChats(allChats);
        };

        // ===== SEARCH CHATS =====
        window.searchChats = function(term) {
            searchTerm = term.trim();
            const clearBtn = document.getElementById('searchClear');
            if (searchTerm) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
            renderChats(allChats);
        };

        window.clearSearch = function() {
            document.getElementById('chatSearchInput').value = '';
            searchTerm = '';
            document.getElementById('searchClear').classList.remove('visible');
            renderChats(allChats);
        };

        // ===== NEW CHAT MODAL =====
        let userListCache = [];

        window.openNewChat = function() {
            document.getElementById('newChatModal').classList.add('active');
            loadUsers();
            document.getElementById('userSearchInput').value = '';
            setTimeout(() => document.getElementById('userSearchInput').focus(), 100);
        };

        window.closeNewChat = function() {
            document.getElementById('newChatModal').classList.remove('active');
        };

        async function loadUsers(searchTerm = '') {
            const container = document.getElementById('userList');
            
            try {
                const snapshot = await getDocs(collection(db, "users"));
                
                const users = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const uid = docSnap.id;
                    if (uid === currentUser.uid) return;
                    
                    const name = data.name || data.displayName || data.username || 'User';
                    const email = data.email || '';
                    const avatar = data.avatar || data.photoURL || '';
                    // onlineStatus boolean
                    const isOnline = data.onlineStatus === true;
                    
                    if (searchTerm) {
                        const search = searchTerm.toLowerCase();
                        if (!name.toLowerCase().includes(search) && !email.toLowerCase().includes(search)) {
                            return;
                        }
                    }
                    
                    users.push({
                        uid: uid,
                        name: name,
                        email: email,
                        avatar: avatar || getCachedAvatar(uid) || '',
                        isOnline: isOnline
                    });
                });
                
                users.sort((a, b) => a.name.localeCompare(b.name));
                userListCache = users;
                renderUserList(users);
            } catch (err) {
                console.error("Error loading users:", err);
                container.innerHTML = `<div style="text-align:center;color:var(--error);padding:20px;">Failed to load users.</div>`;
            }
        }

        function renderUserList(users) {
            const container = document.getElementById('userList');
            
            if (users.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">No users found.</div>`;
                return;
            }
            
            let html = '';
            for (const user of users) {
                const avatarHTML = user.avatar ? 
                    `<img src="${user.avatar}" alt="${escapeHTML(user.name)}">` : 
                    getInitials(user.name);
                
                const statusText = user.isOnline ? '🟢 Online' : '⚪ Offline';
                
                html += `
                    <div class="user-item" onclick="startNewChat('${user.uid}', '${escapeHTML(user.name)}')">
                        <div class="user-avatar-sm">${avatarHTML}</div>
                        <span class="user-name">${escapeHTML(user.name)}</span>
                        <span class="user-status">${statusText}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        document.getElementById('userSearchInput')?.addEventListener('input', function(e) {
            const term = e.target.value.trim();
            if (term) {
                const filtered = userListCache.filter(u => 
                    u.name.toLowerCase().includes(term.toLowerCase()) ||
                    u.email.toLowerCase().includes(term.toLowerCase())
                );
                renderUserList(filtered);
            } else {
                renderUserList(userListCache);
            }
        });

        window.startNewChat = async function(userId, userName) {
            try {
                const chatId = [currentUser.uid, userId].sort().join('_');
                const chatRef = doc(db, "chats", chatId);
                const chatSnap = await getDoc(chatRef);
                
                if (!chatSnap.exists()) {
                    await setDoc(chatRef, {
                        participants: [currentUser.uid, userId],
                        createdAt: serverTimestamp(),
                        lastMessage: 'New conversation',
                        lastMessageTime: serverTimestamp(),
                        unreadCount: { [currentUser.uid]: 0, [userId]: 0 }
                    });
                }
                
                closeNewChat();
                window.location.href = `chat_room.html?chatId=${chatId}&userId=${userId}&name=${encodeURIComponent(userName)}`;
            } catch (err) {
                console.error("Error starting chat:", err);
                showToast("Failed to start chat.", "error", "Chat Error");
            }
        };

        document.getElementById('newChatModal')?.addEventListener('click', function(e) {
            if (e.target === this) closeNewChat();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeNewChat();
            }
            // Ctrl+F to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('chatSearchInput').focus();
            }
        });

        // ===== AUTH STATE =====
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Sign out: set offline if we have a uid
                if (currentUserUid) {
                    updateUserOnlineStatus(false);
                }
                window.location.href = "index.html";
                return;
            }
            currentUser = user;
            currentUserUid = user.uid;
            
            // Set online status on load
            updateUserOnlineStatus(true);
            
            // Check admin
            const adminLink = document.getElementById('adminNavLink');
            if (user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                adminLink.classList.add('visible');
            }
            
            // Load user data
            try {
                const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    // Load pinned chats
                    const pinned = currentUserData.pinnedChats || {};
                    Object.keys(pinned).forEach(key => {
                        if (pinned[key]) pinnedChats.add(key);
                    });
                }
            } catch (err) {
                console.error("Error loading user data:", err);
            }
            
            loadChats();
        });

        // ===== ONLINE STATUS: beforeunload & visibility =====
        window.addEventListener('beforeunload', () => {
            if (currentUserUid) {
                updateUserOnlineStatus(false);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (currentUserUid) {
                    updateUserOnlineStatus(false);
                }
            } else {
                if (currentUserUid) {
                    updateUserOnlineStatus(true);
                }
            }
        });

        console.log("🔥 🚀 SPIKE Chat page loaded with unified online status!");
        console.log("✨ Features: Pinned chats, Search, Sort, Online status (onlineStatus boolean), and more!");
        console.log("⌨️ Shortcuts: Ctrl+F to search, Esc to close modals");
    </script>
</head>
<body>

    <header class="feed-header">
        <a href="feed.html" class="logo">SPIKE</a>
        <div class="user-nav">
            <a href="administrator.html" class="nav-link admin-heart-link" id="adminNavLink" title="Admin Dashboard" onclick="goToAdmin()">
                <span class="heart-icon">❤️</span>
            </a>
            <a href="community.html" class="nav-link" onclick="goToGroups()" title="Groups">🏠</a>
            <a href="feed.html" class="nav-link" onclick="goToFeed()">📱 Feed</a>
            <a href="chat.html" class="nav-link active" id="chatNavLink">
                💬 Chat
                <span class="unread-badge" id="chatUnreadBadge"></span>
            </a>
            <a href="friends.html" class="nav-link" onclick="goToFriends()">👥 Friends</a>
            <a href="profile.html" class="nav-link" onclick="goToProfile()">👤 Profile</a>
        </div>
    </header>

    <main class="chat-main">
        
        <!-- Chat List -->
        <div class="chat-list-section">
            <div class="chat-list-header">
                <div class="chat-list-title">
                    💬 Messages
                    <span class="total-unread" style="display:none;">0 unread</span>
                </div>
                <button class="btn-new-chat" onclick="openNewChat()">✚ New Chat</button>
            </div>

            <!-- Search -->
            <div class="chat-search">
                <input type="text" class="chat-search-input" id="chatSearchInput" placeholder="Search conversations... (Ctrl+F)" oninput="searchChats(this.value)">
                <button class="chat-search-clear" id="searchClear" onclick="clearSearch()">✕</button>
            </div>

            <!-- Sort Options -->
            <div class="sort-options">
                <button class="sort-btn active" data-sort="recent" onclick="sortChats('recent')">Recent</button>
                <button class="sort-btn" data-sort="unread" onclick="sortChats('unread')">Unread</button>
                <button class="sort-btn" data-sort="alphabetical" onclick="sortChats('alphabetical')">A-Z</button>
            </div>
            
            <div id="chatList">
                <div class="chat-shimmer">
                    <div class="shimmer-item">
                        <div class="shimmer-avatar"></div>
                        <div>
                            <div class="shimmer-line" style="width:120px;margin-bottom:8px;"></div>
                            <div class="shimmer-line" style="width:200px;"></div>
                        </div>
                        <div class="shimmer-line short"></div>
                    </div>
                    <div class="shimmer-item">
                        <div class="shimmer-avatar"></div>
                        <div>
                            <div class="shimmer-line" style="width:100px;margin-bottom:8px;"></div>
                            <div class="shimmer-line" style="width:180px;"></div>
                        </div>
                        <div class="shimmer-line short"></div>
                    </div>
                    <div class="shimmer-item">
                        <div class="shimmer-avatar"></div>
                        <div>
                            <div class="shimmer-line" style="width:140px;margin-bottom:8px;"></div>
                            <div class="shimmer-line" style="width:220px;"></div>
                        </div>
                        <div class="shimmer-line short"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- === NEW CHAT MODAL === -->
    <div id="newChatModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">✚ New Conversation</div>
            
            <input type="text" id="userSearchInput" class="modal-search-input" placeholder="Search users by name or email...">
            
            <div class="user-list" id="userList">
                <div style="text-align:center;color:var(--text-muted);padding:20px;">Loading users...</div>
            </div>
            
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeNewChat()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- === CONFIRMATION MODAL === -->
    <div id="confirmModalOverlay" class="confirm-modal-overlay">
        <div id="confirmModal" class="confirm-modal danger">
            <div class="confirm-modal-icon"><span class="icon" id="confirmModalIcon">⚠️</span></div>
            <div class="confirm-modal-title" id="confirmModalTitle">Are you sure?</div>
            <div class="confirm-modal-message" id="confirmModalMessage">This action cannot be undone.</div>
            <div id="confirmModalDetails" class="confirm-modal-details" style="display:none;"></div>
            <div class="confirm-modal-actions">
                <button class="btn-confirm secondary" id="confirmModalCancel" onclick="handleCancel()">Cancel</button>
                <button class="btn-confirm danger" id="confirmModalConfirm" onclick="handleConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- === TOAST === -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div class="toast-icon-wrapper"><span class="icon" id="toastIcon">✓</span></div>
            <div class="toast-text-group">
                <div class="toast-title" id="toastTitle">Success</div>
                <div class="toast-message" id="toastMessage">Action completed successfully.</div>
            </div>
            <button class="toast-close-btn" onclick="dismissToast()">✕</button>
            <div class="toast-progress"></div>
        </div>
    </div>

    <footer class="feed-footer">
        <p>&copy; 2026 SPIKE Ultra. All rights reserved.</p>
    </footer>

</body>
</html>

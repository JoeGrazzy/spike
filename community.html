<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Community — SPIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070b10;
            --bg-surface: #0d1520;
            --bg-card: rgba(20, 32, 48, 0.7);
            --bg-glass: rgba(13, 21, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 168, 132, 0.3);
            --primary: #00a884;
            --primary-hover: #00c29a;
            --primary-glow: rgba(0, 168, 132, 0.4);
            --accent: #0ea5e9;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.4);
            --success: #00a884;
            --success-glow: rgba(0, 168, 132, 0.4);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --gold: #ffd700;
            --purple: #a855f7;
        }

        body.light-mode {
            --bg-deep: #f0f4fa;
            --bg-surface: #e8edf4;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f1824;
            --text-muted: #5a6e8a;
            --border-glow: rgba(0, 168, 132, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; background-color: var(--bg-deep); color: var(--text-main); font-family: var(--font-main); }
        body { display: flex; flex-direction: column; align-items: center; position: relative; }

        body::before, body::after {
            content: ''; position: fixed; width: 400px; height: 400px; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.08; pointer-events: none;
        }
        body::before { top: -100px; left: -100px; background: var(--primary); }
        body::after { bottom: -100px; right: -100px; background: var(--gold); }

        /* ===== HEADER ===== */
        .community-header {
            width: 100%; max-width: 800px; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-glass); backdrop-filter: blur(16px);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            gap: 12px; min-height: 56px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-right { display: flex; align-items: center; gap: 4px; }
        .back-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: clamp(0.8rem, 2vw, 0.85rem); font-weight: 600;
            cursor: pointer; padding: 6px 10px; border-radius: 8px;
            transition: var(--transition); font-family: var(--font-main);
            min-height: 36px; display: flex; align-items: center;
            touch-action: manipulation;
        }
        .back-btn:active { transform: scale(0.95); }
        .back-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .logo {
            font-size: clamp(1rem, 3.5vw, 1.2rem); font-weight: 800; letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer; text-decoration: none;
        }
        .nav-link {
            color: var(--text-muted); text-decoration: none; font-size: clamp(0.9rem, 3vw, 1.1rem); transition: var(--transition); 
            position: relative; width: clamp(34px, 8vw, 40px); height: clamp(34px, 8vw, 40px); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--border-color); cursor: pointer; min-height: 44px; min-width: 44px;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-link:active { transform: scale(0.92); }
        .nav-link:hover, .nav-link.active { color: var(--text-main); background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); }
        .nav-avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .nav-badge { 
            position: absolute; top: -4px; right: -4px;
            background: var(--error); color: white;
            font-size: 0.55rem; font-weight: 800;
            padding: 2px 6px; border-radius: 10px;
            display: none; box-shadow: 0 0 12px var(--error-glow);
            min-width: 18px; text-align: center; line-height: 1.2;
            z-index: 10;
        }
        .nav-badge.active { display: inline-block; }
        .admin-heart-link {
            display: none !important;
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.08);
            animation: pulse-heart 1.5s infinite ease-in-out;
        }
        .admin-heart-link.visible { display: flex !important; }
        .admin-heart-link:hover { border-color: rgba(244, 63, 94, 0.6); background: rgba(244, 63, 94, 0.2); }
        .admin-heart-link .heart-icon { display: inline-block; font-size: clamp(1rem, 3vw, 1.2rem); }
        @keyframes pulse-heart { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* ===== SECRET CREATE BUTTON ===== */
        .secret-create-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 168, 132, 0.05);
            border: 1px solid rgba(0, 168, 132, 0.05);
            color: transparent;
            cursor: pointer;
            z-index: 50;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .secret-create-trigger:hover {
            background: rgba(0, 168, 132, 0.02);
            border-color: rgba(0, 168, 132, 0.02);
        }
        .secret-create-trigger:active {
            transform: scale(0.9);
        }
        .secret-create-trigger .hint-text {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            font-weight: 600;
        }
        .secret-create-trigger:hover .hint-text {
            opacity: 0.3;
        }

        /* ===== HIDDEN CREATE COMMUNITY CARD ===== */
        .create-community-card {
            background: var(--bg-card); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: clamp(20px, 4vw, 24px);
            padding: clamp(20px, 4vw, 24px) clamp(16px, 4vw, 20px);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
            animation: slideDown 0.3s ease-out;
            position: relative;
        }
        .create-community-card.visible {
            display: flex;
        }
        .create-community-card:focus-within {
            border-color: var(--border-glow);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 168, 132, 0.05);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .create-community-card .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .create-community-card .card-title .badge {
            font-size: 0.6rem;
            background: rgba(0, 168, 132, 0.12);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .create-community-card .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .create-community-card .input-row input, .create-community-card .input-row select {
            flex: 1;
            min-width: 150px;
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
        }
        .create-community-card .input-row input:focus, .create-community-card .input-row select:focus {
            border-color: var(--primary);
            background: rgba(7, 11, 16, 0.85);
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.1);
        }
        .create-community-card .input-row input::placeholder, .create-community-card .input-row select::placeholder {
            color: var(--text-muted);
        }
        .create-community-card .input-row select option {
            background: var(--bg-surface);
            color: var(--text-main);
        }
        .create-community-card .input-row .btn-create {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            box-shadow: 0 0 20px var(--primary-glow);
            min-height: 44px;
            touch-action: manipulation;
        }
        .create-community-card .input-row .btn-create:active { transform: scale(0.95); }
        .create-community-card .input-row .btn-create:hover { background: var(--primary-hover); }
        .create-community-card .input-row .btn-create:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .create-community-card .close-create {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            padding: 4px 8px;
        }
        .create-community-card .close-create:hover { color: var(--text-main); }

        /* ===== TABS ===== */
        .community-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            padding: 4px;
            width: 100%;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .community-tabs::-webkit-scrollbar { height: 0; }
        .community-tabs .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            white-space: nowrap;
            min-height: 40px;
            touch-action: manipulation;
            flex: 1;
            text-align: center;
        }
        .community-tabs .tab-btn:active { transform: scale(0.95); }
        .community-tabs .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .community-tabs .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 0 24px var(--primary-glow); }
        .community-tabs .tab-btn .count {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.08);
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 4px;
        }
        .community-tabs .tab-btn.active .count { background: rgba(255,255,255,0.15); }

        /* ===== SEARCH BAR ===== */
        .search-wrapper {
            width: 100%;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
        }
        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,168,132,0.1);
        }
        .search-wrapper input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }
        .search-wrapper .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            padding: 4px;
        }
        .search-wrapper .search-clear.visible {
            display: block;
        }
        .search-wrapper .search-clear:hover {
            color: var(--text-main);
        }

        /* ===== COMMUNITY LIST ===== */
        .community-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .community-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: clamp(18px, 4vw, 20px);
            padding: clamp(16px, 3vw, 20px);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .community-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--primary); opacity: 0;
            transition: var(--transition);
        }
        .community-card:hover {
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .community-card:hover::before { opacity: 1; }
        .community-card:active { transform: scale(0.98); }
        .community-card .enter-hint {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 0.6rem;
            color: var(--text-muted);
            opacity: 0.3;
            transition: var(--transition);
        }
        .community-card:hover .enter-hint { opacity: 0.8; color: var(--primary); }

        .community-card .community-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .community-card .community-avatar {
            width: clamp(48px, 12vw, 56px);
            height: clamp(48px, 12vw, 56px);
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #005c4b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }
        .community-card .community-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .community-card .community-info {
            flex: 1;
            min-width: 0;
        }
        .community-card .community-name {
            font-size: clamp(0.95rem, 2.8vw, 1.05rem);
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .community-card .community-name .community-type {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 12px;
            background: rgba(0, 168, 132, 0.12);
            color: var(--primary);
            text-transform: uppercase;
        }
        .community-card .community-name .community-type.private {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-muted);
        }
        .community-card .community-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .community-card .community-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .community-card .community-description {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .community-card .community-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .community-card .community-actions .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 14px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            min-height: 32px;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .community-card .community-actions .action-btn:active { transform: scale(0.95); }
        .community-card .community-actions .action-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .community-card .community-actions .action-btn.joined {
            background: rgba(0, 168, 132, 0.08);
            color: var(--primary);
            border-color: rgba(0, 168, 132, 0.15);
        }
        .community-card .community-actions .action-btn.joined:hover {
            background: rgba(0, 168, 132, 0.15);
        }
        .community-card .community-actions .action-btn.pending {
            background: rgba(245, 158, 11, 0.08);
            color: var(--warning);
            border-color: rgba(245, 158, 11, 0.15);
        }
        .community-card .community-actions .action-btn .badge-count {
            background: rgba(255,255,255,0.08);
            padding: 0 6px;
            border-radius: 10px;
            font-size: 0.6rem;
        }
        .community-card .community-actions .action-btn.admin-btn {
            color: var(--accent);
            border-color: rgba(14, 165, 233, 0.15);
        }
        .community-card .community-actions .action-btn.admin-btn:hover {
            background: rgba(14, 165, 233, 0.08);
        }
        .community-card .community-actions .action-btn.delete-btn {
            color: var(--error);
            border-color: rgba(244, 63, 94, 0.15);
        }
        .community-card .community-actions .action-btn.delete-btn:hover {
            background: rgba(244, 63, 94, 0.08);
        }

        .community-card .member-avatars {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .community-card .member-avatars .mini-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00796b, var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            font-weight: 700;
            color: white;
            overflow: hidden;
            border: 2px solid var(--bg-deep);
        }
        .community-card .member-avatars .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .community-card .member-avatars .more-count {
            font-size: 0.55rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 0 4px;
        }

        .community-card .admin-tag {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 12px;
            background: rgba(0, 168, 132, 0.08);
            color: var(--primary);
        }
        .community-card .creator-tag {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
        }

        /* ===== LOADING SHIMMER ===== */
        .community-shimmer {
            width: 100%; padding: 20px 12px;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .community-shimmer .shimmer-card {
            background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 12px;
        }
        .community-shimmer .shimmer-line {
            height: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin: 8px 0;
        }
        .community-shimmer .shimmer-line.short { width: 40%; }
        .community-shimmer .shimmer-line.medium { width: 60%; }
        .community-shimmer .shimmer-line.long { width: 80%; }
        .community-shimmer .shimmer-avatar {
            width: 48px; height: 48px; border-radius: 14px;
            background: rgba(255,255,255,0.05); display: inline-block;
        }
        .community-shimmer .shimmer-row { display: flex; gap: 12px; align-items: center; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: clamp(30px, 6vw, 40px) 20px;
            background: var(--bg-card);
            border-radius: clamp(18px, 4vw, 20px);
            border: 1px solid var(--border-color);
        }
        .empty-state .icon { font-size: clamp(2.5rem, 6vw, 3.5rem); display: block; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .empty-state p { font-size: 0.85rem; line-height: 1.5; }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; top: 28px; left: 50%;
            transform: translateX(-50%) translateY(-30px); z-index: 9999;
            width: calc(100% - 32px); max-width: 420px;
            opacity: 0; visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .toast-container.active {
            opacity: 1; visibility: visible;

                message.textContent = options.message || 'This action cannot be undone.';

                const communityData = communitySnap.data();

                if (communityData.createdBy !== currentUser.uid && !communityData.admins?.includes(currentUser.uid) && !isAdmin) {
                    showToast("You don't have permission to delete this community", "error", "Permission Denied");
                    return;
                }

                const members = communityData.members || [];
                for (const memberId of members) {
                    try {
                        const userRef = doc(db, "users", memberId);
                        await updateDoc(userRef, {
                            joinedCommunities: arrayRemove(communityId)
                        });
                    } catch (e) {
                        console.warn("Could not remove community from user:", memberId);
                    }
                }

                await deleteDoc(communityRef);
                showToast(`🗑️ Community "${communityData.name}" deleted`, "error", "Deleted");

            } catch (error) {
                console.error("Error deleting community:", error);
                showToast("Failed to delete community", "error", "Error");
            }
        };

        // ===== APPROVE JOIN REQUEST =====
        window.approveJoinRequest = async function(communityId, userId) {
            if (!currentUser) return;

            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();

                if (!communityData.admins?.includes(currentUser.uid) && communityData.createdBy !== currentUser.uid && !isAdmin) {
                    showToast("You don't have permission", "error", "Permission Denied");
                    return;
                }

                await updateDoc(communityRef, {
                    joinRequests: arrayRemove(userId),
                    members: arrayUnion(userId),
                    memberCount: increment(1),
                    pendingRequests: increment(-1)
                });

                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    joinedCommunities: arrayUnion(communityId)
                });

                showToast("✅ Join request approved!", "success", "Approved");

            } catch (error) {
                console.error("Error approving join request:", error);
                showToast("Failed to approve request", "error", "Error");
            }
        };

        // ===== REJECT JOIN REQUEST =====
        window.rejectJoinRequest = async function(communityId, userId) {
            if (!currentUser) return;

            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();

                if (!communityData.admins?.includes(currentUser.uid) && communityData.createdBy !== currentUser.uid && !isAdmin) {
                    showToast("You don't have permission", "error", "Permission Denied");
                    return;
                }

                await updateDoc(communityRef, {
                    joinRequests: arrayRemove(userId),
                    pendingRequests: increment(-1)
                });

                showToast("❌ Join request rejected", "warning", "Rejected");

            } catch (error) {
                console.error("Error rejecting join request:", error);
                showToast("Failed to reject request", "error", "Error");
            }
        };

        // ===== PROMOTE TO ADMIN =====
        window.promoteToAdmin = async function(communityId, userId) {
            if (!currentUser) return;

            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();

                if (communityData.createdBy !== currentUser.uid && !isAdmin) {
                    showToast("Only the creator can promote admins", "error", "Permission Denied");
                    return;
                }

                await updateDoc(communityRef, {
                    admins: arrayUnion(userId)
                });

                showToast("👑 User promoted to admin!", "success", "Promoted");

            } catch (error) {
                console.error("Error promoting user:", error);
                showToast("Failed to promote user", "error", "Error");
            }
        };

        // ===== DEMOTE ADMIN =====
        window.demoteAdmin = async function(communityId, userId) {
            if (!currentUser) return;

            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();

                if (communityData.createdBy !== currentUser.uid && !isAdmin) {
                    showToast("Only the creator can demote admins", "error", "Permission Denied");
                    return;
                }

                if (userId === communityData.createdBy) {
                    showToast("Cannot demote the community creator", "warning", "Action Denied");
                    return;
                }

                await updateDoc(communityRef, {
                    admins: arrayRemove(userId)
                });

                showToast("🔽 Admin demoted", "warning", "Demoted");

            } catch (error) {
                console.error("Error demoting admin:", error);
                showToast("Failed to demote admin", "error", "Error");
            }
        };

        // ===== UPDATE COMMUNITY =====
        window.updateCommunity = async function(communityId, data) {
            if (!currentUser) return;

            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();

                if (!communityData.admins?.includes(currentUser.uid) && communityData.createdBy !== currentUser.uid && !isAdmin) {
                    showToast("You don't have permission", "error", "Permission Denied");
                    return;
                }

                await updateDoc(communityRef, data);
                showToast("Community updated successfully!", "success", "Updated");

            } catch (error) {
                console.error("Error updating community:", error);
                showToast("Failed to update community", "error", "Error");
            }
        };

        // ===== SHOW COMMUNITY ADMIN PANEL =====
        window.showCommunityAdmin = async function(communityId) {
            try {
                const communityRef = doc(db, "communities", communityId);
                const communitySnap = await getDoc(communityRef);

                if (!communitySnap.exists()) {
                    showToast("Community not found", "error", "Error");
                    return;
                }

                const communityData = communitySnap.data();
                const joinRequests = communityData.joinRequests || [];

                if (joinRequests.length === 0) {
                    showToast("No pending join requests", "success", "All Clear");
                    return;
                }

                let details = '📋 Pending Join Requests:\n\n';
                for (const uid of joinRequests) {
                    const user = await getUserData(uid);
                    const name = user?.name || user?.displayName || uid;
                    details += `• ${name}\n`;
                }
                details += `\nTotal: ${joinRequests.length} pending`;

                const confirmed = await showConfirmModal({
                    type: 'warning',
                    icon: '👥',
                    title: 'Manage Join Requests',
                    message: 'Review and manage pending join requests.',
                    details: details,
                    confirmText: 'Approve All',
                    confirmType: 'primary',
                    cancelText: 'Close'
                });

                if (confirmed) {
                    for (const uid of joinRequests) {
                        try {
                            const userRef = doc(db, "users", uid);
                            await updateDoc(userRef, {
                                joinedCommunities: arrayUnion(communityId)
                            });
                        } catch (e) {}
                    }
                    await updateDoc(communityRef, {
                        members: arrayUnion(...joinRequests),
                        memberCount: increment(joinRequests.length),
                        joinRequests: [],
                        pendingRequests: 0
                    });
                    showToast(`✅ Approved ${joinRequests.length} requests`, "success", "Approved");
                }

            } catch (error) {
                console.error("Error showing community admin:", error);
                showToast("Failed to load admin panel", "error", "Error");
            }
        };

        // ===== RENDER COMMUNITIES =====
        function renderCommunities(communities) {
            const container = document.getElementById('communitiesList');
            const emptyState = document.getElementById('emptyState');
            const shimmer = document.getElementById('communityShimmer');

            if (shimmer) shimmer.style.display = 'none';

            if (!communities || communities.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            let html = '';
            communities.forEach(community => {
                const isMember = joinedCommunityIds.includes(community.id);
                const isCreator = community.createdBy === currentUser?.uid;
                const isAdmin = community.admins?.includes(currentUser?.uid) || false;
                const isPrivate = community.isPrivate || community.communityType === 'private';
                const memberCount = community.memberCount || 0;
                const name = community.name || 'Unnamed Community';
                const description = community.description || 'No description yet.';
                const memberAvatars = community.members || [];
                const displayMembers = memberAvatars.slice(0, 3);
                const moreCount = memberAvatars.length - 3;
                const pendingRequests = community.pendingRequests || 0;

                const avatarLetter = name.charAt(0).toUpperCase();

                let memberAvatarsHTML = '';
                if (displayMembers.length > 0) {
                    displayMembers.forEach(uid => {
                        const initial = uid.charAt(0).toUpperCase();
                        memberAvatarsHTML += `
                            <div class="mini-avatar">${initial}</div>
                        `;
                    });
                    if (moreCount > 0) {
                        memberAvatarsHTML += `<span class="more-count">+${moreCount}</span>`;
                    }
                }

                let actionHTML = '';
                if (isMember) {
                    actionHTML = `
                        <button class="action-btn joined" onclick="event.stopPropagation(); leaveCommunity('${community.id}')">✅ Joined</button>
                        ${isCreator || isAdmin ? `
                            <button class="action-btn admin-btn" onclick="event.stopPropagation(); showCommunityAdmin('${community.id}')">🛡️ Admin</button>
                            <button class="action-btn delete-btn" onclick="event.stopPropagation(); deleteCommunity('${community.id}')">🗑️ Delete</button>
                        ` : ''}
                    `;
                } else {
                    if (isPrivate) {
                        const hasRequested = community.joinRequests?.includes(currentUser?.uid) || false;
                        if (hasRequested) {
                            actionHTML = `<button class="action-btn pending" onclick="event.stopPropagation();">⏳ Pending Request</button>`;
                        } else {
                            actionHTML = `<button class="action-btn" onclick="event.stopPropagation(); joinCommunity('${community.id}')">🔒 Request to Join</button>`;
                        }
                    } else {
                        actionHTML = `<button class="action-btn" onclick="event.stopPropagation(); joinCommunity('${community.id}')">➕ Join</button>`;
                    }
                }

                let adminBadge = '';
                if (isCreator) adminBadge = `<span class="creator-tag">👑 Creator</span>`;
                else if (isAdmin) adminBadge = `<span class="admin-tag">🛡️ Admin</span>`;

                let pendingBadge = '';
                if ((isCreator || isAdmin) && pendingRequests > 0) {
                    pendingBadge = `<span class="badge-count" style="background:rgba(245,158,11,0.15);color:var(--warning);">${pendingRequests} pending</span>`;
                }

                html += `
                    <div class="community-card" onclick="viewCommunity('${community.id}')">
                        <span class="enter-hint">▶ Click to enter</span>
                        <div class="community-header-row">
                            <div class="community-avatar">${avatarLetter}</div>
                            <div class="community-info">
                                <div class="community-name">
                                    ${name}
                                    <span class="community-type ${isPrivate ? 'private' : ''}">${isPrivate ? '🔒 Private' : '🌍 Public'}</span>
                                    ${pendingBadge}
                                </div>
                                <div class="community-meta">
                                    <span>👥 ${memberCount} members</span>
                                    ${adminBadge ? `<span>${adminBadge}</span>` : ''}
                                    ${community.createdAtDate ? `<span>📅 ${new Date(community.createdAtDate).toLocaleDateString()}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="community-description">${description}</div>
                        ${memberAvatarsHTML ? `<div class="member-avatars">${memberAvatarsHTML}</div>` : ''}
                        <div class="community-actions" onclick="event.stopPropagation();">
                            ${actionHTML}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ===== FILTER COMMUNITIES =====
        function filterCommunities() {
            let filtered = [...allCommunities];
            const search = document.getElementById('searchCommunities').value.toLowerCase();
            searchTerm = search;

            if (search) {
                filtered = filtered.filter(g =>
                    g.name?.toLowerCase().includes(search) ||
                    g.description?.toLowerCase().includes(search)
                );
            }

            if (currentTab === 'joined') {
                filtered = filtered.filter(g => joinedCommunityIds.includes(g.id));
            } else if (currentTab === 'created') {
                filtered = filtered.filter(g => g.createdBy === currentUser?.uid);
            } else if (currentTab === 'admin') {
                filtered = filtered.filter(g => g.admins?.includes(currentUser?.uid) || g.createdBy === currentUser?.uid);
            }

            renderCommunities(filtered);
        }

        // ===== UPDATE TABS =====
        function updateTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === currentTab);
            });

            const totalCount = allCommunities.length;
            const joinedCount = allCommunities.filter(g => joinedCommunityIds.includes(g.id)).length;
            const createdCount = allCommunities.filter(g => g.createdBy === currentUser?.uid).length;
            const adminCount = allCommunities.filter(g => g.admins?.includes(currentUser?.uid) || g.createdBy === currentUser?.uid).length;

            document.getElementById('tabAllCount').textContent = totalCount;
            document.getElementById('tabJoinedCount').textContent = joinedCount;
            document.getElementById('tabCreatedCount').textContent = createdCount;
            document.getElementById('tabAdminCount').textContent = adminCount;

            filterCommunities();
        }

        // ===== LISTEN TO COMMUNITIES =====
        function listenCommunities() {
            if (unsubscribeCommunities) unsubscribeCommunities();

            const q = query(collection(db, "communities"), orderBy("createdAt", "desc"));

            unsubscribeCommunities = onSnapshot(q, (snapshot) => {
                const communities = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    communities.push({ ...data, id: doc.id });
                });
                allCommunities = communities;
                updateTabs();
            }, (error) => {
                console.error("Communities listener error:", error);
                showToast("Error loading communities", "error", "Database Error");
            });
        }

        // ===== LOAD USER'S JOINED COMMUNITIES =====
        async function loadJoinedCommunities() {
            if (!currentUser) return;

            try {
                const userRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    userData = data;
                    joinedCommunityIds = data.joinedCommunities || [];
                }
            } catch (error) {
                console.error("Error loading joined communities:", error);
            }
        }

        // ===== SEARCH INPUT HANDLING =====
        document.getElementById('searchCommunities').addEventListener('input', function() {
            const clearBtn = document.getElementById('searchClear');
            if (this.value.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
            filterCommunities();
        });

        document.getElementById('searchClear').addEventListener('click', function() {
            const input = document.getElementById('searchCommunities');
            input.value = '';
            this.classList.remove('visible');
            filterCommunities();
            input.focus();
        });

        // ===== TAB SWITCHING =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentTab = this.dataset.tab;
                updateTabs();
            });
        });

        // ===== KEYBOARD SHORTCUT =====
        document.getElementById('communityNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('createCommunityBtn').click();
            }
        });

        // ===== AUTH =====
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                if (currentUserUid) updateUserOnlineStatus(false);
                window.location.href = "index.html";
                return;
            }

            currentUser = user;
            currentUserUid = user.uid;
            // Set online
            updateUserOnlineStatus(true);

            isAdmin = ADMIN_EMAILS.includes(user.email?.toLowerCase());

            const adminLink = document.getElementById('adminNavLink');
            if (isAdmin) {
                adminLink.classList.add('visible');
            }

            await loadJoinedCommunities();
            listenCommunities();

            updateNotificationBadge();

            console.log('👥 Community page loaded');
            console.log('👤 User:', user.email);
            console.log('📚 Joined communities:', joinedCommunityIds.length);
            console.log('👑 Admin:', isAdmin);
            console.log('🔒 Create Community is HIDDEN - Click the secret button to reveal!');
        });

        // ===== ONLINE STATUS: beforeunload & visibility =====
        window.addEventListener('beforeunload', () => {
            if (currentUserUid) updateUserOnlineStatus(false);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (currentUserUid) updateUserOnlineStatus(false);
            } else {
                if (currentUserUid) updateUserOnlineStatus(true);
            }
        });

        // ===== NOTIFICATION BADGE =====
        function updateNotificationBadge() {
            if (!currentUser) return;
            const badge = document.getElementById('notifBadge');
            if (!badge) return;
            const notifRef = collection(db, "users", currentUser.uid, "notifications");
            onSnapshot(notifRef, (snapshot) => {
                const unread = snapshot.docs.filter(d => !d.data().read).length;
                if (unread > 0) {
                    badge.textContent = unread > 99 ? '99+' : unread;
                    badge.classList.add('active');
                } else {
                    badge.classList.remove('active');
                }
            });
        }

        // ===== EXPOSE FUNCTIONS =====
        window.createCommunity = createCommunity;
        window.joinCommunity = joinCommunity;
        window.leaveCommunity = leaveCommunity;
        window.deleteCommunity = deleteCommunity;
        window.approveJoinRequest = approveJoinRequest;
        window.rejectJoinRequest = rejectJoinRequest;
        window.promoteToAdmin = promoteToAdmin;
        window.demoteAdmin = demoteAdmin;
        window.updateCommunity = updateCommunity;
        window.showCommunityAdmin = showCommunityAdmin;
        window.viewCommunity = viewCommunity;
        window.toggleCreateForm = toggleCreateForm;
        window.goToFeed = goToFeed;
        window.goToFriends = goToFriends;
        window.goToMessages = goToMessages;
        window.goToNotifications = goToNotifications;
        window.goToProfile = goToProfile;
        window.goToAdmin = goToAdmin;
        window.goToSettings = goToSettings;
        window.showToast = showToast;
        window.dismissToast = dismissToast;
        window.handleConfirm = handleConfirm;
        window.handleCancel = handleCancel;

        console.log('👥 SPIKE Community page loaded with UNIFIED ONLINE STATUS!');
        console.log('🔐 Click the invisible button at bottom-right to create a community');
    </script>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="community-header">
        <div class="header-left">
            <button class="back-btn" onclick="goToFeed()">← Back</button>
            <a href="feed.html" class="logo">SPIKE</a>
        </div>
        <div class="header-right">
            <a href="administrator.html" class="nav-link admin-heart-link" id="adminNavLink" title="Admin Dashboard">
                <span class="heart-icon">🎴</span>
            </a>
            <a href="settings.html" class="nav-link" title="Settings">⚙️</a>
            <a href="notifications.html" class="nav-link" title="Notifications" style="position:relative;">
                🔔
                <span class="nav-badge" id="notifBadge">0</span>
            </a>
            <a href="profile.html" class="nav-link active" id="profileNavLink" title="Profile">👤</a>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="community-main">

        <!-- ===== HIDDEN CREATE COMMUNITY CARD ===== -->
        <div class="create-community-card" id="createCommunityForm">
            <button class="close-create" onclick="toggleCreateForm()">✕</button>
            <div class="card-title">
                🏠 Create Community
                <span class="badge">Admin Only</span>
            </div>
            <div class="input-row">
                <input type="text" id="communityNameInput" placeholder="Enter community name..." maxlength="50">
                <input type="text" id="communityDescInput" placeholder="Community description (optional)" maxlength="200">
                <select id="communityTypeSelect">
                    <option value="public">🌍 Public</option>
                    <option value="private">🔒 Private</option>
                </select>
                <button class="btn-create" id="createCommunityBtn" onclick="createCommunity()">+ Create Community</button>
            </div>
        </div>

        <!-- ===== SECRET CREATE TRIGGER (Invisible/Floating) ===== -->
        <button class="secret-create-trigger" onclick="toggleCreateForm()" title="Create Community (Admin Only)">
            <span class="hint-text">🔒 Create</span>
            <span style="font-size:1.2rem;">✨</span>
        </button>

        <!-- ===== TABS ===== -->
        <div class="community-tabs">
            <button class="tab-btn active" data-tab="all">
                🌍 All <span class="count" id="tabAllCount">0</span>
            </button>
            <button class="tab-btn" data-tab="joined">
                ✅ Joined <span class="count" id="tabJoinedCount">0</span>
            </button>
            <button class="tab-btn" data-tab="created">
                🎯 Created <span class="count" id="tabCreatedCount">0</span>
            </button>
            <button class="tab-btn" data-tab="admin">
                🛡️ Admin <span class="count" id="tabAdminCount">0</span>
            </button>
        </div>

        <!-- ===== SEARCH BAR ===== -->
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchCommunities" placeholder="Search communities by name or description...">
            <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
        </div>

        <!-- ===== COMMUNITIES LIST ===== -->
        <div class="community-list" id="communitiesList">
            <!-- Dynamically rendered -->
        </div>

        <!-- ===== SHIMMER ===== -->
        <div class="community-shimmer" id="communityShimmer">
            <div class="shimmer-card">
                <div class="shimmer-row">
                    <div class="shimmer-avatar"></div>
                    <div style="flex:1;">
                        <div class="shimmer-line short"></div>
                        <div class="shimmer-line medium"></div>
                    </div>
                </div>
                <div class="shimmer-line long"></div>
                <div class="shimmer-line medium"></div>
            </div>
            <div class="shimmer-card">
                <div class="shimmer-row">
                    <div class="shimmer-avatar"></div>
                    <div style="flex:1;">
                        <div class="shimmer-line short"></div>
                        <div class="shimmer-line medium"></div>
                    </div>
                </div>
                <div class="shimmer-line long"></div>
                <div class="shimmer-line medium"></div>
            </div>
        </div>

        <!-- ===== EMPTY STATE ===== -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="icon">🏠</span>
            <h3>No Communities Found</h3>
            <p>Be the first to create a community or join existing ones!</p>
        </div>

    </main>

    <!-- ===== TOAST ===== -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div class="toast-icon-wrapper"><span class="icon" id="toastIcon">✓</span></div>
            <div class="toast-text-group">
                <div class="toast-title" id="toastTitle">Success</div>
                <div class="toast-message" id="toastMessage">Action completed.</div>
            </div>
            <button class="toast-close-btn" onclick="dismissToast()">✕</button>
            <div class="toast-progress"></div>
        </div>
    </div>

    <!-- ===== CONFIRM MODAL ===== -->
    <div class="confirm-modal-overlay" id="confirmModalOverlay">
        <div class="confirm-modal" id="confirmModal">
            <div class="confirm-modal-icon"><span id="confirmModalIcon">⚠️</span></div>
            <div class="confirm-modal-title" id="confirmModalTitle">Are you sure?</div>
            <div class="confirm-modal-message" id="confirmModalMessage">This action cannot be undone.</div>
            <div class="confirm-modal-details" id="confirmModalDetails" style="display:none;"></div>
            <div class="confirm-modal-actions">
                <button class="btn-confirm secondary" id="confirmModalCancel" onclick="handleCancel()">Cancel</button>
                <button class="btn-confirm danger" id="confirmModalConfirm" onclick="handleConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <footer class="feed-footer">
        <p>&copy; 2026 SPIKE. All rights reserved.</p>
    </footer>

</body>
</html>

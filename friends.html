.network-recommendation-card{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;border-radius:17px;background:linear-gradient(135deg,rgba(233,69,96,.09),rgba(255,255,255,.025));border:1px solid rgba(233,69,96,.12);box-shadow:0 8px 28px rgba(0,0,0,.12);transition:transform .2s,border-color .2s,background .2s}.network-recommendation-card:hover{transform:translateY(-1px);border-color:rgba(233,69,96,.24);background:linear-gradient(135deg,rgba(233,69,96,.12),rgba(255,255,255,.04))}.network-recommendation-card .network-reason{margin-top:3px;font-size:10px;color:rgba(255,255,255,.42);display:flex;align-items:center;gap:5px}.network-recommendation-card .network-reason i{font-size:9px;color:#e94560}.network-recommendation-card .friend-info{min-width:0;flex:1}.network-recommendation-card .connection-action{flex-shrink:0}

  const closeSelector='[id*="menuClose" i], [id*="closeMenu" i], [data-close-menu], .spike-menu-close';
  function navHidden(v){ body.classList.toggle('spike-menu-nav-hidden',!!v); root.classList.toggle('spike-menu-nav-hidden',!!v); }
  function openDetected(){
    return !!document.querySelector('.spike-menu-overlay.open, .spike-menu-overlay[aria-hidden="false"], .overlay.open[id*="menu" i], [id*="menu" i].open, .side-menu.open, .drawer.open');
  }
  let syncQueued=false;
  function sync(){ syncQueued=false; navHidden(openDetected()); }
  function scheduleSync(){ if(syncQueued)return; syncQueued=true; requestAnimationFrame(sync); }
  // Observe only menu-related state changes; a perpetual 750 ms DOM scan needlessly
  // wakes mobile CPUs and competes with scrolling, typing and realtime rendering.
  const menuNodes=()=>document.querySelectorAll('.spike-menu-overlay, .overlay[id*="menu" i], [id*="menu" i].open, .side-menu, .drawer');
  const observer=new MutationObserver(scheduleSync);
  function observeMenus(){ menuNodes().forEach(node=>{ if(!node.dataset.spikeNavObserved){node.dataset.spikeNavObserved='1';observer.observe(node,{attributes:true,attributeFilter:['class','aria-hidden','hidden','open']});} }); }

  additions.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',function(e){
    const menu=e.target.closest?.(menuButtonSelector);
    if(menu){ navHidden(true); scheduleSync(); return; }
    const close=e.target.closest?.(closeSelector);
    if(close){ scheduleSync(); return; }
    const overlay=e.target.closest?.('.spike-menu-overlay, .overlay[id*="menu" i]');
    if(overlay && e.target===overlay) scheduleSync();

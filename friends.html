<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPIKE · Friends</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
      }
    }
  </script>

  <style>
    /* --- reset & base --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg1: #fdf2f8;
      --bg2: #fef3c7;
      --bg3: #ecfdf5;

      --card: rgba(255, 255, 255, 0.78);
      --border: rgba(255, 255, 255, 0.65);

      --text: #1f2937;
      --muted: #6b7280;
      --light: #9ca3af;

      --input: #ffffff;
      --input-border: #e5e7eb;

      --pink: #f472b6;
      --orange: #fb923c;
      --green: #22c55e;
      --blue: #3b82f6;
      --red: #ef4444;
    }

    body.dark {
      --bg1: #111827;
      --bg2: #1f2937;
      --bg3: #111827;

      --card: rgba(17, 24, 39, 0.88);
      --border: rgba(255, 255, 255, 0.1);

      --text: #f3f4f6;
      --muted: #9ca3af;
      --light: #6b7280;

      --input: #111827;
      --input-border: #374151;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      color: var(--text);

      background: linear-gradient(145deg, var(--bg1), var(--bg2) 45%, var(--bg3));
      transition: background 0.3s;
    }

    button,
    input {
      font-family: inherit;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }


    /* --- profile modal --- */
    .profile-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 39, 0.58);
      backdrop-filter: blur(8px);
    }

    .profile-modal.show { display: flex; }

    .profile-card {
      width: min(100%, 460px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
    }

    .profile-cover {
      height: 150px;
      background: linear-gradient(135deg, #f472b6, #fb923c, #34d399);
      background-size: cover;
      background-position: center;
    }

    .profile-body { padding: 0 22px 22px; }

    .profile-avatar-wrap {
      margin-top: -54px;
      width: 108px;
      height: 108px;
      padding: 4px;
      border-radius: 50%;
      background: var(--card);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #fb923c);
    }

    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .profile-name { font-size: 22px; font-weight: 700; }
    .profile-username { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .profile-bio { margin-top: 16px; color: var(--text); line-height: 1.55; font-size: 14px; white-space: pre-wrap; }
    .profile-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .profile-chip { padding: 6px 10px; border-radius: 999px; background: var(--input-border); color: var(--muted); font-size: 11px; font-weight: 600; }
    .profile-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .profile-close { min-width: 38px; padding: 8px 12px; }

    .person-clickable { cursor: pointer; }
    .person-clickable:hover .person-name { text-decoration: underline; }

    .presence-line { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:11px; color:var(--muted); }
    .presence-dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; flex:0 0 auto; }
    .presence-dot.online { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.12); }
    .suggested-badge { display:inline-flex; align-items:center; gap:4px; margin-left:6px; padding:3px 7px; border-radius:999px; background:rgba(244,114,182,.12); color:#db2777; font-size:9px; font-weight:700; vertical-align:middle; }
    body.dark .suggested-badge { color:#f9a8d4; background:rgba(244,114,182,.14); }
    .person-meta { display:flex; align-items:center; flex-wrap:wrap; gap:4px; }
    .profile-presence { display:flex; align-items:center; gap:7px; margin-top:8px; color:var(--muted); font-size:12px; font-weight:600; }
    .profile-message { margin-left:auto; }

    @media (max-width: 520px) {
      .profile-modal { padding: 12px; }
      .profile-cover { height: 125px; }
    }

    /* --- header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;

      padding: 14px 18px;
      margin-bottom: 18px;

      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #fb923c, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-sub {
      color: var(--light);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--input-border);
      border-radius: 30px;
    }

    .small-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #fb923c);
    }

    .small-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    /* --- buttons --- */
    .btn {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 16px;
      border: 0;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.55 !important;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #f472b6, #fb923c);
    }

    .btn-outline {
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--input-border);
    }

    .btn-add {
      color: white !important;
      background: #3b82f6 !important;
      border: 0 !important;
    }

    .btn-accept {
      color: white !important;
      background: #22c55e !important;
      border: 0 !important;
    }

    .btn-cancel {
      color: #ef4444 !important;
      background: transparent !important;
      border: 1px solid #ef4444 !important;
    }

    .btn-remove {
      color: #ef4444 !important;
      background: transparent !important;
      border: 1px solid #ef4444 !important;
    }

    .btn-friends {
      color: white !important;
      background: #22c55e !important;
      border: 0 !important;
      opacity: 0.7 !important;
      cursor: default;
    }

    /* --- premium notifications --- */
    .status { display: none; }
    .toast-stack {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 5000;
      width: min(390px, calc(100vw - 28px));
      display: grid;
      gap: 12px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: grid;
      grid-template-columns: 42px 1fr 28px;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(22px) saturate(150%);
      box-shadow: 0 20px 55px rgba(15,23,42,.18), 0 3px 12px rgba(15,23,42,.08);
      transform: translateX(115%) scale(.96);
      opacity: 0;
      transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .25s ease;
    }
    .toast.show { transform: translateX(0) scale(1); opacity: 1; }
    .toast-icon {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center; font-size: 19px;
    }
    .toast.success .toast-icon { background: #dcfce7; color: #15803d; }
    .toast.error .toast-icon { background: #fee2e2; color: #b91c1c; }
    .toast.warning .toast-icon { background: #fef3c7; color: #b45309; }
    .toast.info .toast-icon { background: #dbeafe; color: #1d4ed8; }
    .toast-title { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
    .toast-message { font-size: 12px; line-height: 1.45; color: var(--muted); }
    .toast-close {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      width: 28px; height: 28px; border-radius: 9px; font-size: 18px;
    }
    .toast-close:hover { background: var(--input); }
    .confirm-backdrop {
      position: fixed; inset: 0; z-index: 5100; display: none; place-items: center;
      padding: 20px; background: rgba(15,23,42,.42); backdrop-filter: blur(9px);
    }
    .confirm-backdrop.show { display: grid; }
    .confirm-panel {
      width: min(430px, 100%); padding: 25px; border: 1px solid var(--border);
      border-radius: 28px; background: var(--card); backdrop-filter: blur(24px);
      box-shadow: 0 30px 90px rgba(15,23,42,.25);
      animation: panelIn .25s cubic-bezier(.22,1,.36,1);
    }
    @keyframes panelIn { from { opacity:0; transform:translateY(12px) scale(.97); } to { opacity:1; transform:none; } }
    .confirm-icon { width:50px; height:50px; border-radius:16px; display:grid; place-items:center; background:#fef3c7; color:#b45309; font-size:23px; margin-bottom:16px; }
    .confirm-title { font-size:18px; font-weight:850; margin-bottom:7px; }
    .confirm-text { color:var(--muted); font-size:13px; line-height:1.55; margin-bottom:20px; }
    .confirm-actions { display:flex; justify-content:flex-end; gap:9px; }
    .confirm-actions .btn-danger { color:white; background:#ef4444; border:0; }
    body.dark .toast-success .toast-icon, body.dark .toast.success .toast-icon { background:rgba(34,197,94,.14); color:#86efac; }
    body.dark .toast.error .toast-icon { background:rgba(239,68,68,.14); color:#fca5a5; }
    body.dark .toast.warning .toast-icon { background:rgba(245,158,11,.14); color:#fcd34d; }
    body.dark .toast.info .toast-icon { background:rgba(59,130,246,.14); color:#93c5fd; }
    @media (max-width: 560px) { .toast-stack { top: 12px; right: 12px; left: 12px; width: auto; } .toast { border-radius: 18px; } }

    /* --- main card --- */
    .card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08);
    }

    /* --- tabs --- */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--input-border);
      border-radius: 18px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tab.active {
      color: #ec4899;
      background: rgba(244, 114, 182, 0.12);
    }

    .tab-count {
      margin-left: 3px;
      opacity: 0.7;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* --- search --- */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid var(--input-border);
      border-radius: 18px;
      outline: none;
      color: var(--text);
      background: var(--input);
      transition: border-color 0.2s;
    }

    .search:focus {
      border-color: #f472b6;
    }

    /* --- list --- */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px;
      border: 1px solid var(--input-border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.25);
    }

    body.dark .person {
      background: rgba(255, 255, 255, 0.025);
    }

    .person-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #fb923c);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-text {
      min-width: 0;
    }

    .person-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person-username {
      margin-top: 3px;
      color: var(--light);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
      min-width: 90px;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: var(--light);
      font-size: 13px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title strong {
      font-size: 15px;
    }

    .section-title span {
      color: var(--light);
      font-size: 12px;
    }

    /* --- responsive --- */
    @media (max-width: 650px) {
      body {
        padding: 12px;
      }
      .card {
        padding: 15px;
      }
      .header {
        border-radius: 20px;
      }
      .user-name {
        display: none;
      }
      .tabs {
        flex-wrap: wrap;
      }
      .tab {
        flex: 1 0 45%;
      }
      .search-row {
        flex-direction: column;
      }
      .person {
        flex-direction: column;
        align-items: flex-start;
      }
      .person-info {
        width: 100%;
      }
      .actions {
        width: 100%;
        justify-content: flex-start;
      }
      .btn {
        min-height: 36px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <span class="brand-name">SPIKE</span>
        <span class="brand-sub">· friends</span>
      </div>
      <div class="header-actions">
        <div class="user-badge">
          <div id="headerAvatar" class="small-avatar">👤</div>
          <span id="headerName" class="user-name">—</span>
        </div>
        <button id="logoutBtn" class="btn btn-outline">Sign out</button>
        <button id="darkToggle" class="btn btn-outline" title="Toggle dark mode">🌙</button>
      </div>
    </header>

    <!-- STATUS -->
    <div id="status" class="status" aria-live="polite"></div>
    <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <div id="confirmBackdrop" class="confirm-backdrop" aria-hidden="true">
      <div class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div id="confirmIcon" class="confirm-icon">⚠</div>
        <div id="confirmTitle" class="confirm-title">Are you sure?</div>
        <div id="confirmText" class="confirm-text"></div>
        <div class="confirm-actions">
          <button id="confirmCancel" class="btn btn-outline" type="button">Cancel</button>
          <button id="confirmOk" class="btn btn-danger" type="button">Continue</button>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="card">

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" data-tab="discover">Discover <span class="tab-count" id="discoverCount">0</span></button>
        <button class="tab" data-tab="friends">Friends <span class="tab-count" id="friendsTabCount">0</span></button>
        <button class="tab" data-tab="incoming">Incoming <span class="tab-count" id="incomingTabCount">0</span></button>
        <button class="tab" data-tab="outgoing">Outgoing <span class="tab-count" id="outgoingTabCount">0</span></button>
      </div>

      <!-- DISCOVER -->
      <section id="tab-discover" class="tab-content active">
        <div class="search-row">
          <input id="peopleSearch" class="search" type="search" placeholder="Search people..." autocomplete="off" />
          <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        </div>
        <div id="peopleList" class="list"><div class="empty">Loading people...</div></div>
      </section>

      <!-- FRIENDS -->
      <section id="tab-friends" class="tab-content">
        <div class="section-title"><strong>Your Friends</strong> <span id="friendsCount">0</span></div>
        <div id="friendsList" class="list"><div class="empty">No friends yet.</div></div>
      </section>

      <!-- INCOMING -->
      <section id="tab-incoming" class="tab-content">
        <div class="section-title"><strong>Incoming Requests</strong> <span id="incomingCount">0</span></div>
        <div id="incomingList" class="list"><div class="empty">No incoming requests.</div></div>
      </section>

      <!-- OUTGOING -->
      <section id="tab-outgoing" class="tab-content">
        <div class="section-title"><strong>Outgoing Requests</strong> <span id="outgoingCount">0</span></div>
        <div id="outgoingList" class="list"><div class="empty">No outgoing requests.</div></div>
      </section>

    </main>

  </div>


  <div id="profileModal" class="profile-modal" aria-hidden="true">
    <div class="profile-card" role="dialog" aria-modal="true" aria-labelledby="profileModalName">
      <div id="profileCover" class="profile-cover"></div>
      <div class="profile-body">
        <div class="profile-avatar-wrap">
          <div id="profileAvatar" class="profile-avatar">U</div>
        </div>
        <div class="profile-head">
          <div>
            <div id="profileModalName" class="profile-name">User</div>
            <div id="profileModalUsername" class="profile-username"></div>
          </div>
          <button id="profileClose" class="btn btn-cancel profile-close" type="button">Close</button>
        </div>
        <div id="profileBio" class="profile-bio"></div>
        <div id="profileMeta" class="profile-meta"></div>
        <div id="profileActions" class="profile-actions"></div>
      </div>
    </div>
  </div>

  <script type="module">
import { createClient } from '@supabase/supabase-js';

const SUPABASE_URL = 'https://bkrrewagsbjqgmxaaqyt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_24Z2PQpdG13cf6_9w8C7nA_zXEzr60O';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const toastStack = $('toastStack');
const confirmBackdrop = $('confirmBackdrop');
const confirmTitle = $('confirmTitle');
const confirmText = $('confirmText');
const confirmOk = $('confirmOk');
const confirmCancel = $('confirmCancel');
const peopleSearch = $('peopleSearch');
const peopleList = $('peopleList');
const friendsList = $('friendsList');
const incomingList = $('incomingList');
const outgoingList = $('outgoingList');
const friendsCount = $('friendsCount');
const incomingCount = $('incomingCount');
const outgoingCount = $('outgoingCount');
const discoverCount = $('discoverCount');
const friendsTabCount = $('friendsTabCount');
const incomingTabCount = $('incomingTabCount');
const outgoingTabCount = $('outgoingTabCount');
const headerAvatar = $('headerAvatar');
const headerName = $('headerName');
const refreshBtn = $('refreshBtn');
const logoutBtn = $('logoutBtn');
const darkToggle = $('darkToggle');
const profileModal = $('profileModal');
const profileCover = $('profileCover');
const profileAvatar = $('profileAvatar');
const profileModalName = $('profileModalName');
const profileModalUsername = $('profileModalUsername');
const profileBio = $('profileBio');
const profileMeta = $('profileMeta');
const profileActions = $('profileActions');
const profileClose = $('profileClose');
let openProfileId = null;
let presenceChannel = null;
let presenceUsers = new Set();

let currentUser = null;
let currentProfile = null;
let allProfiles = [];
let relationshipMap = new Map();
let statusTimer = null;
const busyActions = new Set();

function showStatus(message, type = 'info') {
  if (!message) return;
  const config = {
    success: { icon: '✓', title: 'Done' },
    error: { icon: '!', title: 'Something went wrong' },
    warning: { icon: '⚠', title: 'Please check' },
    info: { icon: 'i', title: 'SPIKE' }
  }[type] || { icon: 'i', title: 'SPIKE' };

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-icon" aria-hidden="true">${config.icon}</div>
    <div><div class="toast-title">${config.title}</div><div class="toast-message">${escapeHtml(message)}</div></div>
    <button class="toast-close" type="button" aria-label="Dismiss notification">×</button>`;
  toastStack.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));

  const remove = () => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 260);
  };
  toast.querySelector('.toast-close').addEventListener('click', remove);
  setTimeout(remove, type === 'error' ? 7000 : type === 'warning' ? 6000 : 4500);
}

function showConfirm({ title = 'Are you sure?', message = '', confirmLabel = 'Continue', danger = false } = {}) {
  return new Promise(resolve => {
    confirmTitle.textContent = title;
    confirmText.textContent = message;
    confirmOk.textContent = confirmLabel;
    confirmOk.classList.toggle('btn-danger', danger);
    confirmBackdrop.classList.add('show');
    confirmBackdrop.setAttribute('aria-hidden', 'false');

    const finish = value => {
      confirmBackdrop.classList.remove('show');
      confirmBackdrop.setAttribute('aria-hidden', 'true');
      confirmOk.onclick = null;
      confirmCancel.onclick = null;
      resolve(value);
    };
    confirmOk.onclick = () => finish(true);
    confirmCancel.onclick = () => finish(false);
  });
}

confirmBackdrop.addEventListener('click', event => {
  if (event.target === confirmBackdrop) confirmCancel.click();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && confirmBackdrop.classList.contains('show')) confirmCancel.click();
});

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function displayName(profile) {
  return profile?.display_name || profile?.username || 'User';
}

function avatarHtml(profile) {
  const name = displayName(profile);
  const initial = escapeHtml(name.charAt(0).toUpperCase() || 'U');
  const online = presenceUsers.has(profile?.id);
  const avatar = profile?.avatar_url
    ? `<div class="avatar"><img src="${escapeHtml(profile.avatar_url)}" alt="${escapeHtml(name)}"></div>`
    : `<div class="avatar">${initial}</div>`;
  return `<div style="position:relative;display:inline-flex">${avatar}<span class="presence-dot ${online ? 'online' : ''}" style="position:absolute;right:-1px;bottom:0;border:2px solid var(--card);width:10px;height:10px"></span></div>`;
}

function profileActionHtml(profileId) {
  const rel = relationshipMap.get(profileId);
  if (!rel) return `<button class="btn btn-primary" data-action="add" data-user-id="${escapeHtml(profileId)}">Add Friend</button>`;
  if (rel.status === 'accepted') return `<button class="btn btn-primary profile-message" data-action="message" data-user-id="${escapeHtml(profileId)}">Message</button><button class="btn btn-remove" data-action="remove" data-user-id="${escapeHtml(profileId)}">Remove Friend</button>`;
  if (rel.status === 'pending' && rel.direction === 'incoming') {
    const row = rel.row;
    return `<button class="btn btn-accept" data-action="accept" data-user-id="${escapeHtml(row.user_id)}" data-friend-id="${escapeHtml(row.friend_id)}">Accept</button>
            <button class="btn btn-cancel" data-action="decline" data-user-id="${escapeHtml(row.user_id)}" data-friend-id="${escapeHtml(row.friend_id)}">Decline</button>`;
  }
  if (rel.status === 'pending' && rel.direction === 'outgoing') {
    const row = rel.row;
    return `<button class="btn btn-cancel" data-action="cancel" data-user-id="${escapeHtml(row.user_id)}" data-friend-id="${escapeHtml(row.friend_id)}">Cancel Request</button>`;
  }
  return '';
}

function openProfile(profileId) {
  const profile = allProfiles.find(p => p.id === profileId);
  if (!profile) return;
  openProfileId = profileId;
  const name = displayName(profile);
  profileCover.style.backgroundImage = profile.cover_url ? `url("${String(profile.cover_url).replace(/"/g, '%22')}")` : '';
  profileAvatar.innerHTML = profile.avatar_url
    ? `<img src="${escapeHtml(profile.avatar_url)}" alt="${escapeHtml(name)}">`
    : escapeHtml(name.charAt(0).toUpperCase() || 'U');
  profileModalName.textContent = name;
  profileModalUsername.textContent = profile.username ? '@' + profile.username : '';
  profileBio.textContent = profile.bio || 'No bio yet.';
  const online = presenceUsers.has(profileId);
  profileMeta.innerHTML = `<div class="profile-presence"><span class="presence-dot ${online ? 'online' : ''}"></span>${online ? 'Online now' : 'Offline'}</div>`;
  const chips = [];
  if (profile.sp_id) chips.push(`<span class="profile-chip">SPIKE ID: ${escapeHtml(profile.sp_id)}</span>`);
  if (profile.activated) chips.push(`<span class="profile-chip">Activated</span>`);
  profileMeta.insertAdjacentHTML('beforeend', chips.join(''));
  profileActions.innerHTML = profileActionHtml(profileId);
  profileModal.classList.add('show');
  profileModal.setAttribute('aria-hidden', 'false');
}

function closeProfile() {
  openProfileId = null;
  profileModal.classList.remove('show');
  profileModal.setAttribute('aria-hidden', 'true');
}

function renderHeader() {
  if (!currentUser) return;
  const name = displayName(currentProfile);
  headerName.textContent = name;
  if (currentProfile?.avatar_url) {
    headerAvatar.innerHTML = `<img src="${escapeHtml(currentProfile.avatar_url)}" alt="">`;
  } else {
    headerAvatar.textContent = name.charAt(0).toUpperCase() || 'U';
  }
}

/*
  IMPORTANT:
  friendships.user_id, friendships.friend_id and requested_by all reference
  profiles.id. Therefore every authenticated user must have a profile before
  a friendship can be inserted. The database was repaired, but this guard
  also protects older accounts and any account created before the trigger.
*/
async function ensureCurrentProfile() {
  if (!currentUser) throw new Error('You are not signed in.');

  const { data, error } = await supabase
    .from('profiles')
    .select('id,username,display_name,avatar_url,bio,cover_url,sp_id,activated')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (error) throw error;

  if (data) {
    currentProfile = data;
    renderHeader();
    return;
  }

  const fallbackName =
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    (currentUser.email || '').split('@')[0] ||
    'Spike User';

  const { error: insertError } = await supabase
    .from('profiles')
    .insert({
      id: currentUser.id,
      display_name: fallbackName
    });

  if (insertError && insertError.code !== '23505') throw insertError;

  const { data: repaired, error: readError } = await supabase
    .from('profiles')
    .select('id,username,display_name,avatar_url,bio,cover_url,sp_id,activated')
    .eq('id', currentUser.id)
    .single();

  if (readError) throw readError;
  currentProfile = repaired;
  renderHeader();
}

async function loadProfiles() {
  const { data, error } = await supabase
    .from('profiles')
    .select('id,username,display_name,avatar_url,bio,cover_url,sp_id,activated')
    .order('display_name', { ascending: true });

  if (error) throw error;
  allProfiles = (data || []).filter(p => p.id !== currentUser.id);
}

async function loadFriendships() {
  const me = currentUser.id;
  const { data, error } = await supabase
    .from('friendships')
    .select('user_id,friend_id,status,requested_by,created_at,updated_at')
    .or(`user_id.eq.${me},friend_id.eq.${me}`);

  if (error) throw error;

  relationshipMap = new Map();

  for (const row of data || []) {
    const otherId = row.user_id === me ? row.friend_id : row.user_id;
    if (!otherId) continue;

    const direction = row.requested_by === me ? 'outgoing' : 'incoming';

    relationshipMap.set(otherId, {
      status: row.status,
      direction,
      row
    });
  }
}

async function loadEverything() {
  if (!currentUser) return;

  try {
    await ensureCurrentProfile();
    await loadProfiles();
    await loadFriendships();
    if (!presenceChannel) await startPresence();
    renderAll();
    showStatus(null);
  } catch (error) {
    console.error('Friends load error:', error);
    showStatus('Could not load friends: ' + friendlyError(error), 'error');
    peopleList.innerHTML = `<div class="empty">Could not load people. Tap Refresh to try again.</div>`;
  }
}

function friendlyError(error) {
  const message = error?.message || String(error);
  if (message.includes('foreign key constraint') && message.includes('friendships_user_id_fkey')) {
    return 'Your profile was missing. It has now been repaired. Please tap Refresh once.';
  }
  if (error?.code === '23505') return 'That friendship already exists.';
  if (error?.code === '42501') return 'You do not have permission to perform that action.';
  if (error?.code === 'PGRST116') return 'Your profile could not be found.';
  return message;
}

function renderAll() {
  renderDiscover(peopleSearch.value);
  renderFriends();
  renderIncoming();
  renderOutgoing();
}

function renderDiscover(search = '') {
  const q = search.trim().toLowerCase();

  const people = allProfiles
    .filter(p => {
      const rel = relationshipMap.get(p.id);
      if (rel?.status === 'accepted') return false;
      if (!q) return true;
      return (p.display_name || '').toLowerCase().includes(q) ||
             (p.username || '').toLowerCase().includes(q);
    })
    .sort((a,b) => {
      const ao = presenceUsers.has(a.id) ? 0 : 1;
      const bo = presenceUsers.has(b.id) ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return displayName(a).localeCompare(displayName(b));
    });

  discoverCount.textContent = people.length;

  if (!people.length) {
    peopleList.innerHTML = `<div class="empty">No other users found.</div>`;
    return;
  }

  peopleList.innerHTML = people.map(p => {
    const rel = relationshipMap.get(p.id);
    let buttons = '';

    if (!rel) {
      buttons = `<button class="btn btn-add" data-action="add" data-user-id="${escapeHtml(p.id)}">Add Friend</button>`;
    } else if (rel.status === 'accepted') {
      buttons = `<button class="btn btn-friends" disabled>Friends</button>`;
    } else if (rel.status === 'pending') {
      if (rel.direction === 'outgoing') {
        buttons = `<button class="btn btn-cancel" data-action="cancel"
          data-user-id="${escapeHtml(rel.row.user_id)}"
          data-friend-id="${escapeHtml(rel.row.friend_id)}">Cancel Request</button>`;
      } else {
        buttons = `
          <button class="btn btn-accept" data-action="accept"
            data-user-id="${escapeHtml(rel.row.user_id)}"
            data-friend-id="${escapeHtml(rel.row.friend_id)}">Accept</button>
          <button class="btn btn-cancel" data-action="decline"
            data-user-id="${escapeHtml(rel.row.user_id)}"
            data-friend-id="${escapeHtml(rel.row.friend_id)}">Decline</button>`;
      }
    } else {
      buttons = `<button class="btn btn-add" data-action="add" data-user-id="${escapeHtml(p.id)}">Add Friend</button>`;
    }

    return `
      <div class="person">
        <div class="person-info person-clickable" data-profile-id="${escapeHtml(p.id)}" role="button" tabindex="0" title="View profile">
          ${avatarHtml(p)}
          <div class="person-text">
            <div class="person-name">${escapeHtml(displayName(p))}${!relationshipMap.get(p.id) ? '<span class="suggested-badge">✦ Suggested</span>' : ''}</div>
            <div class="person-username">${p.username ? '@' + escapeHtml(p.username) : ''}</div>
            <div class="presence-line"><span class="presence-dot ${presenceUsers.has(p.id) ? 'online' : ''}"></span>${presenceUsers.has(p.id) ? 'Online now' : 'Offline'}</div>
          </div>
        </div>
        <div class="actions">${buttons}</div>
      </div>`;
  }).join('');
}

  const friends = allProfiles.filter(p => relationshipMap.get(p.id)?.status === 'accepted');
  friendsCount.textContent = friends.length;

function openMessage(profileId) {
  if (!profileId) return;
  window.location.href = `messages.html?user=${encodeURIComponent(profileId)}`;
}

async function startPresence() {
  if (!currentUser) return;
  if (presenceChannel) await supabase.removeChannel(presenceChannel);
  presenceUsers = new Set();
  presenceChannel = supabase.channel('spike-presence', { config: { presence: { key: currentUser.id } } });
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      presenceUsers = new Set(Object.keys(state).filter(id => id !== currentUser.id));
      renderAll();
      if (openProfileId) openProfile(openProfileId);
    })
    .on('presence', { event: 'join' }, () => {})
    .on('presence', { event: 'leave' }, () => {})
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        await presenceChannel.track({ online_at: new Date().toISOString() });
      }
    });
}

async function stopPresence() {
  if (!presenceChannel) return;
  await presenceChannel.untrack().catch(() => {});
  await supabase.removeChannel(presenceChannel);
  presenceChannel = null;
  presenceUsers = new Set();
}

async function addFriend(targetId) {
  if (!currentUser || !currentProfile) throw new Error('Your profile is not ready yet.');
  if (!targetId || targetId === currentUser.id) throw new Error('You cannot add yourself.');

  const existing = relationshipMap.get(targetId);
  if (existing) {
    if (existing.status === 'accepted') showStatus('Already friends.', 'info');
    else if (existing.status === 'pending') showStatus(
      existing.direction === 'incoming' ? 'You already have an incoming request from this person.' : 'A friend request is already pending.',
      'info'
    );
    else showStatus('This friendship cannot be created.', 'error');
    return;
  }

  const target = allProfiles.find(p => p.id === targetId);
  if (!target) throw new Error('That user no longer exists. Refresh and try again.');

  const { error } = await supabase
    .from('friendships')
    .insert({
      user_id: currentUser.id,
      friend_id: targetId,
      status: 'pending',
      requested_by: currentUser.id
    });

  if (error) {
    if (error.code === '23505') {
      await loadEverything();
      showStatus('A request or friendship already exists with this person.', 'info');
      return;
    }
    throw error;
  }

  await loadFriendships();
  renderAll();
  showStatus('Friend request sent!', 'success');
}

async function acceptRequest(userId, friendId) {
  if (friendId !== currentUser.id) throw new Error('Only the recipient can accept this request.');

  const { data, error } = await supabase
    .from('friendships')
    .update({ status: 'accepted' })
    .eq('user_id', userId)
    .eq('friend_id', friendId)
    .eq('status', 'pending')
    .select('user_id,friend_id,status,requested_by')
    .maybeSingle();

  if (error) throw error;
  if (!data) throw new Error('This request is no longer pending.');

  await loadFriendships();
  renderAll();
  showStatus('Friend request accepted!', 'success');
}

async function deleteRequest(userId, friendId, action) {
  const { data, error } = await supabase
    .from('friendships')
    .delete()
    .eq('user_id', userId)
    .eq('friend_id', friendId)
    .eq('status', 'pending')
    .select('user_id,friend_id');

  if (error) throw error;
  if (!data?.length) throw new Error('This request is already gone.');

  await loadFriendships();
  renderAll();
  showStatus(action === 'cancel' ? 'Request cancelled.' : 'Request declined.', 'success');
}

async function removeFriend(friendId) {
  const confirmed = await showConfirm({
    title: 'Remove friend?',
    message: 'This will remove the friendship. You can send a new request later if you change your mind.',
    confirmLabel: 'Remove friend',
    danger: true
  });
  if (!confirmed) return;

  const me = currentUser.id;
  const { data, error } = await supabase
    .from('friendships')
    .delete()
    .or(`and(user_id.eq.${me},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${me})`)
    .eq('status', 'accepted')
    .select('user_id,friend_id');

  if (error) throw error;
  if (!data?.length) throw new Error('This friendship no longer exists.');

  await loadFriendships();
  renderAll();
  showStatus('Friend removed.', 'success');
}

document.addEventListener('click', async (event) => {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;

  const action = button.dataset.action;
  const userId = button.dataset.userId;
  const friendId = button.dataset.friendId;
  const key = `${action}:${userId || ''}:${friendId || ''}`;

  if (busyActions.has(key)) return;
  busyActions.add(key);
  button.disabled = true;

  try {
    if (action === 'add') await addFriend(userId);
    else if (action === 'accept') await acceptRequest(userId, friendId);
    else if (action === 'cancel') await deleteRequest(userId, friendId, 'cancel');
    else if (action === 'decline') await deleteRequest(userId, friendId, 'decline');
    else if (action === 'remove') await removeFriend(userId);
    else if (action === 'message') { openMessage(userId); return; }
    if (openProfileId && (openProfileId === userId || openProfileId === friendId)) {
      const profile = allProfiles.find(p => p.id === openProfileId);
      if (profile) profileActions.innerHTML = profileActionHtml(openProfileId);
    }
  } catch (error) {
    console.error(`Friend action ${action} failed:`, error);
    showStatus(`Could not ${action} friend request: ${friendlyError(error)}`, 'error');
    await loadEverything();
  } finally {
    busyActions.delete(key);
    if (button.isConnected) button.disabled = false;
  }
});

profileClose.addEventListener('click', closeProfile);
profileModal.addEventListener('click', (event) => {
  if (event.target === profileModal) closeProfile();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && profileModal.classList.contains('show')) closeProfile();
  if (event.key === 'Enter') {
    const target = event.target.closest('[data-profile-id]');
    if (target && !event.target.closest('[data-action]')) openProfile(target.dataset.profileId);
  }
});
document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-profile-id]');
  if (target && !event.target.closest('[data-action]')) openProfile(target.dataset.profileId);
});

peopleSearch.addEventListener('input', e => renderDiscover(e.target.value));

refreshBtn.addEventListener('click', async () => {

logoutBtn.addEventListener('click', async () => {
  logoutBtn.disabled = true;
  logoutBtn.textContent = 'Signing out...';
  try {

    currentUser = null;

    relationshipMap.clear();
    peopleList.innerHTML = `<div class="empty">Please sign in.</div>`;
    friendsList.innerHTML = `<div class="empty">Please sign in.</div>`;
    incomingList.innerHTML = `<div class="empty">Please sign in.</div>`;
    outgoingList.innerHTML = `<div class="empty">Please sign in.</div>`;
    headerName.textContent = '—';
    headerAvatar.textContent = '👤';
    showStatus('Signed out.', 'info');
  } catch (error) {
    showStatus('Sign out failed: ' + friendlyError(error), 'error');
  } finally {
    logoutBtn.disabled = false;
    logoutBtn.textContent = 'Sign out';
  }
});

/*
  Do not await database calls directly inside onAuthStateChange.
  Schedule the load after the auth callback returns to avoid auth-lock races.
*/
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') {
    currentUser = session?.user || null;
    if (currentUser) queueMicrotask(() => loadEverything());
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    currentProfile = null;
    allProfiles = [];
    relationshipMap.clear();
    stopPresence().catch(() => {});
  }
});

async function init() {
  try {
    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;

    currentUser = data?.session?.user || null;

    if (!currentUser) {
      showStatus('Please sign in first.', 'error');
      peopleList.innerHTML = `<div class="empty">Please sign in to see people.</div>`;
      return;
    }

    await loadEverything();
  } catch (error) {
    console.error('Initialization error:', error);
    showStatus('Authentication error: ' + friendlyError(error), 'error');
  }
}

init();
window.addEventListener('beforeunload', () => { if (presenceChannel) presenceChannel.untrack().catch(() => {}); });
console.log('SPIKE friends — rebuilt and secured.');
</script>

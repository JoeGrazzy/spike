<style>
:root{--bg:#070b10;--surface:#111827;--surface2:#172033;--border:rgba(255,255,255,.12);--text:#f8fafc;--muted:#aab4c5;--accent:#8b5cf6;--cyan:#22d3ee;--danger:#fb7185}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding-bottom:calc(82px + env(safe-area-inset-bottom));overflow-x:hidden}.app{min-height:100vh;min-height:100dvh}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:rgba(7,11,16,.96);border-bottom:1px solid var(--border)}.back{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);font-weight:800;cursor:pointer}.brand{min-width:0;flex:1;color:inherit;text-decoration:none}.brand strong{display:block;font-size:18px;letter-spacing:-.04em}.brand small{color:var(--muted);font-weight:700}.refresh{height:40px;width:40px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);font-size:20px;cursor:pointer}.main{width:min(780px,100%);margin:auto;padding:16px 12px 28px}.hero{padding:20px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,#111827,#0f172a);margin-bottom:12px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--cyan)}h1{margin:4px 0;font-size:30px;letter-spacing:-.04em}.sub{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{min-height:40px;padding:0 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);font-weight:800;cursor:pointer}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),#a855f7)}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:grid;gap:10px;margin-top:16px}.tabs{display:flex;gap:5px;overflow:auto;padding:4px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.03)}.tab{flex:0 0 auto;border:0;border-radius:10px;padding:10px 12px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.tab.active{background:rgba(139,92,246,.23);color:var(--text)}.search{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border);border-radius:13px;background:var(--surface2)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit}.list{display:grid;gap:10px}.item{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:15px;border:1px solid var(--border);border-radius:18px;background:var(--surface);color:inherit;text-align:left;cursor:pointer}.item.unread{border-color:rgba(139,92,246,.48);background:linear-gradient(145deg,rgba(45,35,76,.8),var(--surface))}.icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:rgba(139,92,246,.18);font-size:22px}.copy{min-width:0}.title{font-size:14px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}.text{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800}.new{align-self:start;padding:4px 7px;border-radius:999px;background:rgba(139,92,246,.22);color:#ddd6fe;font-size:9px;font-weight:900}.empty{padding:34px 18px;border:1px dashed var(--border);border-radius:18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.error strong{color:#fecdd3}.sentinel{height:1px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(7,11,16,.98);border-top:1px solid var(--border)}.navin{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nav button{min-height:48px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--muted);font:800 10px/1.2 inherit;cursor:pointer}.nav button.active{color:#fff;border-color:rgba(139,92,246,.55);background:linear-gradient(145deg,rgba(139,92,246,.5),rgba(34,211,238,.18))}.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72)}.modal.open{display:flex}.card{width:min(540px,100%);max-height:min(82dvh,700px);overflow:auto;padding:20px;border:1px solid var(--border);border-radius:22px;background:#111827}.modalhead{display:flex;gap:12px;align-items:center}.modalicon{font-size:27px}.modaltitle{font-size:18px;font-weight:900}.modalmeta{margin-top:3px;color:var(--muted);font-size:12px}.close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:28px;cursor:pointer}.modalbody{margin-top:18px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.modalactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.loader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:rgba(0,0,0,.55)}.loader.hide{display:none}.loaderbox{padding:16px 20px;border:1px solid var(--border);border-radius:16px;background:#111827;font-weight:800}.spin{display:inline-block;width:15px;height:15px;margin-right:8px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:560px){h1{font-size:26px}.hero{padding:16px}.item{grid-template-columns:42px minmax(0,1fr) auto;padding:13px}.icon{width:42px;height:42px}}
</style>

<body>
<div class="app">
<header class="top"><button class="back spike-premium-back" id="backBtn" type="button" data-spike-premium-back="1" data-back-fallback="feed.html">← Back</button><a class="brand" href="feed.html"><strong>SPIKE</strong><small>CONNECT • SHARE • DISCOVER</small></a><button class="refresh" id="refreshBtn" type="button" aria-label="Refresh notifications">↻</button></header>
<main class="main">
<section class="hero">
<div class="eyebrow">ACTIVITY CENTER</div><h1>Notifications</h1><p class="sub"><span id="unreadCount">0</span> unread</p>
<div class="actions"><button class="btn primary" id="markAllBtn" type="button">Mark all read</button><button class="btn" id="deleteReadBtn" type="button">Delete read</button><button class="btn" id="clearBtn" type="button">Clear all</button></div>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="Notification filters"><button class="tab active" data-filter="all" role="tab" aria-selected="true">All</button><button class="tab" data-filter="unread" role="tab" aria-selected="false">Unread</button><button class="tab" data-filter="activity" role="tab" aria-selected="false">Activity</button><button class="tab" data-filter="mentions" role="tab" aria-selected="false">Mentions</button><button class="tab" data-filter="system" role="tab" aria-selected="false">System</button></div><label class="search">⌕<input id="searchInput" type="search" autocomplete="off" placeholder="Search notifications" aria-label="Search notifications"></label></div>
</section>
<section id="list" class="list" aria-live="polite"><div class="empty"><strong>Loading notifications…</strong>Please wait.</div></section><div id="sentinel" class="sentinel"></div>
</main>
<nav class="nav" aria-label="SPIKE navigation"><div class="navin"><button type="button" data-nav="feed.html">⌂<br>Feed</button><button type="button" data-nav="friends.html">♧<br>Friends</button><button type="button" data-nav="messages.html">◌<br>Chat</button><button class="active" type="button" aria-current="page">🔔<br>Alerts</button><button type="button" data-nav="profile.html">◯<br>Profile</button></div></nav>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="card"><div class="modalhead"><span class="modalicon" id="modalIcon">🔔</span><div><div class="modaltitle" id="modalTitle">Notification</div><div class="modalmeta" id="modalMeta"></div></div><button class="close" id="modalClose" type="button" aria-label="Close">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalactions" id="modalActions"></div></div></div>
<div class="loader" id="loader"><div class="loaderbox"><span class="spin"></span>Loading SPIKE…</div></div>
<script>
'use strict';
const SUPABASE_URL='https://cjqpyndceqyqsijihxbb.supabase.co';
const SUPABASE_KEY='sb_publishable_Tqz0TbLLRLwu4XirPTVuiw_sSC9o4Jw';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const state={user:null,items:new Map(),filter:'all',query:'',loading:false,loadingMore:false,hasMore:true,before:null,channel:null,observer:null,booted:false};
const typeMap={friend_request:['👥','Friend request','sent you a friend request'],friend_accepted:['🤝','Friend request accepted','accepted your friend request'],new_follower:['👤','New follower','started following you'],follow:['👤','New follower','followed you'],like:['❤️','New like','liked your post'],post_like:['❤️','New like','liked your post'],comment:['💬','New comment','commented on your post'],mention:['📣','You were mentioned','mentioned you'],mention_reply:['📣','Mention reply','replied to a mention'],message:['💬','New message','sent you a message'],coin_received:['🪙','Coins received','sent you coins'],coin_topup_completed:['🪙','Coin top-up complete','completed a coin top-up'],room_invite:['🎙️','Room invitation','invited you to a room'],room_purchase_verified:['✅','Purchase approved','your room purchase was approved'],room_purchase_rejected:['⚠️','Purchase rejected','your room purchase was rejected'],announcement:['📢','SPIKE announcement','published an announcement'],broadcast:['📢','SPIKE broadcast','published a broadcast'],security:['🔐','Security alert','reported a security event'],system:['⚙️','System update','posted a system update']};
function data(n){return n&&n.data&&typeof n.data==='object'?n.data:{}};
function val(d,keys){for(const k of keys){if(d[k]!==undefined&&d[k]!==null&&String(d[k]).trim())return String(d[k]).trim()}return ''}
function typeInfo(n){const t=String(n?.type||'').toLowerCase();return typeMap[t]||['🔔',t.replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase())||'Notification',''];}
function actor(n){return val(data(n),['actor_name','from_name','sender_name','display_name','username','actor'])}
function target(n){return val(data(n),['target_name','post_title','room_name','conversation_name','item'])}
function message(n){const d=data(n),explicit=val(d,['message','body','description','detail','preview','content']);if(explicit)return explicit;const [,,fallback]=typeInfo(n),a=actor(n),t=target(n);const amount=d.amount||d.coins;const extra=amount?` (${Number(amount).toLocaleString()})`:'';return a?`${a} ${fallback||''}${extra}${t?' · '+t:''}`:(fallback||'');}
function category(n){const t=String(n?.type||'').toLowerCase();if(/mention/.test(t))return'mentions';if(/announcement|broadcast|system|security|auth/.test(t))return'system';return'activity'}
function timeAgo(v){const d=new Date(v),diff=Date.now()-d.getTime();if(!Number.isFinite(diff))return'';if(diff<60000)return'just now';if(diff<3600000)return`${Math.floor(diff/60000)}m ago`;if(diff<86400000)return`${Math.floor(diff/3600000)}h ago`;if(diff<604800000)return`${Math.floor(diff/86400000)}d ago`;return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})}
function hrefFor(n){const d=data(n),t=String(n?.type||'').toLowerCase();const explicit=val(d,['url','href','link','activity_url','deep_link']);const actorId=val(d,['actor_id','from_user_id','sender_id','from_id']);const post=val(d,['post_id','postId','target_post_id','content_id']);const room=val(d,['room_id','roomId','target_room_id']);const user=val(d,['conversation_user_id','other_user_id','recipient_id','sender_id','from_user_id'])||actorId;const safe=raw=>{try{const u=new URL(raw,location.href);return u.origin===location.origin?u:null}catch(_){return null}};if(explicit){const u=safe(explicit);if(u)return u.href}if(/message|chat|dm|private_message/.test(t)&&UUID.test(user))return`message.html?private_uid=${encodeURIComponent(user)}`;if((post||/like|comment|mention|reaction|repost/.test(t))&&post)return`feed.html?post=${encodeURIComponent(post)}`;if(room)return`rooms.html?room=${encodeURIComponent(room)}`;if(UUID.test(actorId)&&/friend|follow|story/.test(t))return`view_user.html?uid=${encodeURIComponent(actorId)}`;return null}
function uniqueSort(rows){const seen=new Set();return(rows||[]).filter(n=>{const id=String(n?.id||'').trim();if(!UUID.test(id)||seen.has(id))return false;seen.add(id);return true}).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function merge(rows){for(const n of uniqueSort(rows)){const id=String(n.id);const old=state.items.get(id);state.items.set(id,old?{...old,...n}:n)}}
function filtered(){const q=state.query.trim().toLowerCase();return [...state.items.values()].filter(n=>{if(state.filter==='unread'&&n.read)return false;if(['activity','mentions','system'].includes(state.filter)&&category(n)!==state.filter)return false;if(!q)return true;return[...typeInfo(n),message(n),actor(n),target(n),n.type].join(' ').toLowerCase().includes(q)}).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function render(){const list=$('#list'),items=filtered(),unread=[...state.items.values()].filter(n=>!n.read).length;$('#unreadCount').textContent=unread>99?'99+':unread;$('#markAllBtn').disabled=!unread;$('#deleteReadBtn').disabled=!([...state.items.values()].some(n=>n.read));$('#clearBtn').disabled=!state.items.size;if(!items.length){list.innerHTML=`<div class="empty"><strong>${state.items.size?'No matching notifications.':'No notifications yet.'}</strong><span>${state.items.size?'Try another filter or search.':'New SPIKE activity will appear here.'}</span></div>`;return}list.innerHTML=items.map(n=>{const [icon,title]=typeInfo(n),a=actor(n),t=target(n),h=hrefFor(n);return`<button class="item ${n.read?'':'unread'}" type="button" data-notification-id="${esc(n.id)}"><span class="icon" aria-hidden="true">${icon}</span><span class="copy"><span class="title">${esc(n.data?.title||title)}</span><span class="text">${esc(message(n))}</span><span class="meta">${a?`<span class="badge">${esc(a)}</span>`:''}${t?`<span class="badge">${esc(t)}</span>`:''}<span>${esc(timeAgo(n.created_at))}</span>${n.group_count>1?`<span class="badge">${esc(n.group_count)} related</span>`:''}</span></span>${n.read?'':'<span class="new">NEW</span>'}</button>`}).join('')}
async function call(name,args={},ms=12000){const result=await Promise.race([db.rpc(name,args),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request timed out.')),ms))]);if(result.error)throw result.error;return result.data}
async function load({reset=false}={}){if(!state.user||state.loading||state.loadingMore)return;const more=!reset;if(more&&!state.hasMore)return;more?state.loadingMore=true:state.loading=true;try{const data=await call('get_smart_notification_page',{p_limit:40,p_before_created_at:more&&state.before?state.before.created_at:null,p_before_id:more&&state.before?state.before.id:null});const rows=uniqueSort(data);if(reset){state.items.clear();state.before=null;state.hasMore=true}merge(rows);if(rows.length<40)state.hasMore=false;if(rows.length)state.before=rows[rows.length-1];render()}finally{state.loading=false;state.loadingMore=false}}
async function markRead(id){const n=state.items.get(id);if(!n||n.read)return;await call('mark_notification_read',{p_notification_id:id});n.read=true;state.items.set(id,n);render()}
async function markAll(){if(!state.user)return;$('#markAllBtn').disabled=true;try{await call('mark_all_notifications_read');for(const n of state.items.values())n.read=true;render();toast('All notifications marked as read.')}catch(e){toast(e.message||'Could not mark notifications as read.',true)}}
async function deleteRead(){try{await call('delete_read_notifications');for(const [id,n] of state.items)if(n.read)state.items.delete(id);render();toast('Read notifications deleted.')}catch(e){toast(e.message||'Could not delete read notifications.',true)}}
async function clearAll(){if(!state.items.size)return;if(!confirm('Clear all notifications? This cannot be undone.'))return;try{await call('clear_notifications');state.items.clear();state.before=null;state.hasMore=false;render();toast('All notifications cleared.')}catch(e){toast(e.message||'Could not clear notifications.',true)}}
function toast(msg,error=false){if(window.spikePremiumToast){window.spikePremiumToast(msg,error?'error':'success',3000);return}const old=$('#toast');if(old)old.remove();const t=document.createElement('div');t.id='toast';t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:4000;padding:12px 16px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#111827;color:#fff;max-width:calc(100% - 24px)';document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function openModal(n){const [icon,title]=typeInfo(n),d=data(n),h=hrefFor(n);$('#modalIcon').textContent=icon;$('#modalTitle').textContent=d.title||title;$('#modalMeta').textContent=[timeAgo(n.created_at),n.read?'Read':'Unread'].join(' • ');const fields=[['Message',message(n)],['From',actor(n)],['Target',target(n)],['Type',n.type]].filter(([,v])=>v);$('#modalBody').innerHTML=fields.map(([k,v])=>`<p><strong style="color:#f8fafc">${esc(k)}</strong><br>${esc(v)}</p>`).join('');const actions=$('#modalActions');actions.innerHTML=h?`<button class="btn primary" type="button" id="openRelated">Open related activity</button>`:'';$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#openRelated')?.addEventListener('click',()=>location.href=h);$('#modalClose').focus()}
function closeModal(){$('#modal').classList.remove('open');$('#modal').setAttribute('aria-hidden','true');document.body.style.overflow=''}
async function subscribe(){if(state.channel)await db.removeChannel(state.channel);state.channel=db.channel(`spike-notifications:${state.user.id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${state.user.id}`},payload=>{merge([payload.new]);render()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:`user_id=eq.${state.user.id}`},payload=>{merge([payload.new]);render()}).on('postgres_changes',{event:'DELETE',schema:'public',table:'notifications',filter:`user_id=eq.${state.user.id}`},payload=>{const id=String(payload.old?.id||'');if(id)state.items.delete(id);render()}).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){setTimeout(()=>state.user&&subscribe().catch(()=>{}),3000)}})}
async function boot(){try{const {data,error}=await db.auth.getSession();if(error)throw error;state.user=data.session?.user||null;if(!state.user){location.replace('index.html?reauth=1');return}window.AppPresence?.start(db);await load({reset:true});await subscribe();state.booted=true;$('#loader').classList.add('hide')}catch(e){console.error('SPIKE notifications boot failed',e);$('#loader').classList.add('hide');$('#list').innerHTML=`<div class="empty error"><strong>Could not load notifications.</strong><span>${esc(e.message||'Please try again.')}</span><br><button class="btn primary" id="retry" type="button" style="margin-top:12px">Retry</button></div>`;$('#retry').onclick=()=>location.reload()}}
$$('.tab').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;$$('.tab').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-selected',active?'true':'false')});render()}));
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value||'';render()});
$('#refreshBtn').addEventListener('click',async()=>{if(!state.user)return;try{await load({reset:true});toast('Notifications refreshed.')}catch(e){toast(e.message||'Could not refresh notifications.',true)}});
$('#markAllBtn').addEventListener('click',markAll);$('#deleteReadBtn').addEventListener('click',deleteRead);$('#clearBtn').addEventListener('click',clearAll);
$('#list').addEventListener('click',async e=>{const b=e.target.closest('[data-notification-id]');if(!b)return;const n=state.items.get(b.dataset.notificationId);if(!n)return;b.disabled=true;try{await markRead(n.id);openModal(n)}catch(err){toast(err.message||'Could not update notification.',true)}finally{b.disabled=false}});
$('#modalClose').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>location.href=b.dataset.nav));
state.observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&state.hasMore&&!state.loadingMore)load().catch(e=>toast(e.message||'Could not load more notifications.',true))},{rootMargin:'500px'});state.observer.observe($('#sentinel'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.user)load({reset:true}).catch(()=>{})});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&state.booted)location.replace('index.html?reauth=1');if(event==='TOKEN_REFRESHED'&&session)state.user=session.user});
window.addEventListener('beforeunload',()=>{state.observer?.disconnect();if(state.channel)db.removeChannel(state.channel)});
boot();
</script>

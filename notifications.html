function hrefOf(n){const d=dataOf(n),t=typeOf(n);let h=d.url||d.href||d.link||'';if(!h&&d.message_id)h='message.html?message_id='+encodeURIComponent(d.message_id);if(!h&&d.conversation_id)h='message.html?private_uid='+encodeURIComponent(d.conversation_id);if(!h&&d.post_id)h='feed.html?post='+encodeURIComponent(d.post_id);if(!h&&d.repost_id)h='feed.html?post='+encodeURIComponent(d.repost_id);if(!h&&d.room_id)h='rooms.html?room='+encodeURIComponent(d.room_id);if(!h&&d.actor_id&&/follow|friend|story|post/.test(t))h='view_user.html?uid='+encodeURIComponent(d.actor_id);if(!h&&/message|call/.test(t))h='messages.html';if(!h&&/room/.test(t))h='rooms.html';if(!h&&/friend/.test(t))h='friends.html';if(!h||/security|system|auth|login|announcement|broadcast/.test(t)&&!h)return '';try{const u=new URL(h,location.href);return u.origin===location.origin?u.href:'';}catch{return '';}}
function timeOf(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return '';const diff=Math.max(0,Date.now()-d.getTime());if(diff<60000)return 'Just now';if(diff<3600000)return `${Math.floor(diff/60000)}m ago`;if(diff<86400000)return `${Math.floor(diff/3600000)}h ago`;if(diff<604800000)return `${Math.floor(diff/86400000)}d ago`;return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'});}
function groupRows(list){const out=[],map=new Map();for(const n of list){const key=String(n.group_key||dataOf(n).group_key||'');if(!key){out.push({...n,_items:[n],_count:1});continue;}let g=map.get(key);if(!g){g={...n,_items:[n],_count:1};map.set(key,g);out.push(g);}else{g._items.push(n);g._count++;g.read=g.read&&n.read;}}return out;}
function visibleRows(){return groupRows(state.rows.filter(n=>{const pk=prefOf(n);if(pk&&state.prefs[pk]===false&&!critical(n))return false;if(state.filter==='unread'&&n.read)return false;if(state.filter==='mentions'&&categoryOf(n)!=='mentions')return false;if(state.filter==='requests'&&categoryOf(n)!=='requests')return false;if(!state.query)return true;return [titleOf(n),bodyOf(n),actorName(n),typeOf(n)].join(' ').toLowerCase().includes(state.query); }));}
function counts(){const active=state.rows.filter(n=>{const pk=prefOf(n);return !(pk&&state.prefs[pk]===false&&!critical(n));});const unread=active.filter(n=>!n.read);$('unreadCount').textContent=unread.length>99?'99+':String(unread.length);$('newCount').textContent=unread.length?`(${unread.length>99?'99+':unread.length})`:'';$('allCount').textContent=active.length?`(${active.length>999?'999+':active.length})`:'';$('mentionCount').textContent=active.filter(n=>categoryOf(n)==='mentions'&&!n.read).length?`(${active.filter(n=>categoryOf(n)==='mentions'&&!n.read).length})`:'';$('requestCount').textContent=active.filter(n=>categoryOf(n)==='requests'&&!n.read).length?`(${active.filter(n=>categoryOf(n)==='requests'&&!n.read).length})`:'';}
async function withTimeout(p,ms=15000){let timer;return Promise.race([p,new Promise((_,r)=>timer=setTimeout(()=>r(new Error('Activity request timed out.')),ms))]).finally(()=>clearTimeout(timer));}
async function loadPage(reset=false){if(state.loading)return;state.loading=true;$('statusbar').textContent=reset?'Refreshing activity…':'Loading older activity…';try{const r=await withTimeout(sb.rpc('get_notification_page',{p_limit:50,p_before_created_at:reset?null:state.cursor?.created_at||null,p_before_id:reset?null:state.cursor?.id||null}));if(r.error)throw r.error;const chunk=Array.isArray(r.data)?r.data:[];if(reset)state.rows=[];const seen=new Set(state.rows.map(n=>String(n.id)));for(const n of chunk)if(n?.id&&!seen.has(String(n.id))){state.rows.push(n);seen.add(String(n.id));}state.rows.sort((a,b)=>{const d=new Date(b.created_at)-new Date(a.created_at);return d||String(b.id).localeCompare(String(a.id));});state.hasMore=chunk.length===50;state.cursor=chunk.length?{created_at:chunk[chunk.length-1].created_at,id:chunk[chunk.length-1].id}:null;await hydrateActors(chunk);render();}finally{state.loading=false;$('statusbar').textContent='';}}
async function hydrateActors(list){const ids=[...new Set((list||[]).map(actorIdOf).filter(Boolean))].filter(id=>!state.profileCache.has(id));if(!ids.length)return;try{const r=await sb.rpc('get_public_profiles',{p_user_ids:ids});if(r.error)throw r.error;(r.data||[]).forEach(p=>p?.id&&state.profileCache.set(String(p.id),p));}catch(e){console.warn('[SPIKE activity actors]',e);}}
async function loadSummary(){try{const r=await withTimeout(sb.rpc('get_notification_summary'),10000);if(r.error)throw r.error;const s=r.data||{};$('heroText').textContent=s.unread?`${Number(s.unread).toLocaleString()} unread activities are waiting for you.`:'You are all caught up.';counts();}catch(e){console.warn('[SPIKE activity summary]',e);}}
async function loadPrefs(){try{const r=await withTimeout(sb.rpc('get_notification_preferences'),10000);if(r.error)throw r.error;state.prefs={...defaults,...(r.data||{})};}catch(e){state.prefs={...defaults};}}
async function savePrefs(){const inputs=[...document.querySelectorAll('[data-pref-key]')];const next={...state.prefs};inputs.forEach(x=>next[x.dataset.prefKey]=!!x.checked);try{const r=await withTimeout(sb.rpc('set_notification_preferences',{p_preferences:next}),10000);if(r.error)throw r.error;state.prefs={...defaults,...(r.data||next)};closeSheet();render();toast('Notification preferences saved');}catch(e){toast(e?.message||'Could not save preferences');}}
function render(){const feed=$('activityFeed'),groups=visibleRows();counts();if(!groups.length){feed.innerHTML=`<div class="empty"><strong>${state.query?'No matching activity':'You are all caught up'}</strong><span>${state.query?'Try another search.':'New activity will appear here automatically.'}</span></div>`;}else{let last='';feed.innerHTML=groups.map((g,i)=>{const day=new Date(g.created_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});let label='';if(day!==last){last=day;label=`<div class="day-label">${esc(day)}</div>`;}return label+cardHtml(g,i);}).join('');bindCards();}$('loadMore').hidden=!state.hasMore||state.loading;}
function miniAvatar(n){const id=actorIdOf(n),p=id&&state.profileCache.get(id),src=p?.avatar_url||dataOf(n).actor_avatar||'';return src?`<div class="mini-avatar"><img src="${esc(src)}" alt=""></div>`:`<div class="mini-avatar">${esc((actorName(n)||'S').charAt(0).toUpperCase())}</div>`;}
function actionsHtml(g){const t=typeOf(g),items=g._items||[g];if(t==='friend_request'&&items.length===1){const id=dataOf(g).request_id;if(UUID.test(String(id||'')))return `<div class="actions"><button class="action primary" data-action="accept" data-request="${esc(id)}">Accept</button><button class="action" data-action="decline" data-request="${esc(id)}">Decline</button></div>`;}if(t==='message'&&hrefOf(g))return `<div class="actions"><button class="action primary" data-open="${esc(hrefOf(g))}">Reply</button></div>`;if(t==='call_incoming'&&hrefOf(g))return `<div class="actions"><button class="action primary" data-open="${esc(hrefOf(g))}">Open call</button></div>`;if(t==='call_missed'&&hrefOf(g))return `<div class="actions"><button class="action primary" data-open="${esc(hrefOf(g))}">Call back</button></div>`;if(/room_invite/.test(t))return `<div class="actions"><button class="action primary" data-open="rooms.html">Open Rooms</button></div>`;if(/room_purchase_/.test(t)&&hrefOf(g))return `<div class="actions"><button class="action" data-open="${esc(hrefOf(g))}">View Room</button></div>`;if(items.length>1&&categoryOf(g)==='requests')return `<div class="actions"><button class="action primary" data-open="friends.html">Review requests</button></div>`;return '';}
function cardHtml(g,index){const items=g._items||[g],count=items.length,actors=[...new Map(items.map(n=>[actorIdOf(n)||('x'+n.id),n])).values()].slice(0,3),body=count>1?groupBody(g,actors,count):bodyOf(g);const h=hrefOf(g);const icon=iconOf(g);const unread=!g.read;const typeLabel=count>1?`${count} activity${count===1?'':'ies'}`:titleOf(g);return `<article class="activity ${unread?'unread':''}" data-id="${esc(g.id)}" data-index="${index}"><div class="swipe-actions"><button type="button" data-swipe="read" aria-label="Mark read">✓</button><button type="button" data-swipe="delete" aria-label="Delete">🗑</button></div><div class="activity-main" tabindex="0"><div class="activity-icon">${icon}</div><div class="copy"><div class="copy-head"><div class="copy-title">${esc(titleOf(g))}</div>${unread?'<span class="new-dot" aria-label="Unread"></span>':''}</div><div class="copy-body">${esc(body)}</div>${count>1?`<div class="group-avatars">${actors.map(miniAvatar).join('')}</div>`:''}<div class="copy-meta"><span class="type">${esc(typeLabel)}</span><span>${esc(timeOf(g.created_at))}</span></div>${actionsHtml(g)}</div><div class="chev">${h?'›':'·'}</div></div></article>`;}
function groupBody(g,actors,count){const names=actors.map(actorName);if(names.length===1)return `${names[0]} and ${count-1} more activity${count-1===1?'':'ies'} · ${bodyOf(g)}`;if(names.length===2)return `${names[0]}, ${names[1]}${count>2?` and ${count-2} more`:''}`;return `${names[0]}, ${names[1]} and ${count-2} more`}
async function markOne(id){const r=await sb.rpc('mark_notification_read',{p_notification_id:id});if(r.error)throw r.error;const n=state.rows.find(x=>String(x.id)===String(id));if(n)n.read=true;}
async function markGroup(g){for(const n of g._items||[g])if(!n.read)await markOne(n.id);}
async function markAll(){const r=await sb.rpc('mark_all_notifications_read');if(r.error)throw r.error;state.rows.forEach(n=>n.read=true);render();loadSummary();toast('All activity marked read');}
async function clearAll(){if(!confirm('Clear your activity history?'))return;const r=await sb.rpc('clear_notifications');if(r.error)throw r.error;state.rows=[];state.cursor=null;state.hasMore=false;render();loadSummary();toast('Activity cleared');}
async function deleteRead(){const r=await sb.rpc('delete_read_notifications');if(r.error)throw r.error;state.rows=state.rows.filter(n=>!n.read);render();loadSummary();toast('Read activity deleted');}
async function deleteOne(id){const r=await sb.rpc('delete_notification',{p_notification_id:id});if(r.error)throw r.error;state.rows=state.rows.filter(n=>String(n.id)!==String(id));render();loadSummary();}
async function acceptRequest(id){const r=await sb.rpc('accept_friend_request',{p_request_id:id});if(r.error)throw r.error;toast('Friend request accepted');await loadPage(true);await loadSummary();}
async function declineRequest(id){const r=await sb.rpc('decline_friend_request',{p_request_id:id});if(r.error)throw r.error;toast('Friend request declined');await loadPage(true);await loadSummary();}
function openDetails(g){openSheet('Activity details',`<div class="detail-section"><div class="detail-label">Activity</div><div class="detail-text"><b>${esc(titleOf(g))}</b><br>${esc(bodyOf(g))}</div></div><div class="detail-section"><div class="detail-label">Time</div><div class="detail-text">${esc(new Date(g.created_at).toLocaleString())}</div></div><div class="detail-section"><div class="detail-label">Type</div><div class="detail-text">${esc(typeOf(g)||'activity')}</div></div><div class="detail-section"><div class="detail-label">Data</div><pre class="json">${esc(JSON.stringify(dataOf(g),null,2))}</pre></div>${hrefOf(g)?`<div class="actions"><button class="action primary" data-open="${esc(hrefOf(g))}">Open</button></div>`:''}`);}
function bindCards(){document.querySelectorAll('.activity').forEach(card=>{const main=card.querySelector('.activity-main'),id=card.dataset.id;main.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){e.stopPropagation();try{if(a.dataset.action==='accept')await acceptRequest(a.dataset.request);else await declineRequest(a.dataset.request);}catch(err){toast(err?.message||'Action failed');}return;}const open=e.target.closest('[data-open]');if(open){e.stopPropagation();try{await markOne(id);}catch(_){}location.href=open.dataset.open;return;}const g=visibleRows().find(x=>String(x.id)===String(id));if(!g)return;try{await markGroup(g);}catch(_){}render();const h=hrefOf(g);if(h)location.href=h;else openDetails(g);});let startX=0,startY=0,moved=false;main.addEventListener('touchstart',e=>{const t=e.touches[0];state.touch={id,startX:t.clientX,startY:t.clientY};moved=false;},{passive:true});main.addEventListener('touchmove',e=>{if(!state.touch)return;const t=e.touches[0],dx=t.clientX-state.touch.startX,dy=t.clientY-state.touch.startY;if(Math.abs(dy)>Math.abs(dx)){return;}if(dx<0){moved=true;main.style.transform=`translateX(${Math.max(-94,dx)}px)`;}},{passive:true});main.addEventListener('touchend',async e=>{if(!state.touch)return;const t=e.changedTouches[0],dx=t.clientX-state.touch.startX;main.style.transform='';if(dx<-55){main.classList.add('swiped');setTimeout(()=>main.classList.remove('swiped'),3500);}state.touch=null;});card.querySelector('[data-swipe="read"]')?.addEventListener('click',async e=>{e.stopPropagation();try{const g=visibleRows().find(x=>String(x.id)===String(id));if(g)await markGroup(g);render();}catch(err){toast(err?.message||'Could not mark read');}});card.querySelector('[data-swipe="delete"]')?.addEventListener('click',async e=>{e.stopPropagation();try{await deleteOne(id);}catch(err){toast(err?.message||'Could not delete');}});});}
function setFilter(f){state.filter=f;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));$('sectionLabel').textContent=f==='all'?'Recent activity':f==='unread'?'New activity':f==='mentions'?'Mentions':'Friend requests';render();}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');$('sheetBackdrop').classList.add('open');}
function closeSheet(){$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true');$('sheetBackdrop').classList.remove('open');}
function openMenu(){openSheet('Activity options',`<div class="menu-grid"><button class="menu-item" data-menu="mark">✓ Mark all read<small>Clear the unread state.</small></button><button class="menu-item" data-menu="delete-read">🗑 Delete read<small>Remove older read activity.</small></button><button class="menu-item" data-menu="clear">⌫ Clear everything<small>Remove your notification history.</small></button><button class="menu-item" data-menu="prefs">⚙ Preferences<small>Choose what reaches this inbox.</small></button><button class="menu-item" data-menu="browser">🔔 Browser alerts<small>Enable important live alerts.</small></button><button class="menu-item" data-menu="refresh">↻ Refresh now<small>Sync the latest activity.</small></button></div>`);}
function openPrefs(){const keys=[['likes','Likes','Post reactions and likes'],['comments','Comments','Comments on your posts'],['mentions','Mentions','Mentions and replies'],['follows','Follows','New followers'],['friend_requests','Friend requests','Requests and friend activity'],['messages','Messages','Private messages'],['calls','Calls','Incoming and missed calls'],['rooms','Rooms','Room announcements and activity'],['coins','Coins','Coins, gems and gifts'],['purchases','Purchases','Room purchase updates'],['announcements','Announcements','SPIKE announcements'],['system','System & security','Security and account activity']];openSheet('Notification preferences',`${keys.map(([k,l,s])=>`<label class="pref-row"><span class="pref-copy"><b>${esc(l)}</b><small>${esc(s)}</small></span><input class="switch" type="checkbox" data-pref-key="${k}" ${state.prefs[k]!==false?'checked':''}></label>`).join('')}<div class="actions" style="margin-top:12px"><button class="action primary" id="savePrefs" type="button">Save preferences</button></div>`);$('savePrefs')?.addEventListener('click',savePrefs);}
async function enableBrowserAlerts(){if(!('Notification'in window)){toast('Browser notifications are not supported here.');return;}const p=await Notification.requestPermission();toast(p==='granted'?'Browser alerts enabled.': 'Browser alerts were not enabled.');}
function toast(msg){const el=$('toast');el.textContent=String(msg||'');el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2800);}
async function realtimeSubscribe(){if(state.channel){try{await sb.removeChannel(state.channel);}catch(_){}state.channel=null;}state.channel=sb.channel('spike-activity-center-'+state.me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+state.me.id},async payload=>{state.lastRealtimeAt=Date.now();const n=payload.new;if(!state.rows.some(x=>String(x.id)===String(n.id))){state.rows.unshift(n);await hydrateActors([n]);render();await loadSummary();if(document.hidden&&window.Notification?.permission==='granted'&&!/low/.test(String(n.priority||''))){try{new window.Notification(titleOf(n),{body:bodyOf(n).slice(0,160),tag:'spike-activity-'+n.id});}catch(_){}try{$('notificationTone')?.play?.().catch?.(()=>{});}catch(_){}}}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:'user_id=eq.'+state.me.id},payload=>{const i=state.rows.findIndex(x=>String(x.id)===String(payload.new.id));if(i>=0)state.rows[i]=payload.new;state.lastRealtimeAt=Date.now();render();loadSummary();}).subscribe(status=>{if(status==='SUBSCRIBED'){$('liveStatus').textContent='Live activity on';state.lastRealtimeAt=Date.now();}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){$('liveStatus').textContent='Live activity reconnecting…';setTimeout(()=>realtimeSubscribe().catch(()=>{}),1800);}});}
async function boot(){const {data,error}=await sb.auth.getUser();if(error||!data?.user){location.replace('index.html?reauth=1');return;}state.me=data.user;try{state.previousVisit=Number(localStorage.getItem('spike.notifications.lastSeenAt')||0);}catch(_){}await loadPrefs();await loadPage(true);await loadSummary();const since=state.previousVisit?state.rows.filter(n=>new Date(n.created_at).getTime()>state.previousVisit):[];if(since.length){$('awayText').textContent=`${since.length} new activit${since.length===1?'y':'ies'} arrived since your last visit.`;$('awayCard').classList.add('show');}try{localStorage.setItem('spike.notifications.lastSeenAt',String(Date.now()));}catch(_){}await realtimeSubscribe();setInterval(()=>{if(!document.hidden&&state.me){loadSummary().catch(()=>{});if(!state.lastRealtimeAt||Date.now()-state.lastRealtimeAt>45000)loadPage(true).catch(()=>{});}},30000);}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b)setFilter(b.dataset.filter);});$('searchBtn').addEventListener('click',()=>{$('searchWrap').classList.toggle('open');if($('searchWrap').classList.contains('open'))setTimeout(()=>$('searchInput').focus(),30);});$('closeSearch').addEventListener('click',()=>{$('searchInput').value='';state.query='';$('searchWrap').classList.remove('open');render();});$('searchInput').addEventListener('input',e=>{state.query=String(e.target.value||'').trim().toLowerCase();render();});$('refreshBtn').addEventListener('click',()=>loadPage(true).then(loadSummary).catch(e=>toast(e?.message||'Could not refresh activity.')));$('loadMore').addEventListener('click',()=>loadPage(false).catch(e=>toast(e?.message||'Could not load older activity.')));$('markVisible').addEventListener('click',async()=>{try{const groups=visibleRows();for(const g of groups)await markGroup(g);render();await loadSummary();toast('Visible activity marked read');}catch(e){toast(e?.message||'Could not mark activity read.');}});$('menuBtn').addEventListener('click',openMenu);$('sheetClose').addEventListener('click',closeSheet);$('sheetBackdrop').addEventListener('click',closeSheet);$('sheetBody').addEventListener('click',async e=>{const menu=e.target.closest('[data-menu]'),open=e.target.closest('[data-open]');if(open){closeSheet();location.href=open.dataset.open;return;}if(!menu)return;try{if(menu.dataset.menu==='mark')await markAll();if(menu.dataset.menu==='delete-read')await deleteRead();if(menu.dataset.menu==='clear')await clearAll();if(menu.dataset.menu==='prefs'){openPrefs();return;}if(menu.dataset.menu==='browser')await enableBrowserAlerts();if(menu.dataset.menu==='refresh')await loadPage(true);closeSheet();}catch(err){toast(err?.message||'Action failed');}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});$('feedNav').onclick=()=>location.href='feed.html';$('friendsNav').onclick=()=>location.href='friends.html';$('chatNav').onclick=()=>location.href='messages.html';$('profileNav').onclick=()=>location.href='profile.html';document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.me){loadSummary().catch(()=>{});if(!state.lastRealtimeAt||Date.now()-state.lastRealtimeAt>45000)loadPage(true).catch(()=>{});}});sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){if(state.channel)sb.removeChannel(state.channel).catch(()=>{});location.replace('index.html?reauth=1');}else if(session?.user)state.me=session.user;});window.addEventListener('beforeunload',()=>{try{localStorage.setItem('spike.notifications.lastSeenAt',String(Date.now()));}catch(_){}if(state.channel)sb.removeChannel(state.channel).catch(()=>{});});boot().catch(e=>{console.error('[SPIKE activity boot]',e);$('activityFeed').innerHTML='<div class="empty"><strong>Could not load activity</strong><span>Please refresh and try again.</span></div>';toast(e?.message||'Could not load activity.');});
</script>
<audio id="notificationTone" src="assets/mp3/notifications.mp3" preload="auto"></audio>

<script src="js/premium-back.js" defer></script>

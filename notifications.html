<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPIKE — Notifications</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08090c;--card:#111318;--line:#242832;--text:#f7f8fa;--muted:#9ca3af;--accent:#7c5cff;--danger:#ff4d67;--ok:#36d399}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:rgba(8,9,12,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right))}
.bar{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:0;background:transparent;color:var(--text);font-size:24px;cursor:pointer}.title{font-weight:800;font-size:20px;flex:1}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}main{max-width:760px;margin:auto;padding:14px 12px 30px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tab{white-space:nowrap}.tab.active{background:var(--accent);border-color:var(--accent)}.section{display:none}.section.active{display:block}.notice{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;margin-top:12px}.item{display:flex;gap:12px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}.item:hover{background:#151820}.item.unread{background:rgba(124,92,255,.08)}.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#222733;display:grid;place-items:center;font-weight:800;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.body{min-width:0;flex:1}.text{line-height:1.4}.meta{font-size:12px;color:var(--muted);margin-top:5px}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}.type{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1e26;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:50;box-shadow:0 8px 30px #0008}.loading{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="bar">
<button class="back" id="back" aria-label="Back">‹</button><div class="title">Notifications</div>
<div class="actions"><button class="btn" id="markAll">Mark all read</button></div>
</div></header>
<main>
<div class="tabs"><button class="btn tab active" data-tab="all">All <span id="allCount"></span></button><button class="btn tab" data-tab="social">Social</button><button class="btn tab" data-tab="messages">Messages</button></div>
<section id="all" class="section active"><div id="allList" class="loading">Loading…</div></section>
<section id="social" class="section"><div id="socialList" class="loading">Loading…</div></section>
<section id="messages" class="section"><div id="messageList" class="loading">Loading…</div></section>
</main><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://bkrrewagsbjqgmxaaqyt.supabase.co";
const SUPABASE_KEY="sb_publishable_24Z2PQpdG13cf6_9w8C7nA_zXEzr60O";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"spike-auth"}});
let user=null,notifications=[],messages=[],channel=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").style.display="none",2400)}
function timeAgo(v){const d=Date.now()-new Date(v).getTime(),m=Math.floor(d/60000);if(m<1)return"now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";const days=Math.floor(h/24);return days+"d"}
function avatar(p){return p?.avatar_url||p?.avatar||""}
function name(p){return p?.display_name||p?.username||"SPIKE user"}
function iconType(n){return {like:"♥",comment:"💬",friend:"👥",follow:"➕",mention:"@",system:"ℹ",message:"✉",call:"☎"}[n.type]||"🔔"}
function target(n){const d=n.data||{};return d.url||d.href||d.path||d.post_url||d.profile_url||null}

async function requireAuth(){
 const {data:{session},error}=await sb.auth.getSession();
 if(error||!session?.user){location.replace("index.html");return false}
 user=session.user;return true
}
async function loadNotifications(){
 const [a,b]=await Promise.all([
   sb.from("notifications").select("id,user_id,actor_id,type,data,read,created_at,profiles:actor_id(id,username,display_name,avatar_url)").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100),
   sb.from("message_notifications").select("id,user_id,conversation_id,message_id,type,read,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100)
 ]);
 if(a.error)throw a.error;if(b.error)throw b.error;
 notifications=a.data||[];messages=b.data||[];render();
}
function renderItem(n,isMessage=false){
 const p=n.profiles||null,d=n.data||{},unread=!n.read;
 const actor= p ? name(p) : (d.actor_name||"SPIKE");
 const text=isMessage ? (d.text||"New message") : (d.message||({like:"liked your post",comment:"commented on your post",friend:"sent you a friend request",follow:"started following you",mention:"mentioned you"}[n.type]||"You have a new notification"));
 const av=avatar(p);
 return `<article class="item ${unread?"unread":""}" data-id="${esc(n.id)}" data-message="${isMessage}">
   <div class="avatar">${av?`<img src="${esc(av)}" alt="">`:esc(actor.charAt(0).toUpperCase())}</div>
   <div class="body"><div class="text"><b>${esc(actor)}</b> ${esc(text)}</div><div class="type">${esc(n.type||"notification")}</div><div class="meta">${timeAgo(n.created_at)}</div></div>
   ${unread?'<div class="dot"></div>':""}</article>`;
}
function fill(el,items,isMessage=false){
 el.innerHTML=items.length?items.map(n=>renderItem(n,isMessage)).join(""):'<div class="notice">You’re all caught up.</div>';
}
function render(){
 const social=notifications;
 const all=[...notifications.map(n=>({...n,__message:false})),...messages.map(n=>({...n,__message:true}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 fill($("allList"),all,false);fill($("socialList"),social,false);fill($("messageList"),messages,true);
 const unread=all.filter(n=>!n.read).length;$("allCount").textContent=unread?`(${unread})`:"";
 document.querySelectorAll(".item").forEach(el=>el.onclick=()=>openItem(el));
}
async function openItem(el){
 const id=el.dataset.id,isMsg=el.dataset.message==="true";
 const table=isMsg?"message_notifications":"notifications";
 await sb.from(table).update({read:true}).eq("id",id).eq("user_id",user.id);
 const list=isMsg?messages:notifications;const n=list.find(x=>x.id===id);if(n)n.read=true;render();
 const t=target(n||{});
 if(t)location.href=t;
}
async function markAll(){
 const [a,b]=await Promise.all([
   sb.from("notifications").update({read:true}).eq("user_id",user.id).eq("read",false),
   sb.from("message_notifications").update({read:true}).eq("user_id",user.id).eq("read",false)
 ]);
 if(a.error||b.error){toast("Could not mark all as read");return}
 notifications.forEach(n=>n.read=true);messages.forEach(n=>n.read=true);render();toast("All notifications marked read");
}
function subscribe(){
 channel=sb.channel("spike-notifications-"+user.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},()=>loadNotifications().catch(console.warn))
 .on("postgres_changes",{event:"*",schema:"public",table:"message_notifications",filter:"user_id=eq."+user.id},()=>loadNotifications().catch(console.warn))
 .subscribe();
}
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));btn.classList.add("active");$(btn.dataset.tab).classList.add("active")});
$("back").onclick=()=>history.length>1?history.back():location.href="feed.html";
$("markAll").onclick=markAll;
(async()=>{try{if(await requireAuth()){await loadNotifications();subscribe()}}catch(e){console.error(e);$("allList").innerHTML='<div class="notice">Unable to load notifications. Please try again.</div>'}})();
window.addEventListener("beforeunload",()=>{if(channel)sb.removeChannel(channel)});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Notifications — SPIKE Ultra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* (same styles as before, omitted for brevity – copy from previous version) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-deep: #070b10;
            --bg-surface: #0d1520;
            --bg-card: rgba(20, 32, 48, 0.7);
            --bg-glass: rgba(13, 21, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 168, 132, 0.3);
            --primary: #00a884;
            --primary-hover: #00c29a;
            --primary-glow: rgba(0, 168, 132, 0.4);
            --accent: #0ea5e9;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.4);
            --success: #00a884;
            --success-glow: rgba(0, 168, 132, 0.4);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --online-color: #22c55e;
            --input-bg: rgba(7, 11, 16, 0.6);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-focus-bg: rgba(7, 11, 16, 0.85);
            --card-bg: rgba(20, 32, 48, 0.7);
            --radius: 16px;
            --gold: #fbbf24;
        }
        body.light-mode {
            --bg-deep: #f0f4fa;
            --bg-surface: #e8edf4;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f1824;
            --text-muted: #5a6e8a;
            --border-glow: rgba(0, 168, 132, 0.2);
            --card-bg: rgba(255, 255, 255, 0.9);
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 168, 132, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(14, 165, 233, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .notif-header {
            width: 100%;
            max-width: 800px;
            padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            gap: 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .back-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: clamp(36px, 9vw, 40px);
            height: clamp(36px, 9vw, 40px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3vw, 1.4rem);
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            min-width: 36px;
            min-height: 36px;
        }
        .header-left .back-btn:active {
            transform: scale(0.9);
        }
        .header-left .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }
        .header-left .logo {
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text-main) 20%, var(--primary) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .header-right .header-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: clamp(36px, 9vw, 40px);
            height: clamp(36px, 9vw, 40px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 2.8vw, 1.2rem);
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            min-width: 36px;
            min-height: 36px;
            position: relative;
        }
        .header-right .header-btn:active {
            transform: scale(0.9);
        }
        .header-right .header-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }
        .header-right .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error);
            color: #fff;
            font-size: 0.55rem;
            font-weight: 800;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 12px var(--error-glow);
            border: 2px solid var(--bg-deep);
        }
        .header-right .avatar-btn {
            width: clamp(36px, 9vw, 40px);
            height: clamp(36px, 9vw, 40px);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #005c4b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            min-width: 36px;
            min-height: 36px;
        }
        .header-right .avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .toolbar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px 12px;
            margin-bottom: 4px;
        }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .toolbar .search-wrapper {
            flex: 1;
            min-width: 140px;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 10px;
            transition: var(--transition);
        }
        .toolbar .search-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.12);
        }
        .toolbar .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.8rem;
            padding: 6px 0;
            min-height: 32px;
        }
        .toolbar .search-wrapper input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }
        .toolbar .search-wrapper .search-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-right: 4px;
        }

        .toolbar .filter-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .toolbar .filter-buttons button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            white-space: nowrap;
            min-height: 28px;
            touch-action: manipulation;
        }
        .toolbar .filter-buttons button:active {
            transform: scale(0.95);
        }
        .toolbar .filter-buttons button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .toolbar .settings-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 8px;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            min-height: 28px;
        }
        .toolbar .settings-toggle:active {
            transform: scale(0.95);
        }
        .toolbar .settings-toggle .icon {
            font-size: 0.9rem;
        }

        .settings-panel {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
        }
        .settings-panel.open {
            display: flex;
        }
        .settings-panel label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .settings-panel input[type="checkbox"] {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .notif-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            position: relative;
        }
        .notif-item {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 16px);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
            animation: notifIn 0.2s ease;
            position: relative;
        }
        .notif-item:hover {
            border-color: var(--border-glow);
        }
        .notif-item.unread {
            border-left: 3px solid var(--primary);
            background: rgba(0, 168, 132, 0.04);
        }
        @keyframes notifIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notif-avatar {
            width: clamp(40px, 10vw, 48px);
            height: clamp(40px, 10vw, 48px);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #005c4b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }
        .notif-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .notif-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .notif-message {
            font-size: clamp(0.85rem, 2.4vw, 0.92rem);
            line-height: 1.4;
            color: var(--text-main);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px;
        }
        .notif-message .action-icon {
            font-size: 1.1rem;
            margin-right: 2px;
        }

        .notif-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(0.65rem, 1.8vw, 0.72rem);
            color: var(--text-muted);
            margin-top: 2px;
        }
        .notif-meta .badge {
            font-size: 0.55rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .notif-meta .badge.feed {
            background: rgba(14, 165, 233, 0.12);
            color: var(--accent);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }
        .notif-meta .badge.rooms {
            background: rgba(245, 158, 11, 0.12);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .notif-meta .badge.chats {
            background: rgba(0, 168, 132, 0.12);
            color: var(--primary);
            border: 1px solid rgba(0, 168, 132, 0.2);
        }
        .notif-meta .badge.communities {
            background: rgba(168, 85, 247, 0.12);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .notif-meta .badge.verification {
            background: rgba(251, 191, 36, 0.12);
            color: var(--gold);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }
        .notif-meta .badge.announcements {
            background: rgba(236, 72, 153, 0.12);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.2);
        }

        .notif-time {
            color: var(--text-muted);
            opacity: 0.6;
        }
        .notif-read-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
            margin-left: auto;
            align-self: center;
            display: none;
        }
        .notif-item.unread .notif-read-dot {
            display: block;
        }

        .notif-count-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 6px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-left: 4px;
            flex-shrink: 0;
            min-height: 18px;
            display: inline-flex;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: clamp(40px, 8vw, 60px) 20px;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
        }
        .empty-state .icon {
            font-size: clamp(3rem, 8vw, 4rem);
            display: block;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .empty-state .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
            animation: sparkle 2s ease-in-out infinite;
        }
        .empty-state .sparkle:nth-child(2) {
            top: 15%;
            left: 10%;
            animation-delay: 0.3s;
            width: 4px;
            height: 4px;
        }
        .empty-state .sparkle:nth-child(3) {
            bottom: 20%;
            right: 15%;
            animation-delay: 0.7s;
            width: 8px;
            height: 8px;
        }
        .empty-state .sparkle:nth-child(4) {
            top: 30%;
            right: 20%;
            animation-delay: 1.1s;
            width: 5px;
            height: 5px;
        }
        .empty-state .sparkle:nth-child(5) {
            bottom: 30%;
            left: 12%;
            animation-delay: 1.5s;
            width: 6px;
            height: 6px;
        }
        @keyframes sparkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }
        .empty-state .tip {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid var(--border-color);
        }

        .clear-all-panel {
            width: 100%;
            margin-bottom: 8px;
            padding: 10px 14px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: var(--transition);
            flex-wrap: wrap;
        }
        .clear-all-panel:hover {
            border-color: var(--border-glow);
        }
        .clear-all-panel .clear-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .clear-all-panel .clear-info .count {
            font-weight: 700;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .clear-all-panel .clear-btn {
            background: linear-gradient(135deg, var(--error), #e11d48);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            box-shadow: 0 0 20px var(--error-glow);
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            min-height: 32px;
        }
        .clear-all-panel .clear-btn:active {
            transform: scale(0.95);
        }
        .clear-all-panel .clear-btn:hover {
            box-shadow: 0 0 30px var(--error-glow);
            transform: scale(1.02);
        }
        .clear-all-panel .clear-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .time-section {
            margin-bottom: 6px;
        }
        .time-section .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 6px 4px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== TOAST & CONFIRM (same as before, included for completeness) ===== */
        .toast-container {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            z-index: 9999;
            width: calc(100% - 32px);
            max-width: 420px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .toast-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast-content {
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(10px, 2.5vw, 14px) clamp(14px, 4vw, 18px);
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            animation: toastSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes toastSlideIn {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastSlideOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }
        .toast-container.removing .toast-content {
            animation: toastSlideOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, var(--toast-glow-color) 0%, transparent 70%);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }
        .toast-content>* {
            position: relative;
            z-index: 1;
        }
        .toast-icon-wrapper {
            width: clamp(32px, 8vw, 40px);
            height: clamp(32px, 8vw, 40px);
            min-width: clamp(32px, 8vw, 40px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: 800;
            flex-shrink: 0;
            position: relative;
        }
        .toast-icon-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: var(--toast-glow-color);
            opacity: 0.12;
            filter: blur(8px);
        }
        .toast-icon-wrapper .icon {
            position: relative;
            z-index: 1;
        }

        .toast-container.success {
            --toast-glow-color: rgba(0, 168, 132, 0.6);
        }
        .toast-container.success .toast-icon-wrapper {
            background: rgba(0, 168, 132, 0.12);
            border: 1px solid rgba(0, 168, 132, 0.2);
            color: var(--success);
        }
        .toast-container.error {
            --toast-glow-color: rgba(244, 63, 94, 0.6);
        }
        .toast-container.error .toast-icon-wrapper {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: var(--error);
        }
        .toast-container.warning {
            --toast-glow-color: rgba(245, 158, 11, 0.6);
        }
        .toast-container.warning .toast-icon-wrapper {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.2);

        }

        .toast-text-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }
        .toast-title {
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }
        .toast-message {
            font-size: clamp(0.7rem, 2.2vw, 0.78rem);
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .toast-close-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            min-width: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

        }
        .toast-close-btn:active {
            transform: scale(0.9);
        }
        .toast-close-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: var(--toast-glow-color);
            border-radius: 0 0 16px 16px;
            width: 100%;
            animation: toastProgress 3s linear forwards;
        }
        @keyframes toastProgress {
            0% {
                width: 100%;
            }
            100% {
                width: 0%;
            }
        }

        .confirm-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 13, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-modal-overlay.active {
            display: flex;
            opacity: 1;
            animation: modalFadeIn 0.4s ease-out;
        }
        @keyframes modalFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes modalSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .confirm-modal {
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: clamp(20px, 5vw, 28px);
            padding: clamp(20px, 5vw, 32px) clamp(16px, 4vw, 28px);
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .confirm-modal::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 0%, var(--toast-glow-color) 0%, transparent 60%);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        .confirm-modal>* {
            position: relative;
            z-index: 1;
        }
        .confirm-modal-icon {
            width: clamp(56px, 15vw, 72px);
            height: clamp(56px, 15vw, 72px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            margin: 0 auto 16px auto;
            position: relative;
        }
        .confirm-modal-icon::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: var(--toast-glow-color);
            opacity: 0.12;
            filter: blur(12px);
        }
        .confirm-modal-icon .icon {
            position: relative;
            z-index: 1;
        }
        .confirm-modal.danger {
            --toast-glow-color: rgba(244, 63, 94, 0.4);
        }
        .confirm-modal.danger .confirm-modal-icon {
            background: rgba(244, 63, 94, 0.1);
            border: 2px solid rgba(244, 63, 94, 0.2);
            color: var(--error);
        }
        .confirm-modal-title {
            font-size: clamp(1.1rem, 3.5vw, 1.3rem);
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }
        .confirm-modal-message {
            font-size: clamp(0.8rem, 2.5vw, 0.92rem);
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            margin: 8px 0 4px 0;
            padding: 0 4px;
        }
        .confirm-modal-details {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 8px 0 12px 0;
            font-size: clamp(0.75rem, 2.2vw, 0.82rem);
            color: var(--text-muted);
            line-height: 1.5;
        }
        .confirm-modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .confirm-modal-actions .btn-confirm {
            flex: 1;
            min-width: 100px;
            padding: clamp(10px, 3vw, 14px);

            border: none;
            font-family: var(--font-main);

            font-size: clamp(0.8rem, 2.5vw, 0.92rem);
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .confirm-modal-actions .btn-confirm:active {
            transform: scale(0.95);
        }
        .confirm-modal-actions .btn-confirm.danger {
            background: var(--error);
            color: white;
            box-shadow: 0 0 20px var(--error-glow);
        }
        .confirm-modal-actions .btn-confirm.danger:hover {
            background: #e11d48;
        }
        .confirm-modal-actions .btn-confirm.secondary {

        }
        .confirm-modal-actions .btn-confirm.secondary:hover {
            background: rgba(255, 255, 255, 0.08);

        @media (max-width: 480px) {
            .notif-header {
                padding: 6px 10px;

            .header-left .back-btn {

        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="notif-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='feed.html'">←</button>
            <a href="feed.html" class="logo">SPIKE</a>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="markAllRead()" title="Mark all as read">✓✓</button>
            <button class="header-btn" id="soundToggleBtn" onclick="toggleSound()" title="Toggle sound">🔊</button>
            <button class="header-btn" id="unreadBadgeBtn" style="position:relative;">
                <span style="font-size:0.9rem;">🔔</span>
                <span class="badge-count" id="unreadBadge" style="display:none;">0</span>
            </button>
            <button class="avatar-btn" id="notifAvatar" onclick="window.location.href='/profile'">👤</button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main style="width:100%;max-width:620px;padding:12px;display:flex;flex-direction:column;gap:8px;">

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-row">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search notifications..." oninput="renderAll()" />
                </div>
                <div class="filter-buttons" id="dateFilters">
                    <button data-date="today" class="active" onclick="setDateFilter('today')">Today</button>
                    <button data-date="week" onclick="setDateFilter('week')">This Week</button>
                    <button data-date="month" onclick="setDateFilter('month')">This Month</button>
                    <button data-date="older" onclick="setDateFilter('older')">Older</button>
                </div>
                <div class="settings-toggle" onclick="toggleSettings()">
                    <span class="icon">⚙️</span>
                    <span>Settings</span>
                </div>
            </div>
            <div class="settings-panel" id="settingsPanel">
                <label><input type="checkbox" checked data-category="friends" onchange="renderAll()"> Friends</label>
                <label><input type="checkbox" checked data-category="feed" onchange="renderAll()"> Feed</label>
                <label><input type="checkbox" checked data-category="chats" onchange="renderAll()"> Chats</label>
                <label><input type="checkbox" checked data-category="rooms" onchange="renderAll()"> Rooms</label>
                <label><input type="checkbox" checked data-category="communities" onchange="renderAll()"> Communities</label>
                <label><input type="checkbox" checked data-category="verification" onchange="renderAll()"> Verification</label>
                <label><input type="checkbox" checked data-category="announcements" onchange="renderAll()"> Announcements</label>
                <label><input type="checkbox" id="groupSimilarCheckbox" checked onchange="updateGroupSetting()"> Group similar</label>
            </div>
        </div>

        <!-- Clear All Panel -->
        <div class="clear-all-panel" id="clearAllPanel">
            <div class="clear-info">
                <span>📬</span>
                <span>You have <span class="count" id="notificationCount">0</span> notifications</span>
            </div>
            <button class="clear-btn" id="clearAllBtn" onclick="clearAll()">
                🗑️ Clear All
            </button>
        </div>

        <!-- Notification List -->
        <div class="notif-list" id="notifList">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- ===== TOAST & CONFIRM ===== -->
    <div class="toast-container" id="globalToast">
        <div class="toast-content">
            <div class="toast-icon-wrapper"><span class="icon" id="toastIcon">✓</span></div>
            <div class="toast-text-group">
                <div class="toast-title" id="toastTitle">Notification</div>
                <div class="toast-message" id="toastMessage">Action completed.</div>
            </div>
            <button class="toast-close-btn" onclick="dismissToast()">✕</button>
            <div class="toast-progress"></div>
        </div>
    </div>

    <div class="confirm-modal-overlay" id="confirmModalOverlay">
        <div class="confirm-modal" id="confirmModal">
            <div class="confirm-modal-icon"><span id="confirmModalIcon">⚠️</span></div>
            <div class="confirm-modal-title" id="confirmModalTitle">Are you sure?</div>
            <div class="confirm-modal-message" id="confirmModalMessage">This action cannot be undone.</div>
            <div id="confirmModalDetails" class="confirm-modal-details" style="display:none;"></div>
            <div class="confirm-modal-actions">
                <button class="btn-confirm secondary" id="confirmModalCancel" onclick="handleCancel()">Cancel</button>
                <button class="btn-confirm danger" id="confirmModalConfirm" onclick="handleConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ===== FIREBASE CDN ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE INIT
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentUserUid = null;
        let allNotifications = [];
        let dateFilter = 'all';
        let groupSimilar = true;
        let categoryFilters = {
            feed: true, friends: true, chats: true, rooms: true, communities: true, verification: true, announcements: true
        };
        let toastTimeout = null;
        let renderTimeout = null;
        let unsubscribers = [];

        const READ_STORAGE_KEY = 'spike_notification_reads_v1';
        let readIds = new Set();

        let soundEnabled = true;
        let audioCtx = null;

        // ============================================================
        // HELPERS
        // ============================================================
        function generateNotificationId(prefix, ...parts) {
            return prefix + '_' + parts.filter(Boolean).join('_');
        }

        function toDate(timestamp) {
            if (!timestamp) return new Date(0);
            if (timestamp.toDate) return timestamp.toDate();
            return new Date(timestamp);
        }

        function formatTimeAgo(date) {
            const d = toDate(date);
            if (isNaN(d.getTime())) return '';
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 5) return 'Just now';
            if (diff < 60) return `${diff}s ago`;
            const mins = Math.floor(diff / 60);
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function getTimeBucket(date) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const d = toDate(date);
            const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diffDays = Math.floor((today - dDay) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'today';
            if (diffDays <= 7) return 'week';
            if (diffDays <= 30) return 'month';
            return 'older';
        }

        function getBucketLabel(bucket) {
            return { today: 'Today', week: 'This Week', month: 'This Month', older: 'Older' } [bucket] || '';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' } [tag] || tag)
            );
        }

        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        // ============================================================
        // READ STATE
        // ============================================================
        function loadReadState() {
            try {
                const raw = localStorage.getItem(READ_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        readIds = new Set(parsed);
                        return;
                    }
                }
            } catch (e) {}
            readIds = new Set();
        }

        function saveReadState() {
            try {
                localStorage.setItem(READ_STORAGE_KEY, JSON.stringify([...readIds]));
            } catch (e) {}
        }

        function isRead(id) {
            return readIds.has(id);
        }

        async function markRead(id) {
            const item = allNotifications.find(n => n.id === id);
            if (!item || item.read || !currentUserUid) return;
            item.read = true;
            try {
                await db.collection('users').doc(currentUserUid).collection('notifications').doc(id).update({ read: true, readAt: firebase.firestore.FieldValue.serverTimestamp() });
            } catch (e) { console.warn('Failed to persist read state:', e); item.read = false; }
            renderAll(); updateBadge();
        }

        async function markAllRead() {
            if (!currentUserUid) return;
            const unread = allNotifications.filter(n => !n.read);
            if (!unread.length) { showToast('Everything is already read.', 'success', 'Done'); return; }
            try {
                for (let i = 0; i < unread.length; i += 400) {
                    const batch = db.batch();
                    unread.slice(i, i + 400).forEach(n => batch.update(db.collection('users').doc(currentUserUid).collection('notifications').doc(n.id), { read: true, readAt: firebase.firestore.FieldValue.serverTimestamp() }));
                    await batch.commit();
                }
                showToast('All marked as read', 'success', 'Done');
            } catch (e) { console.error(e); showToast('Some notifications could not be marked read.', 'error', 'Failed'); }
        }

        // ============================================================
        // TOAST & CONFIRM (global)
        // ============================================================
        function showToast(message, type = 'success', title = '') {
            const toast = document.getElementById('globalToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.className = 'toast-container';
            const titles = { success: '✓ Success', error: '✕ Error', warning: '⚠️ Warning' };
            const icons = { success: '✓', error: '✕', warning: '⚠️' };
            toastTitle.textContent = title || titles[type] || 'Notification';
            toastMessage.textContent = message;
            toastIcon.textContent = icons[type] || '✓';
            void toast.offsetWidth;
            toast.classList.add(type, 'active');
            toastTimeout = setTimeout(() => { dismissToast(); }, 3500);
        }

        function dismissToast() {
            const toast = document.getElementById('globalToast');
            if (!toast.classList.contains('active')) return;
            toast.classList.add('removing');
            setTimeout(() => {
                toast.className = 'toast-container';
                toast.classList.remove('removing');
                if (toastTimeout) { clearTimeout(toastTimeout);
                    toastTimeout = null; }
            }, 400);
        }

        function showConfirm(options) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('confirmModalOverlay');
                const modal = document.getElementById('confirmModal');
                const icon = document.getElementById('confirmModalIcon');
                const title = document.getElementById('confirmModalTitle');
                const message = document.getElementById('confirmModalMessage');
                const details = document.getElementById('confirmModalDetails');
                const confirmBtn = document.getElementById('confirmModalConfirm');
                const cancelBtn = document.getElementById('confirmModalCancel');

                modal.className = 'confirm-modal ' + (options.type || 'warning');
                icon.textContent = options.icon || '⚠️';
                title.textContent = options.title || 'Are you sure?';
                message.textContent = options.message || 'This action cannot be undone.';
                if (options.details) {
                    details.innerHTML = options.details;
                    details.style.display = 'block';
                } else {
                    details.style.display = 'none';
                }
                confirmBtn.textContent = options.confirmText || 'Confirm';
                confirmBtn.className = 'btn-confirm ' + (options.confirmType || 'danger');
                cancelBtn.textContent = options.cancelText || 'Cancel';
                overlay.classList.add('active');
                window._confirmResolve = resolve;
            });
        }

        function closeConfirm() {
            document.getElementById('confirmModalOverlay').classList.remove('active');
        }

        function handleConfirm() {
            if (window._confirmResolve) {
                window._confirmResolve(true);
                window._confirmResolve = null;
            }
            closeConfirm();
        }

        function handleCancel() {
            if (window._confirmResolve) {
                window._confirmResolve(false);
                window._confirmResolve = null;
            }
            closeConfirm();
        }

        document.getElementById('confirmModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) handleCancel();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') handleCancel();
        });

        // ============================================================
        // SOUND
        // ============================================================
        function playChime() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.value = 0.15;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';
            try {
                localStorage.setItem('spike_notify_sound', soundEnabled ? 'on' : 'off');
            } catch (e) {}
            showToast(soundEnabled ? 'Sound on' : 'Sound off', 'info');
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function loadSettings() {
            try {
                const sound = localStorage.getItem('spike_notify_sound');
                if (sound === 'off') soundEnabled = false;
                else soundEnabled = true;
                document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';

                const group = localStorage.getItem('spike_notify_group');
                if (group === 'false') groupSimilar = false;
                else groupSimilar = true;
                document.getElementById('groupSimilarCheckbox').checked = groupSimilar;

                document.querySelectorAll('#settingsPanel input[data-category]').forEach(cb => {
                    const key = cb.dataset.category;
                    const val = localStorage.getItem('spike_notify_cat_' + key);
                    if (val === 'false') cb.checked = false;
                    else cb.checked = true;
                    categoryFilters[key] = cb.checked;
                });
            } catch (e) {}
        }

        function saveSettings() {
            try {
                localStorage.setItem('spike_notify_sound', soundEnabled ? 'on' : 'off');
                localStorage.setItem('spike_notify_group', groupSimilar ? 'true' : 'false');
                document.querySelectorAll('#settingsPanel input[data-category]').forEach(cb => {
                    localStorage.setItem('spike_notify_cat_' + cb.dataset.category, cb.checked ? 'true' :
                        'false');
                    categoryFilters[cb.dataset.category] = cb.checked;
                });
            } catch (e) {}
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function updateGroupSetting() {
            groupSimilar = document.getElementById('groupSimilarCheckbox').checked;
            saveSettings();
            renderAll();
        }

        // ============================================================
        // FETCH USER DATA HELPER
        // ============================================================
        function fetchUserData(uid) {
            return db.collection('users').doc(uid).get().then(doc => doc.exists ? doc.data() : {});
        }

        // ============================================================
        // NOTIFICATION BUILDERS
        // ============================================================
        function createNotificationItem({
            id,
            category,
            type,
            icon,
            text,
            actorName = '',
            actorAvatar = '',
            url = '',
            createdAt,
            read = false,
            _groupKey = null
        }) {
            return {
                id,
                category,
                type,
                icon,
                text,
                actorName,
                actorAvatar,
                url,
                createdAt: createdAt instanceof Date ? createdAt.toISOString() : (typeof createdAt === 'string' ?
                    createdAt : new Date().toISOString()),
                read: read || isRead(id),
                _groupKey: _groupKey || id,
                _count: 1
            };
        }

        // ============================================================
        // START LISTENERS (ENHANCED)
        // ============================================================
        function startListeners() {
            if (!currentUserUid) return;
            unsubscribers.forEach(u => { try { u(); } catch (e) {} });
            unsubscribers = [];
            allNotifications = [];

            const ref = db.collection('users').doc(currentUserUid).collection('notifications').orderBy('createdAt', 'desc').limit(200);
            const unsubscribe = ref.onSnapshot(snapshot => {
                allNotifications = snapshot.docs.map(docSnap => {
                    const d = docSnap.data() || {};
                    return createNotificationItem({
                        id: docSnap.id, category: d.category || 'announcements', type: d.type || 'system', icon: d.icon || '🔔',
                        text: d.text || 'You have a new notification', actorName: d.actorName || '', actorAvatar: d.actorAvatar || '',
                        url: d.url || '', createdAt: d.createdAt, read: d.read === true, _groupKey: d._groupKey || d.groupKey || docSnap.id
                    });
                });
                allNotifications.sort((a,b) => toDate(b.createdAt) - toDate(a.createdAt));
                renderAll();
                updateBadge();
            }, error => {
                console.error('Notification listener failed:', error);
                showToast('Unable to load live notifications.', 'error', 'Notifications');
            });
            unsubscribers.push(unsubscribe);
            renderAll();
            updateBadge();
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderAll() {
            if (renderTimeout) cancelAnimationFrame(renderTimeout);
            renderTimeout = requestAnimationFrame(() => {
                const search = document.getElementById('searchInput').value.trim().toLowerCase();
                const activeCats = categoryFilters;

                let filtered = allNotifications.filter(n => activeCats[n.category] !== false);

                if (search) {
                    filtered = filtered.filter(n =>
                        n.text.toLowerCase().includes(search) ||
                        (n.actorName || '').toLowerCase().includes(search)
                    );
                }

                if (dateFilter !== 'all') {
                    filtered = filtered.filter(n => {
                        const bucket = getTimeBucket(n.createdAt);
                        return bucket === dateFilter;
                    });
                }

                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                document.getElementById('notificationCount').textContent = filtered.length;
                document.getElementById('clearAllBtn').disabled = filtered.length === 0;

                let displayItems = filtered;
                if (groupSimilar) {
                    const groups = {};
                    for (const n of filtered) {
                        const key = `${n.category}|${n.type}|${n.actorName || ''}`;
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(n);
                    }
                    displayItems = [];
                    for (const key of Object.keys(groups)) {
                        const items = groups[key];
                        if (items.length === 1) {
                            displayItems.push(items[0]);
                        } else {
                            const latest = items.reduce((a, b) => new Date(a.createdAt) > new Date(b.createdAt) ? a :
                                b);
                            const count = items.length;
                            displayItems.push({
                                ...latest,
                                _groupCount: count,
                                _groupItems: items
                            });
                        }
                    }
                    displayItems.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                }

                const buckets = { today: [], week: [], month: [], older: [] };
                for (const item of displayItems) {
                    const bucket = getTimeBucket(item.createdAt);
                    buckets[bucket].push(item);
                }

                let html = '';
                let hasAny = false;

                for (const [bucketKey, items] of Object.entries(buckets)) {
                    if (items.length === 0) continue;
                    hasAny = true;
                    html += `<div class="time-section"><div class="section-label">${getBucketLabel(bucketKey)}</div>`;
                    for (const item of items) {
                        html += buildNotificationItem(item);
                    }
                    html += `</div>`;
                }

                if (!hasAny) {
                    html = `
                        <div class="empty-state">
                            <span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span>
                            <span class="sparkle"></span><span class="sparkle"></span>
                            <span class="icon">🔔</span>
                            <div>No notifications yet</div>
                            <div class="tip">✨ Interact with posts, rooms, and communities to see activity here</div>
                        </div>
                    `;
                }

                document.getElementById('notifList').innerHTML = html;
            });
        }

        function buildNotificationItem(item) {
            const isUnread = !item.read;
            const avatarHTML = item.actorAvatar ?
                `<img src="${item.actorAvatar}" alt="${escapeHTML(item.actorName || 'User')}">` :
                escapeHTML((item.actorName || 'U').charAt(0).toUpperCase());

            const countBadge = item._groupCount && item._groupCount > 1 ?
                `<span class="notif-count-badge">×${item._groupCount}</span>` :
                '';

            const categoryMap = {
                feed: 'Feed',
                chats: 'Chats',
                rooms: 'Rooms',
                communities: 'Communities',
                verification: 'Verification',
                announcements: 'Announcements'
            };
            const badgeLabel = categoryMap[item.category] || item.category;

            return `
                <div class="notif-item ${isUnread ? 'unread' : ''}" data-id="${item.id}" onclick="handleItemClick('${item.id}')">
                    <div class="notif-avatar">${avatarHTML}</div>
                    <div class="notif-body">
                        <div class="notif-message">
                            <span class="action-icon">${item.icon || '🔔'}</span>
                            ${escapeHTML(item.text)}
                            ${countBadge}
                        </div>
                        <div class="notif-meta">
                            <span class="badge ${item.category}">${badgeLabel}</span>
                            <span class="notif-time">${formatTimeAgo(item.createdAt)}</span>
                            <span class="notif-read-dot"></span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // BADGE UPDATE
        // ============================================================
        function updateBadge() {
            const unread = allNotifications.filter(n => !n.read).length;
            const badge = document.getElementById('unreadBadge');
            if (unread > 0) {
                badge.textContent = unread > 99 ? '99+' : unread;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            try {
                localStorage.setItem('spike_global_unread', unread);
            } catch (e) {}
        }

        // ============================================================
        // CLEAR ALL (no redirect, stays on page)
        // ============================================================
        async function clearAll() {
            if (!currentUserUid || allNotifications.length === 0) { showToast('No notifications to clear', 'warning'); return; }
            const confirmed = await showConfirm({ type:'danger', icon:'🗑️', title:'Clear All Notifications?', message:'This will permanently remove all loaded notifications from your notification history.', details:`You have <strong>${allNotifications.length}</strong> loaded notifications.`, confirmText:'Clear All', confirmType:'danger', cancelText:'Cancel' });
            if (!confirmed) return;
            try {
                const snap = await db.collection('users').doc(currentUserUid).collection('notifications').limit(200).get();
                for (let i=0; i<snap.docs.length; i+=400) {
                    const batch=db.batch(); snap.docs.slice(i,i+400).forEach(d=>batch.delete(d.ref)); await batch.commit();
                }
                readIds.clear(); saveReadState(); showToast('Notifications cleared', 'success', 'Cleared');
            } catch(e) { console.error(e); showToast('Failed to clear notifications.', 'error', 'Clear Failed'); }
        }

        // ============================================================
        // HANDLERS
        // ============================================================
        function handleItemClick(id) {
            const item = allNotifications.find(n => n.id === id);
            if (!item) return;
            if (!item.read) {
                markRead(id);
                renderAll();
                updateBadge();
            }
            if (item.url) {
                window.location.href = item.url;
            }
        }

        function setDateFilter(filter) {
            dateFilter = filter;
            document.querySelectorAll('#dateFilters button').forEach(b => {
                b.classList.toggle('active', b.dataset.date === filter);
            });
            renderAll();
        }

        // ============================================================
        // EXPOSE GLOBALS
        // ============================================================
        window.setDateFilter = setDateFilter;
        window.toggleSettings = toggleSettings;
        window.updateGroupSetting = updateGroupSetting;
        window.toggleSound = toggleSound;
        window.clearAll = clearAll;
        window.markAllRead = markAllRead;
        window.renderAll = renderAll;
        window.handleItemClick = handleItemClick;
        window.dismissToast = dismissToast;
        window.handleConfirm = handleConfirm;
        window.handleCancel = handleCancel;

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            loadReadState();
            loadSettings();

            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                currentUser = user;
                currentUserUid = user.uid;

                const avatarBtn = document.getElementById('notifAvatar');
                try {
                    const userData = await fetchUserData(user.uid);
                    if (userData.avatar) {
                        avatarBtn.innerHTML = `<img src="${userData.avatar}" alt="Profile">`;
                    } else {
                        avatarBtn.textContent = getInitials(userData.name || user.displayName || 'User');
                    }
                } catch (e) {}

                startListeners();

                dateFilter = 'all';
                document.querySelector('#dateFilters button[data-date="all"]')?.classList.add('active');

                renderAll();
                updateBadge();

                console.log('🔔 Notifications page ready (enhanced detectors)');
            });
        }

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        }
    </script>
</body>
</html>

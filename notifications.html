`<span class="notif-body"><span class="notif-title">${esc(titleOf(n))}</span>`+
`<span class="notif-preview">${esc(notificationText(n))}</span>`+
`${preview&&preview!==notificationText(n)?`<span class="notif-preview">${esc(preview)}</span>`:""}`+
`<span class="notif-details">${actor?`<span class="notif-chip">From ${esc(actor)}</span>`:""}${target?`<span class="notif-chip">${esc(target)}</span>`:""}<span class="notif-time">${esc(formatTime(n.created_at))}</span></span>${n.smart_bucket?`<span class="notif-smart"><span class="notif-smart-chip ${esc(n.smart_bucket)}">${esc(n.smart_bucket)}</span>${n.smart_reason?`<span class="notif-smart-chip">${esc(n.smart_reason)}</span>`:""}${n.group_count>1?`<span class="notif-smart-chip notif-group-count">${esc(n.group_count)} related</span>`:""}</span>`:""}</span>`+
`${n.read?'':'<span class="new">NEW</span>'}<span class="notif-arrow">${href?'›':''}</span></button>`;
}).join("");
}
function withTimeout(p,ms,label="Request timed out"){
return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))]);
}
async function load(opts={}){
if(!me) throw new Error("Not authenticated");
if(opts.silent && isUserScrolling){pendingSilentRefresh=true;return rows;}
const r=await withTimeout(sb.rpc("get_smart_notification_page",{p_limit:100,p_before_created_at:null,p_before_id:null}),12000,"Notifications request timed out.");
if(r.error)throw r.error;
const seen=new Set();
rows=(r.data||[]).map(n=>({...n,smart_score:Number(n.smart_score||0),smart_rank:Number(n.smart_rank||0),group_count:Number(n.group_count||1)})).filter(n=>{
  const d=dataOf(n);
  const key=String(n.id||d.event_id||d.notification_id||d.delivery_id||"").trim();
  if(!key||seen.has(key))return false;
  seen.add(key);
  return true;
});
await hydrateNotificationActors(rows);
render();return rows;
}
async function markRead(id){
if(!me||!id)return;
const r=await withTimeout(sb.rpc("mark_notification_read",{p_notification_id:id}),10000,"Could not mark notification as read.");
if(r.error)throw r.error;
const n=rows.find(x=>String(x.id)===String(id));if(n)n.read=true;render();
}
async function markAll(){
if(!me)return;
const btn=$("#markAll");btn.disabled=true;
try{
const r=await withTimeout(sb.rpc("mark_all_notifications_read"),10000,"Could not mark notifications as read.");
if(r.error)throw r.error;
rows.forEach(n=>n.read=true);render();
if(window.spikePremiumToast)window.spikePremiumToast("All notifications marked as read.","success",2600);
}finally{btn.disabled=!rows.some(n=>!n.read)}
}
async function confirmClearAll(){
  if(!window.SPIKEPremiumDialog?.confirm)return window.confirm("Clear all notifications? This cannot be undone.");
  return window.SPIKEPremiumDialog.confirm({
    title:"Clear all notifications?",
    message:"All notifications will be permanently removed. This cannot be undone.",
    confirmText:"Clear all",
    cancelText:"Keep notifications",
    danger:true,
    kicker:"SPIKE ACTIVITY"
  });
}
async function clearAllNotifications(){
  if(!me||!rows.length)return;
  const btn=$("#clearAll");
  if(btn.dataset.busy==="1")return;
  if(!await confirmClearAll())return;
  btn.dataset.busy="1";btn.disabled=true;
  try{
    const r=await withTimeout(sb.rpc("clear_notifications"),12000,"Could not clear notifications.");
    if(r.error)throw r.error;
    rows=[];render();
    window.spikePremiumToast?.("All notifications cleared.","success",2600);
  }catch(err){
    console.error("SPIKE clear notifications error:",err);
    window.spikePremiumToast?.(err?.message||"Could not clear notifications.","error",4200);
  }finally{
    btn.dataset.busy="0";btn.disabled=!rows.length;
  }
}
async function deleteReadNotifications(){
 if(!me)return;
 const btn=$("#deleteRead"); if(!btn||btn.disabled)return;
 const readCount=rows.filter(n=>n.read).length; if(!readCount){window.spikePremiumToast?.("There are no read notifications to delete.","info",2200);return;}
 if(!await window.SPIKEPremiumDialog.confirm({title:"Delete read notifications?",message:"All read notifications will be permanently removed. This cannot be undone.",confirmText:"Delete read",cancelText:"Keep notifications",danger:true,kicker:"SPIKE ACTIVITY"}))return;
 btn.disabled=true; btn.setAttribute("aria-busy","true");
 try{
  const r=await withTimeout(sb.rpc("delete_read_notifications"),12000,"Could not delete read notifications.");
  if(r.error)throw r.error;
  rows=rows.filter(n=>!n.read); render();
  window.spikePremiumToast?.("Read notifications deleted.","success",2200);
 }catch(e){console.error(e);window.spikePremiumToast?.(e?.message||"Could not delete read notifications.","error",4200)}
 finally{btn.disabled=!rows.some(n=>n.read);btn.removeAttribute("aria-busy");}
}

function upsertRow(n){
 if(!n||String(n.user_id)!==String(me.id))return;
 const id=String(n.id||"").trim();
 if(!id)return;
 const i=rows.findIndex(x=>String(x.id)===id);
 if(i>=0)rows[i]={...rows[i],...n};
 else rows.unshift(n);
 rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 rows=rows.slice(0,5000);
 render();
}
function removeRow(n){rows=rows.filter(x=>String(x.id)!==String(n.id));render()}
let bc=null,pollTimer=null,lastRealtimeAt=0;
function notificationToneEnabled(){
  try{return localStorage.getItem("spike-setting-messageTone")!=="0";}catch(e){return true;}
}
async function loadAppPrefs(){
  if(!me)return;
  try{
    const r=await sb.from("user_app_settings").select("message_tone,browser_notifications").eq("user_id",me.id).maybeSingle();
    if(!r.error&&r.data){appPrefs={...appPrefs,...r.data};try{localStorage.setItem("spike-setting-messageTone",r.data.message_tone===false?"0":"1");localStorage.setItem("spike-setting-browser_notifications",r.data.browser_notifications?"true":"false")}catch(e){}}
  }catch(e){console.warn("notification preferences unavailable",e)}
}
function playNotificationTone(){
  if(appPrefs.message_tone===false||!notificationToneEnabled())return;
  const a=$("notificationTone"); if(!a)return;
  try{a.currentTime=0;const p=a.play();if(p?.catch)p.catch(()=>{});}catch(e){}
}
function showBrowserNotification(n){
  if(appPrefs.browser_notifications!==true)return;
  if(typeof Notification!=="function"||Notification.permission!=="granted")return;
  if(!document.hidden)return;
  try{new Notification("SPIKE",{body:notificationText(n),icon:"assets/icon/icon.png",tag:"spike-notification-"+n.id});}catch(e){}
}
function notifyLocal(n){
if(!n||String(n.user_id)!==String(me.id))return;
const existed=rows.some(x=>String(x.id)===String(n.id));
upsertRow(n);
lastRealtimeAt=Date.now();
const text=notificationText(n);
if(!existed && !n.read){playNotificationTone();showBrowserNotification(n);}
if(!n.read && window.spikePremiumToast) window.spikePremiumToast(text, /error|fail|denied/i.test(String(n.type||""))?"error":"info", 5200);
}
async function subscribe(){
if(channel)try{await sb.removeChannel(channel)}catch(e){}
try{const sr=await sb.auth.getSession();const token=sr.data?.session?.access_token;if(token)await sb.realtime.setAuth(token)}catch(e){console.warn("SPIKE realtime auth setup unavailable",e)}
const topic="user:"+me.id+":notifications";
channel=sb.channel(topic,{config:{private:true}})
.on("broadcast",{event:"notification_created"},()=>{lastRealtimeAt=Date.now();load({silent:true}).catch(e=>console.warn("notification realtime refresh failed",e))})
.on("broadcast",{event:"notification_updated"},()=>{lastRealtimeAt=Date.now();load({silent:true}).catch(e=>console.warn("notification realtime refresh failed",e))})
.on("broadcast",{event:"notification_deleted"},()=>{lastRealtimeAt=Date.now();load({silent:true}).catch(e=>console.warn("notification realtime refresh failed",e))})
.subscribe(status=>{if(status==="SUBSCRIBED"){lastRealtimeAt=Date.now();console.info("SPIKE notifications realtime connected")}if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){lastRealtimeAt=0;console.warn("Notifications realtime channel status:",status)}});
try{if(bc)bc.close();bc=new BroadcastChannel("spike-notifications");bc.onmessage=e=>{const n=e.data?.notification||e.data;if(n)notifyLocal(n)}}catch(e){}
clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.hidden||isUserScrolling)return;load({silent:true}).catch(()=>{})},60000);
}
let authReady=false;
let authRecoveryInProgress=false;
let authListenerBound=false;
const PROJECT_REF=new URL(SUPABASE_URL).hostname.split(".")[0];
function isInvalidRefreshTokenError(e){
const text=[e?.code,e?.name,e?.message].filter(Boolean).join(" ").toLowerCase();
return text.includes("refresh_token_not_found") || text.includes("invalid refresh token") || text.includes("refresh token not found");
}
function clearSupabaseAuthStorage(){
// Supabase stores the browser session under sb-<project-ref>-auth-token.
// Remove only this project's auth state; keep SPIKE theme/preferences intact.
try{
const exact="sb-"+PROJECT_REF+"-auth-token";
localStorage.removeItem(exact);
for(let i=localStorage.length-1;i>=0;i--){
const k=localStorage.key(i)||"";
if(k===exact || k.startsWith("sb-"+PROJECT_REF+"-")){
localStorage.removeItem(k);
}
}
}catch(err){
console.warn("SPIKE could not clear stale auth storage",err);
}
}
function showAuthRecovery(){
authReady=true;
authRecoveryInProgress=true;
clearSupabaseAuthStorage();
if(channel){try{sb.removeChannel(channel)}catch(e){} channel=null;}
$("#loader").classList.add("hide");
$("#notificationList").innerHTML=''+
'<div class="empty error">'+
'<strong>Your SPIKE session has expired.</strong><br>'+
'<span class="muted">The saved refresh token is no longer valid. Sign in again to continue.</span><br>'+
'<button class="btn primary" id="reauthBtn" type="button" style="margin-top:14px">Sign in again</button>'+
'</div>';
$("#reauthBtn").onclick=()=>{
const next=encodeURIComponent(location.pathname+location.search);
location.href="index.html?reauth=1&next="+next;
};
}
async function boot(){
try{
// Restore the persisted session first. Presence and realtime must wait until Auth is ready.
const sessionResult=await withTimeout(sb.auth.getSession(),15000,"Session check timed out. Please try again.");
if(sessionResult.error){
if(isInvalidRefreshTokenError(sessionResult.error)){showAuthRecovery();return;}
throw sessionResult.error;
}
const session=sessionResult.data?.session;
if(!session?.user){
 authReady=true;
 $("#loader").classList.add("hide");
 location.href="index.html?reauth=1";
 return;
}
me=session.user;
authReady=true;
try{if(session.access_token)await sb.realtime.setAuth(session.access_token)}catch(e){console.warn("SPIKE realtime auth initialization unavailable",e)}
if(!authListenerBound){
 authListenerBound=true;
 sb.auth.onAuthStateChange((event,nextSession)=>{
   if(event==="TOKEN_REFRESHED"&&nextSession?.access_token){
     authRecoveryInProgress=false;
     sb.realtime.setAuth(nextSession.access_token).then(()=>subscribe()).catch(e=>console.warn("SPIKE notification realtime reauth failed",e));
   }
   if(event==="SIGNED_OUT"&&authReady&&!authRecoveryInProgress){
     location.href="index.html?reauth=1";
   }
 });
}
window.AppPresence?.start(sb);
await loadAppPrefs();
await load();
await subscribe();
$("#loader").classList.add("hide");
}catch(e){
console.error("SPIKE notifications auth/load error:",e);
if(isInvalidRefreshTokenError(e)){showAuthRecovery();return;}
authReady=true;
$("#notificationList").innerHTML='<div class="empty error">Could not load notifications.<br><span class="muted">'+esc(e?.message||"Please try again.")+'</span><br><button class="btn" id="retryNotifications" type="button" style="margin-top:12px">Retry</button></div>';
$("#loader").classList.add("hide");
$("#retryNotifications")?.addEventListener("click",()=>{boot().catch(()=>{});});
}
}

$("#notificationSearch").addEventListener("input",e=>{notificationQuery=e.target.value||"";render()});
$("#markAll")?.addEventListener("click",()=>markAll().catch(e=>{console.error(e);window.spikePremiumToast?.(e?.message||"Could not mark notifications as read.","error",4200)}));
$("#deleteRead")?.addEventListener("click",()=>deleteReadNotifications());
$("#refreshBtn").onclick=async()=>{
 const b=$("#refreshBtn");if(b.disabled||!me)return;b.disabled=true;b.setAttribute("aria-busy","true");
 try{await load();window.spikePremiumToast?.("Notifications refreshed.","success",1800)}
 catch(e){console.error(e);window.spikePremiumToast?.(e?.message||"Could not refresh notifications.","error",4200)}
 finally{b.disabled=false;b.removeAttribute("aria-busy")}
};
function valueForDisplay(v){
 if(v===null||v===undefined)return "";
 if(typeof v==="string")return v;
 try{return JSON.stringify(v,null,2)}catch(e){return String(v)}
}
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function validUuid(v){return typeof v==="string"&&UUID_RE.test(v.trim())}
function notificationRequestId(n){
 const d=dataOf(n),id=String(d.request_id||d.friend_request_id||d.requestId||"").trim();
 return validUuid(id)?id:"";
}
async function getIncomingPendingRequest(n){
 const d=dataOf(n);
 const actorId=String(d.actor_id||d.from_user_id||d.sender_id||d.from_id||"").trim();
 const wanted=notificationRequestId(n);
 const r=await withTimeout(sb.rpc("get_friend_requests"),10000,"Could not verify friend request state.");
 if(r.error)throw r.error;
 return (Array.isArray(r.data)?r.data:[]).find(x=>{
   const rid=String(x?.request_id||x?.id||"");
   const uid=String(x?.user_id||x?.sender_id||"");
   return (wanted&&rid===wanted)||(!wanted&&actorId&&uid===actorId);
 })||null;
}

async function openNotificationDetails(n){
 if(!n)return;
 const d=dataOf(n),modal=$("#notificationModal");
 $("#notificationModalIcon").textContent=notificationIcon(n);
 $("#notificationModalTitle").textContent=titleOf(n);
 $("#notificationModalMeta").textContent=[formatTime(n.created_at),n.read?"Read":"Unread"].filter(Boolean).join(" • ");
 const detail=detailOf(n)||notificationText(n);
 const actor=actorOf(n),target=targetOf(n),href=notificationHref(n);
 const fields=[['From',actor],['Created',n.created_at?new Date(n.created_at).toLocaleString():'']].filter(x=>x[1]);
 let html='';
 html+=`<div class="notif-modal-section"><div class="notif-modal-label">Full alert</div><div class="notif-modal-text">${esc(detail)}</div></div>`;
 if(fields.length)html+=`<div class="notif-modal-section"><div class="notif-modal-label">Details</div><div class="notif-modal-grid">${fields.map(([k,v])=>`<div class="notif-modal-field"><strong>${esc(k)}</strong><span>${esc(valueForDisplay(v))}</span></div>`).join('')}</div></div>`;
 
 const nt=String(n?.type||"").toLowerCase();
 let pendingRequest=null,friendRequestPending=false;
 if(nt==="friend_request"){
   try{pendingRequest=await getIncomingPendingRequest(n);friendRequestPending=!!pendingRequest;}
   catch(e){console.warn("SPIKE could not verify incoming friend request state",e);}
 }
 if(friendRequestPending)html+=`<div class="notif-modal-actions"><button class="notif-open-btn" id="notificationAccept" type="button">Accept</button><button class="notif-open-btn" id="notificationDecline" type="button" style="background:transparent;color:inherit">Decline</button>${href?`<button class="notif-open-btn" id="notificationOpenTarget" type="button" style="background:transparent;color:inherit">View profile</button>`:""}</div>`;
 else if(nt==="friend_request")html+=`<div class="notif-modal-actions"><button class="notif-open-btn" id="notificationOpenTarget" type="button">View profile</button></div>`;
 else if(href)html+=`<div class="notif-modal-actions"><button class="notif-open-btn" id="notificationOpenTarget" type="button">Open related activity</button></div>`;
 $("#notificationModalBody").innerHTML=html;
 modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
 $("#notificationOpenTarget")?.addEventListener('click',()=>{location.href=href});
 const requestIdForAction=String(pendingRequest?.request_id||pendingRequest?.id||notificationRequestId(n)||"").trim();
 const runFriendAction=async(fn,successText)=>{
   const acceptBtn=$("#notificationAccept"),declineBtn=$("#notificationDecline");
   [acceptBtn,declineBtn].forEach(b=>{if(b){b.disabled=true;b.setAttribute('aria-busy','true')}});
   try{
     if(!requestIdForAction) throw new Error("This friend request notification is missing its request ID.");
     const r=await withTimeout(sb.rpc(fn,{p_request_id:requestIdForAction}),12000,"Friend request action timed out.");
     if(r.error)throw r.error;
     // Null is an idempotent response: the request was already processed or removed.
     // Convert this notification locally so the action buttons disappear immediately.
     // The notification itself stays in the activity history.
     n.type=fn==='accept_friend_request'?'friend_accepted':'friend_request_declined';
     if(n.data&&typeof n.data==='object'){
       n.data={...n.data,status:fn==='accept_friend_request'?'accepted':'declined'};
       if(fn==='accept_friend_request')n.data.message='accepted your friend request';
     }
     closeNotificationDetails();
     render();
     window.spikePremiumToast?.(successText,'success',2600);
     await load({silent:true});
   }catch(e){
     console.error("SPIKE friend notification action error:",e);
     window.spikePremiumToast?.(e?.message||"Could not update friend request.",'error',4200);
   }finally{[acceptBtn,declineBtn].forEach(b=>{if(b){b.disabled=false;b.removeAttribute('aria-busy')}})}
 };
 $("#notificationAccept")?.addEventListener('click',()=>runFriendAction('accept_friend_request','Friend request accepted.'));
 $("#notificationDecline")?.addEventListener('click',()=>runFriendAction('decline_friend_request','Friend request declined.'));
 $("#notificationModalClose").focus();
}
function closeNotificationDetails(){const modal=$("#notificationModal");modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
$("#notificationModalClose").onclick=closeNotificationDetails;
$("#notificationModal").addEventListener('click',e=>{if(e.target.id==='notificationModal')closeNotificationDetails()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$("#notificationModal")?.classList.contains('open'))closeNotificationDetails()});
$("#notificationList").addEventListener("click",async e=>{
 const b=e.target.closest("[data-id]");if(!b)return;
 const n=rows.find(x=>String(x.id)===String(b.dataset.id));
 if(b.dataset.busy==="1")return;
 b.dataset.busy="1";b.disabled=true;
 try{
   if(n&&!n.read) await markRead(b.dataset.id);
   openNotificationDetails(n);
   b.disabled=false;b.dataset.busy="0";
 }catch(err){
   console.error("SPIKE notification action error:",err);
   window.spikePremiumToast?.(err?.message||"Could not update notification.","error",4200);
   b.disabled=false;b.dataset.busy="0";
 }
});
function setFilter(f){notificationFilter=f;document.querySelectorAll(".notif-tab").forEach(b=>b.classList.remove("active"));const map={all:"#tabAll",unread:"#tabUnread",announcements:"#tabAnnouncements",mentions:"#tabMentions",system:"#tabSystem"};$(map[f])?.classList.add("active");document.querySelectorAll(".notif-tab").forEach(b=>b.setAttribute("aria-selected",b.classList.contains("active")?"true":"false"));render();}
["All","Unread","Announcements","Mentions","System"].forEach(x=>{const id="#tab"+x;$(id)?.addEventListener("click",()=>setFilter(x.toLowerCase()));});
$("#clearAll").onclick=clearAllNotifications;

$("#feedNav").onclick=()=>location.href="feed.html";$("#friendsNav").onclick=()=>location.href="friends.html";$("#chatNav").onclick=()=>location.href="messages.html";$("#profileNav").onclick=()=>location.href="profile.html";
window.addEventListener("beforeunload",()=>{if(channel)sb.removeChannel(channel);if(bc)bc.close();clearInterval(pollTimer)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)load({silent:true}).catch(()=>{})});
// Absolute UI failsafe: a broken script/network condition must never leave the full-screen loader visible forever.
setTimeout(()=>{
 const loader=$("#loader");
 if(loader&&!loader.classList.contains("hide")){
   loader.classList.add("hide");
   if(!me) $("#notificationList").innerHTML='<div class="empty error">SPIKE could not finish loading notifications.<br><button class="btn" id="retryNotificationsTimeout" type="button" style="margin-top:12px">Retry</button></div>';
   $("#retryNotificationsTimeout")?.addEventListener("click",()=>location.reload());
 }
},20000);
boot();
</script>

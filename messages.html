<!doctype html>
<html lang="en" translate="no"><head>
<meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14"><meta name="description" content="SPIKE direct messages">
<title>SPIKE — Messages</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://veagqanfilmbchlvlpcc.supabase.co" crossorigin>
<script src="js/supabase.min.js"></script>
<script src="js/spike-platform-bootstrap.js?v=rt-20261124"></script>
<script src="js/spike-call-engine.js?v=compact-end-toast-20261124" defer></script>
<script src="js/spike-theme-bootstrap.js"></script>
<link rel="stylesheet" href="css/perf.css">
<link rel="stylesheet" href="css/spike-identity.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/spike-mobile-safe-area.css">
<link rel="stylesheet" href="css/spike-messages.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<script src="js/spike-identity.js"></script>
<script src="js/spike-navigation.js"></script>
  <link rel="stylesheet" href="css/spike-modern-finish.css">
</head>
<body data-spike-page="messages">
<script src="js/spike-dialog.js"></script>
<div class="msg-app">
<header class="msg-topbar">
  <a class="msg-back" href="feed.html" aria-label="Back to Feed"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
  <div class="msg-title">
    <span class="eyebrow">Direct</span>
    <h1>Messages <span id="newMessagesBadge" class="msg-count" hidden aria-live="polite">0 new</span></h1>
  </div>
  <button class="msg-icon" id="openContactPicker" type="button" aria-label="New message" title="New message"><i class="fa-solid fa-user-plus" aria-hidden="true"></i></button>
</header>
<main class="msg-main">
  <div id="notice" class="msg-notice" role="status" hidden></div>
  <aside id="incomingToast" class="msg-toast" aria-live="polite" hidden>
    <button id="incomingToastOpen" type="button"><strong id="incomingToastTitle">New message</strong><span id="incomingToastPreview"></span></button>
  </aside>
  <label class="msg-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations"></label>
  <div class="msg-filters" role="group" aria-label="Filter conversations">
    <button class="msg-chip active" data-filter="all" type="button">Inbox <span id="unreadTotalBadge" class="msg-count" hidden>0</span></button>
    <button class="msg-chip" data-filter="unread" type="button">Unread <span id="unreadFilterBadge" class="msg-count" hidden>0</span></button>
    <button class="msg-chip" data-filter="online" type="button">Online</button>
  </div>
  <div id="list" class="msg-list" aria-live="polite"><div class="msg-skeleton"></div><div class="msg-skeleton"></div></div>
</main>

<section class="msg-picker" id="contactPicker" role="dialog" aria-modal="true" aria-labelledby="contactPickerTitle" hidden>
  <div class="msg-picker-card">
    <header class="msg-picker-head">
      <div>
        <span class="eyebrow">New conversation</span>
        <h2 id="contactPickerTitle">Choose someone</h2>
        <p>Message people connected to you on SPIKE.</p>
      </div>
      <button class="msg-icon" id="closeContactPicker" type="button" aria-label="Close contact picker">×</button>
    </header>
    <div class="msg-tabs" role="tablist" aria-label="Contact source">
      <button type="button" class="msg-chip active" data-contact-tab="all" role="tab" aria-selected="true">All</button>
      <button type="button" class="msg-chip" data-contact-tab="following" role="tab" aria-selected="false">Following</button>
      <button type="button" class="msg-chip" data-contact-tab="followers" role="tab" aria-selected="false">Followers</button>
    </div>
    <label class="msg-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="contactSearch" type="search" placeholder="Search name or username" autocomplete="off" aria-label="Search contacts"></label>
    <div id="contactList" class="msg-contacts" aria-live="polite"></div>
    <div class="msg-picker-footer" id="contactSelectionFooter" hidden>
      <label class="msg-group-name"><span>Group name (optional)</span><input id="contactGroupTitle" type="text" maxlength="100" placeholder="SPIKE Group"></label>
      <div class="msg-footer-row"><span><strong id="contactSelectionCount">0</strong> selected</span><button class="msg-primary" id="startSelectedConversation" type="button">Start conversation</button></div>
    </div>
  </div>
</section>
</div>

<nav class="msg-bottom-nav" aria-label="Main navigation">
  <a href="feed.html" data-spike-nav="home"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Feed</span></a>
  <a href="rooms.html" data-spike-nav="rooms"><i class="fa-solid fa-headphones" aria-hidden="true"></i><span>Rooms</span></a>
  <a href="friends.html" data-spike-nav="friends"><i class="fa-solid fa-user-group" aria-hidden="true"></i><span>Friends</span></a>
  <a class="active" href="messages.html" data-spike-nav="messages" aria-current="page"><i class="fa-solid fa-comments" aria-hidden="true"></i><span>Messages</span></a>
  <a href="profile.html" data-spike-nav="profile"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Profile</span></a>
</nav>

<script src="js/spike-messages.js?v=messages-v1-fix-20261124" defer></script>
<script type="module" src="js/spike-supabase-guard.js"></script>
</body></html>

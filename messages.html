<style>
:root{color-scheme:dark;--bg:#080811;--panel:#12121f;--panel2:#1a1729;--line:#30283f;--text:#f7f4ff;--muted:#a8a0bb;--a:#a855f7;--b:#ec4899}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom));}button,input,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;background:rgba(8,8,17,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.back,.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);cursor:pointer}.titlewrap{flex:1;min-width:0}.brand{font-weight:950;letter-spacing:-.04em;font-size:19px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.content{padding:16px;flex:1}.hero{padding:18px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(120% 120% at 0 0,rgba(168,85,247,.18),transparent 60%),var(--panel);margin-bottom:14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#d8a7ff;font-weight:900}.hero h1{font-size:28px;letter-spacing:-.05em;margin:7px 0}.hero p{color:var(--muted);margin:0;line-height:1.5;font-size:14px}.search{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin:14px 0}.search input{background:transparent;border:0;outline:0;color:var(--text);padding:14px 0;width:100%;min-width:0}.filters{display:flex;gap:8px;margin:14px 0;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--muted);cursor:pointer}.chip.active{background:rgba(168,85,247,.18);border-color:#8750b7;color:#fff}.list{display:grid;gap:9px}.itemRow{display:flex;align-items:stretch;gap:8px}.item{display:flex;align-items:center;gap:12px;flex:1;padding:13px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.025),transparent),var(--panel);min-width:0}.unarchive{align-self:center;flex:0 0 auto;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--panel2);color:var(--text);font-size:12px;cursor:pointer}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9333ea,#ec4899);font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.details{flex:1;min-width:0}.name{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.presence-time-label{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:3px;white-space:normal}.presence-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;vertical-align:middle;margin-left:6px}.presence-dot.online{background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.14)}.preview{font-size:13px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--muted);white-space:nowrap}.empty,.notice{padding:24px 16px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);line-height:1.55}.notice{margin-bottom:12px}.primary{border:0;border-radius:14px;background:linear-gradient(110deg,#9333ea,#db2777);color:white;font-weight:850;padding:12px 15px;cursor:pointer}.primary:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center}.thread{display:flex;flex-direction:column;gap:10px;padding:8px 0 18px}.bubble{max-width:84%;padding:11px 13px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.45}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(126,34,206,.9),rgba(190,24,93,.88));border-color:transparent}.bubble time{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:5px}.composer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(8,8,17,.9),var(--bg) 25%);padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.composebox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:18px;padding:7px;background:var(--panel)}.composebox textarea{resize:none;max-height:140px;min-height:42px;flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:10px 7px;line-height:1.4}.send{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#db2777);color:white;font-weight:900}.status{font-size:12px;color:var(--muted);padding:4px 2px}.skeleton{height:76px;border-radius:18px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/spike-theme-experience-v3.css?v=theme-v3"><link rel="stylesheet" href="css/spike-android-fullscreen-v1.css?v=1"><link rel="stylesheet" href="css/spike-mobile-safe-area.css"><link rel="stylesheet" href="css/spike-theme-final-authority-v1.css"></head><body><div class="app">
<header class="top"><a class="back" href="feed.html" aria-label="Back to Feed"><i class="fa-solid fa-arrow-left"></i></a><div class="titlewrap"><div class="brand">SPIKE <span style="color:#c084fc">Messages</span></div><div class="subtitle">Your conversations, in one place</div></div><a class="iconbtn" href="friends.html" aria-label="Find friends"><i class="fa-solid fa-user-plus"></i></a></header>
<main class="content"><section class="hero"><div class="eyebrow">Your inbox</div><h1>Stay in the conversation.</h1><p>Private conversations with people you choose. Fast, focused, and built for mobile.</p></section>
<div id="notice" class="notice" hidden></div><label class="search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations"></label>
<div class="filters" role="group" aria-label="Filter conversations"><button class="chip active" data-filter="all">Inbox</button><button class="chip" data-filter="unread">Unread</button><button class="chip" data-filter="archived">Archived</button></div>
<div id="list" class="list"><div class="skeleton"></div><div class="skeleton"></div></div>
<section class="hero" style="margin-top:16px"><div class="eyebrow">Start a conversation</div><p style="margin:6px 0 12px">Know someone's SPIKE username? Open Friends to find them and start a direct message.</p><a class="primary" href="friends.html"><i class="fa-solid fa-users"></i> Find people</a></section>
</main></div>
<script>
(()=>{'use strict';
const URL='https://cjqpyndceqyqsijihxbb.supabase.co',KEY='sb_publishable_Tqz0TbLLRLwu4XirPTVuiw_sSC9o4Jw';
const db=window.__SPIKE_SUPABASE__||window.supabaseClient||window.supabase?.createClient(URL,KEY);if(db){window.__SPIKE_SUPABASE__=db;window.supabaseClient=db}const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,rows=[],filter='all',channel=null;
const archiveKey=()=>`spike:archived-conversations:${me?.id||''}`;
function archivedIds(){try{const value=JSON.parse(localStorage.getItem(archiveKey())||'[]');return new Set(Array.isArray(value)?value.map(String):[])}catch(e){return new Set()}}
function setArchived(id,archived){const ids=archivedIds();if(archived)ids.add(String(id));else ids.delete(String(id));try{localStorage.setItem(archiveKey(),JSON.stringify([...ids]));render()}catch(e){notice('Could not update archived conversations on this device.')}}
function initials(s){return String(s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function when(s){if(!s)return '';const d=new Date(s);if(!Number.isFinite(d.getTime()))return '';return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function notice(s){$('notice').hidden=!s;$('notice').textContent=s||''}
function presenceLabel(id){const state=window.AppPresence?.getState?.(id);if(!state)return 'Checking presence…';if(state.online)return 'Online · '+(state.last_seen?new Date(state.last_seen).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'just now');return state.last_seen?'Last seen '+new Date(state.last_seen).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Offline'}
function render(){const q=$('search').value.trim().toLowerCase(),archived=archivedIds();const list=rows.filter(r=>{const isArchived=archived.has(String(r.other));return (filter==='archived'?isArchived:!isArchived)&&(filter!=='unread'||r.unread)&&(`${r.name} ${r.preview}`.toLowerCase().includes(q))});if(!list.length){const label=filter==='archived'?'No archived conversations':filter==='unread'?'No unread conversations':'No conversations yet';$('list').innerHTML='<div class="empty"><i class="fa-regular fa-comments" style="font-size:26px;display:block;margin-bottom:10px"></i><b>'+(q?'No matching conversations':label)+'</b><br>'+(q?'Try another name or message.':filter==='archived'?'Conversations you archive on this device will appear here.':'Start by finding a friend on SPIKE. Your conversations will appear here.')+'</div>';return}
$('list').innerHTML=list.map(r=>{const isArchived=archived.has(String(r.other));return `<div class="itemRow"><a class="item" href="message.html?to=${encodeURIComponent(r.other)}" aria-label="Open conversation with ${esc(r.name)}"><div class="avatar">${r.avatar?`<img src="${esc(r.avatar)}" alt="" loading="lazy">`:esc(initials(r.name))}</div><div class="details" data-presence-user="${esc(r.other)}"><div class="name">${esc(r.name)}<span class="presence-dot" aria-label="Presence status"></span></div><span class="presence-time-label" data-presence-text>${esc(presenceLabel(r.other))}</span><div class="preview">${esc(r.preview||'Start the conversation')}</div></div><div class="meta">${esc(when(r.at))}${r.unread?'<br><span style="color:#d8a7ff;font-weight:900">Unread</span>':''}</div></a>${isArchived?`<button class="unarchive" type="button" data-unarchive="${esc(r.other)}" aria-label="Unarchive conversation with ${esc(r.name)}">Unarchive</button>`:''}</div>`}).join('');$('list').querySelectorAll('[data-unarchive]').forEach(b=>b.addEventListener('click',()=>setArchived(b.dataset.unarchive,false)))}
async function getProfiles(ids){
 if(!ids.length)return new Map();
 const normalize=data=>new Map((data||[]).map(p=>[String(p.id||p.user_id||p.profile_id||'').toLowerCase(),p]).filter(([id])=>id));
 try{const {data,error}=await db.rpc('get_public_profiles',{p_user_ids:ids});if(!error){const map=normalize(data);if(map.size)return map}else console.warn('[SPIKE messages] public profile RPC lookup:',error.message)}catch(e){console.warn('[SPIKE messages] public profile RPC lookup:',e.message)}
 // Use the same public profile source as Friends rather than querying private profile rows.
 try{const {data,error}=await db.rpc('get_registered_users_public',{p_query:'',p_limit:500,p_offset:0});if(error)throw error;const wanted=new Set(ids.map(id=>String(id).toLowerCase()));return normalize((data||[]).filter(p=>wanted.has(String(p.id||p.user_id||'').toLowerCase())))}catch(e){console.warn('[SPIKE messages] registered-profile fallback:',e.message);return new Map()}
}
function aggregate(messages,profiles){const map=new Map();for(const m of messages||[]){if(m.deleted_at)continue;const other=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!other||other===me.id)continue;let r=map.get(other);if(!r){const p=profiles.get(String(other).toLowerCase());r={other,name:p?.username?('@'+String(p.username).replace(/^@/,'')):(p?.display_name||p?.full_name||p?.name||'SPIKE member'),avatar:p?.avatar_url||p?.avatar||p?.photo_url||'',preview:m.sender_id===me.id?'You: '+(m.body||''):m.body||'Message',at:m.created_at,unread:false,latestId:m.id};map.set(other,r)}if(!r.latestId||new Date(m.created_at)>new Date(r.at)){r.preview=m.sender_id===me.id?'You: '+(m.body||''):m.body||'Message';r.at=m.created_at;r.latestId=m.id}if(m.recipient_id===me.id&&m.sender_id!==me.id&&!m.read)r.unread=true}return [...map.values()].sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))}
async function load(){if(!db){notice('Messaging client could not load. Check your connection and reload.');$('list').innerHTML='';return}
try{const sr=await db.auth.getSession();if(sr.error)throw sr.error;me=sr.data.session?.user;if(!me){notice('Sign in to use SPIKE Messages. Redirecting to sign in…');setTimeout(()=>location.href='index.html?next=messages.html',900);return}
const {data,error}=await db.from('private_messages').select('id,sender_id,recipient_id,body,message_type,read,created_at,deleted_at').or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(500);
if(error)throw error;const messages=(data||[]).filter(m=>!m.deleted_at);const ids=[...new Set(messages.map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id).filter(id=>id&&id!==me.id))];const profiles=await getProfiles(ids);rows=aggregate(messages,profiles);if(window.AppPresence){await window.AppPresence.start(db);window.AppPresence.watch(ids)}render();notice('');
if(channel)await db.removeChannel(channel);channel=db.channel('spike-inbox-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages',filter:'recipient_id=eq.'+me.id},async payload=>{if(payload.new?.recipient_id===me.id){try{const fresh=await db.from('private_messages').select('id,sender_id,recipient_id,body,message_type,read,created_at,deleted_at').or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(500);if(!fresh.error){const msgs=(fresh.data||[]).filter(m=>!m.deleted_at);const p=await getProfiles([...new Set(msgs.map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id).filter(id=>id&&id!==me.id))]);rows=aggregate(msgs,p);render()}}catch(e){console.warn('[SPIKE messages] realtime refresh failed',e)}}}).subscribe();
}catch(e){notice(e.message||'Could not load your inbox.');$('list').innerHTML='<div class="empty">Unable to load messages right now. Check your connection and try again.</div>';console.error('[SPIKE messages]',e)}}
$('search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));window.addEventListener('pagehide',()=>{if(channel&&db)db.removeChannel(channel)});load();
})();
</script>

 try{const {data,error}=await db.rpc('get_registered_users_public',{p_query:'',p_limit:500,p_offset:0});if(error)throw error;const wanted=new Set(ids.map(id=>String(id).toLowerCase()));return normalize((data||[]).filter(p=>wanted.has(String(p.id||p.user_id||'').toLowerCase())))}catch(e){console.warn('[SPIKE messages] registered-profile fallback:',e.message);return new Map()}

function aggregate(messages,profiles){const map=new Map();for(const m of messages||[]){if(m.deleted_at)continue;const other=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!other||other===me.id)continue;let r=map.get(other);if(!r){const p=profiles.get(String(other).toLowerCase());r={other,name:p?.username?('@'+String(p.username).replace(/^@/,'')):(p?.display_name||p?.full_name||p?.name||'SPIKE member'),avatar:p?.avatar_url||p?.avatar||p?.photo_url||'',preview:m.sender_id===me.id?'You: '+(m.body||''):m.body||'Message',at:m.created_at,unread:false,unreadCount:0,latestId:m.id};map.set(other,r)}if(!r.latestId||new Date(m.created_at)>new Date(r.at)){r.preview=m.sender_id===me.id?'You: '+(m.body||''):m.body||'Message';r.at=m.created_at;r.latestId=m.id}if(m.recipient_id===me.id&&m.sender_id!==me.id&&!m.read)r.unreadCount++}for(const r of map.values())r.unread=r.unreadCount>0;return [...map.values()].sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))}
async function loadAllInboxMessages(userId){
 const pageSize=500;const all=[];let from=0;
 while(true){
  const {data,error}=await db.from('private_messages').select('id,sender_id,recipient_id,body,message_type,read,created_at,deleted_at').or(`sender_id.eq.${userId},recipient_id.eq.${userId}`).order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+pageSize-1);
  if(error)throw error;
  const page=data||[];all.push(...page);
  if(page.length<pageSize)break;
  from+=pageSize;
 }
 return all;
}
async function load(){if(!db){notice('Messaging client could not load. Check your connection and reload.');$('list').innerHTML='';return}
try{const sr=await db.auth.getSession();if(sr.error)throw sr.error;me=sr.data.session?.user;if(!me){notice('Sign in to use SPIKE Messages. Redirecting to sign in…');setTimeout(()=>location.href='index.html?next=messages.html',900);return}
try{const prefResult=await db.from('spike_inbox_preferences').select('other_user_id,is_pinned,is_archived').eq('user_id',me.id);if(prefResult.error)throw prefResult.error;serverInboxPrefs=new Map((prefResult.data||[]).map(p=>[String(p.other_user_id),{is_pinned:!!p.is_pinned,is_archived:!!p.is_archived}]));inboxPrefsServerReady=true}catch(prefError){inboxPrefsServerReady=false;console.info('[SPIKE inbox] using local preference fallback until migration is applied:',prefError.message)}
const data=await loadAllInboxMessages(me.id);const messages=data.filter(m=>!m.deleted_at);const visitKey=inboxVisitKey(me.id);let lastVisit=0;try{lastVisit=Number(localStorage.getItem(visitKey)||0)||0}catch(e){}const now=Date.now();newMessageCount=lastVisit?messages.filter(m=>m.recipient_id===me.id&&m.sender_id!==me.id&&new Date(m.created_at).getTime()>lastVisit).length:0;try{localStorage.setItem(visitKey,String(now))}catch(e){}renderNewBadge();const ids=[...new Set(messages.map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id).filter(id=>id&&id!==me.id))];const profiles=await getProfiles(ids);rows=aggregate(messages,profiles);if(window.AppPresence){await window.AppPresence.start(db);window.AppPresence.watch(ids)}render();notice('');await setupInboxTyping(ids);
if(channel)await db.removeChannel(channel);channel=db.channel('spike-inbox-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages',filter:'recipient_id=eq.'+me.id},async payload=>{if(payload.new?.recipient_id===me.id){try{const incoming=payload.new;if(!incoming.deleted_at){newMessageCount++;renderNewBadge()}const msgs=(await loadAllInboxMessages(me.id)).filter(m=>!m.deleted_at);const p=await getProfiles([...new Set(msgs.map(m=>m.sender_id===me.id?m.recipient_id:m.sender_id).filter(id=>id&&id!==me.id))]);rows=aggregate(msgs,p);render();if(incoming&&!incoming.deleted_at){const sender=p.get(String(incoming.sender_id).toLowerCase());if(sender)showIncomingToast(incoming,sender)}}catch(e){console.warn('[SPIKE messages] realtime refresh failed',e)}}}).subscribe();
}catch(e){notice(e.message||'Could not load your inbox.');$('list').innerHTML='<div class="empty">Unable to load messages right now. Check your connection and try again.</div>';console.error('[SPIKE messages]',e)}}
$('search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));window.addEventListener('pagehide',()=>{if(channel&&db)db.removeChannel(channel);for(const c of typingChannels){if(db)db.removeChannel(c)}for(const v of typingPeers.values())clearTimeout(v.timer);typingPeers.clear()});load();
})();

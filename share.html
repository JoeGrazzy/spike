<style>
html,body{margin:0;min-height:100%;background:#070b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(520px,100%);text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:32px;background:rgba(255,255,255,.05);box-shadow:0 20px 60px rgba(0,0,0,.35)}img{width:96px;height:96px;object-fit:contain;border-radius:22px}.card h1{margin:20px 0 8px;font-size:30px}.card p{margin:0 0 22px;color:rgba(255,255,255,.72)}a{display:inline-block;padding:13px 20px;border-radius:14px;background:#fff;color:#090b10;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="card">
<img src="assets/icon/logo.png" alt="SPIKE" width="96" height="96" decoding="async">
<h1>SPIKE</h1>
<p>Opening the shared SPIKE content…</p>
<a id="open" href="feed.html">Open SPIKE</a>
</main>
<script>
(()=>{
  const params=new URLSearchParams(location.search);
  const raw=params.get('target')||'';
  let target='feed.html';
  try{
    const u=new URL(raw||'feed.html',location.origin);
    if(u.origin===location.origin && u.pathname!=='/share.html') target=u.pathname+u.search+u.hash;
  }catch(_){ }
  const a=document.getElementById('open');
  if(a)a.href=target;
  setTimeout(()=>{ try{ location.replace(target); }catch(_){} },80);
})();
</script>
</body>

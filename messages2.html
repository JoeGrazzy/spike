<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

{"imports":{"@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}

<style>
/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg1:#fdf2f8;--bg2:#fef3c7;--bg3:#ecfdf5;--card:rgba(255,255,255,.82);
 --text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--primary:linear-gradient(135deg,#f472b6,#fb923c);
 --bubble:#fff;--mine:linear-gradient(135deg,#f472b6,#fb923c);--shadow:0 20px 60px rgba(31,41,55,.12);
 --accent:#f472b6;
}
body.dark{--bg1:#111827;--bg2:#172033;--bg3:#0f2b2b;--card:rgba(17,24,39,.9);--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--bubble:#1f2937;--mine:linear-gradient(135deg,#8b5cf6,#ec4899);--shadow:0 20px 60px rgba(0,0,0,.35);--accent:#a78bfa}
body{font-family:Inter,sans-serif;min-height:100vh;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));padding:12px 12px 20px}
button,input{font:inherit}
button{cursor:pointer}
.container{max-width:1120px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border:1px solid var(--border);border-radius:22px;background:var(--card);backdrop-filter:blur(14px);box-shadow:var(--shadow);position:relative;z-index:10}
.brand{font-weight:800;letter-spacing:.4px}.brand-name{font-size:20px}.brand-sub{color:#ec4899;font-weight:600}
.header-actions{display:flex;align-items:center;gap:8px}
.user-badge{display:flex;align-items:center;gap:6px}
.avatar,.small-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:700;overflow:hidden;flex:none}
.small-avatar{width:32px;height:32px}.avatar img,.small-avatar img{width:100%;height:100%;object-fit:cover}
.user-name{font-weight:600;font-size:13px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:6px 10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.btn-primary{border:0;color:white;background:var(--primary)}.btn:disabled{opacity:.55;cursor:not-allowed}
.status{display:none;padding:10px 14px;border-radius:14px;margin-bottom:12px;border:1px solid var(--border);background:var(--card)}
.status.show{display:block}.status.error{border-color:#fca5a5;color:#b91c1c}.status.success{border-color:#86efac;color:#166534}

/* ===== OVERLAY MENU ===== */
.menu-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
.menu-overlay.open{display:block}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes slideIn{0%{transform:translateX(100%)}100%{transform:translateX(0)}}
.menu-panel{position:fixed;top:0;right:0;bottom:0;width:min(320px,80%);background:var(--card);backdrop-filter:blur(20px);border-left:1px solid var(--border);box-shadow:-8px 0 40px rgba(0,0,0,.12);padding:20px 0;overflow-y:auto;animation:slideIn .3s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
.menu-panel .menu-header{display:flex;justify-content:space-between;align-items:center;padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.menu-panel .menu-header .menu-title{font-size:20px;font-weight:800;color:var(--text)}
.menu-panel .menu-close{background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px}
.menu-panel .menu-items{flex:1;padding:0 8px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border:0;background:transparent;color:var(--text);width:100%;font-size:16px;font-weight:500;cursor:pointer;border-radius:14px;transition:.15s}
.menu-item:hover{background:rgba(244,114,182,.08)}
.menu-item .emoji{font-size:24px;width:40px;text-align:center}
.menu-item .label{flex:1}
.menu-item.active{color:var(--accent);background:rgba(244,114,182,.06)}
.menu-footer{padding:16px 20px 0;border-top:1px solid var(--border);margin-top:8px;font-size:12px;color:var(--muted);text-align:center}

/* ===== MAIN APP (messages) ===== */
.app{height:calc(100vh - 130px);min-height:500px;display:grid;grid-template-columns:330px 1fr;border:1px solid var(--border);border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.side-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.side-title{font-size:20px;font-weight:800;margin-bottom:8px}
.search{width:100%;border:1px solid var(--border);background:var(--bubble);color:var(--text);padding:10px 12px;border-radius:13px;outline:none}
.search:focus{border-color:var(--accent)}
.friend-picker{padding:10px 16px;border-bottom:1px solid var(--border)}
.friend-picker select{width:100%;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--bubble);color:var(--text)}
.conversations{overflow:auto;flex:1}
.conversation{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.conversation:hover,.conversation.active{background:rgba(244,114,182,.1)}
.conv-info{min-width:0;flex:1}.conv-top{display:flex;justify-content:space-between;gap:6px}.conv-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv-time{font-size:11px;color:var(--muted)}
.preview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-height:60px}
.chat-user{font-weight:800}.chat-status{font-size:12px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:var(--muted)}
.day{align-self:center;font-size:11px;color:var(--muted);padding:4px 10px;border:1px solid var(--border);border-radius:20px;margin:6px 0}
.msg-row{display:flex;max-width:78%}.msg-row.mine{align-self:flex-end;justify-content:flex-end}.msg-row.theirs{align-self:flex-start}
.bubble{padding:10px 13px;border-radius:17px;background:var(--bubble);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.04);white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);border:0;color:#fff;border-bottom-right-radius:5px}.theirs .bubble{border-bottom-left-radius:5px}
.meta{font-size:10px;opacity:.7;margin-top:4px;text-align:right}
.composer{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.message-input{flex:1;min-height:40px;max-height:120px;resize:none;border:1px solid var(--border);border-radius:15px;background:var(--bubble);color:var(--text);padding:10px 12px;outline:none}
.send{width:44px;height:40px;border:0;border-radius:12px;background:var(--primary);color:white;font-weight:800}
.typing{height:18px;padding:0 16px;color:var(--muted);font-size:12px}
.back{display:none}
@media(max-width:760px){
 body{padding:8px}.header{border-radius:18px}.user-name{display:none}
 .app{height:calc(100vh - 90px);min-height:0;grid-template-columns:1fr}
 .sidebar{display:none}.app.mobile-list .sidebar{display:flex}.app.mobile-list .chat{display:none}
 .app.mobile-chat .sidebar{display:none}.app.mobile-chat .chat{display:flex}
 .back{display:inline-flex!important}
}
@media(min-width:761px){.back{display:none!important}}

.presence-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:5px;vertical-align:middle}
.presence-dot.online{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.signal{font-size:11px;color:var(--muted);margin-left:7px}
.attachment-preview{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
.attachment-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bubble);border-radius:10px;padding:6px 8px;font-size:12px}
.attachment-chip button{border:0;background:transparent;color:var(--muted)}
.message-actions{display:none;gap:4px;margin-top:5px}
.msg-row:hover .message-actions{display:flex}
.reaction-btn,.reply-btn,.delete-btn,.edit-btn{border:1px solid var(--border);background:var(--bubble);color:var(--text);border-radius:9px;padding:3px 7px;font-size:11px}
.reactions{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.reaction-pill{font-size:12px;border:1px solid var(--border);background:var(--bubble);border-radius:12px;padding:2px 6px}
.reply-preview{border-left:3px solid var(--accent);background:rgba(244,114,182,.08);padding:5px 8px;border-radius:8px;margin-bottom:6px;font-size:11px}
.replying{display:none;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);background:rgba(244,114,182,.06);font-size:12px}
.replying.show{display:flex}
.notif-bell{position:relative}
.notif-count{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:50%;background:#ef4444;color:white;font-size:9px;display:grid;place-items:center}
.file-message{display:block;max-width:260px}
.file-message img,.file-message video{max-width:100%;max-height:260px;border-radius:12px}
.audio-message{width:230px}
.chat-tools{margin-left:auto;display:flex;gap:4px;align-items:center}
.chat-tool{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 8px;font-size:14px}
.pinned-panel{display:none;border-bottom:1px solid var(--border);padding:8px 12px;background:rgba(244,114,182,.06);max-height:120px;overflow:auto}
.pinned-panel.show{display:block}
.search-panel{display:none;border-bottom:1px solid var(--border);padding:8px 12px;background:var(--card)}
.search-panel.show{display:flex;gap:6px}
.search-panel input{flex:1}
.expiry-row{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:var(--muted)}
.expiry-row select{border:1px solid var(--border);background:var(--bubble);color:var(--text);border-radius:8px;padding:4px}

/* ===== SCREENS (hidden by default) ===== */
.screen{display:none;height:100%;overflow:auto;padding:12px 16px}
.screen.active{display:block}
.screen-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.screen-card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.screen-card .item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.screen-card .item:last-child{border:0}
.story-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:center}
.story-item .story-avatar{width:50px;height:50px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;border:2px solid var(--accent)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.media-grid img,.media-grid video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.location-map{width:100%;height:200px;border-radius:12px;border:1px solid var(--border);background:#e5e7eb}
.theme-option{display:inline-block;padding:6px 12px;border-radius:20px;border:1px solid var(--border);margin:4px;cursor:pointer;background:var(--bubble)}
.theme-option.active{border-color:var(--accent);background:var(--accent);color:#fff}
.switch{position:relative;display:inline-block;width:36px;height:20px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.3s;border-radius:20px}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(16px)}
@media(max-width:600px){.screen{padding:8px}.media-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}}
</style>
</head>
<body>
<div class="container">
<header class="header">
  <div class="brand"><span class="brand-name">SPIKE</span> <span class="brand-sub">· messages</span></div>
  <div class="header-actions">
    <div class="user-badge"><div id="headerAvatar" class="small-avatar">👤</div><span id="headerName" class="user-name">—</span></div>
    <button id="notificationBtn" class="btn notif-bell">🔔<span id="notifCount" class="notif-count" style="display:none">0</span></button>
    <button id="menuToggle" class="btn" aria-label="Menu">☰</button>
    <button id="logoutBtn" class="btn">Sign out</button>
  </div>
</header>

<!-- OVERLAY MENU -->
<div id="menuOverlay" class="menu-overlay">
  <div class="menu-panel">
    <div class="menu-header">
      <span class="menu-title">SPIKE</span>
      <button id="menuClose" class="menu-close">✕</button>
    </div>
    <div class="menu-items">
      <button class="menu-item active" data-screen="messages"><span class="emoji">💬</span><span class="label">Messages</span></button>
      <button class="menu-item" data-screen="groups"><span class="emoji">👥</span><span class="label">Groups</span></button>
      <button class="menu-item" data-screen="stories"><span class="emoji">📸</span><span class="label">Stories</span></button>
      <button class="menu-item" data-screen="media"><span class="emoji">📁</span><span class="label">Media &amp; Files</span></button>
      <button class="menu-item" data-screen="calls"><span class="emoji">📞</span><span class="label">Calls</span></button>
      <button class="menu-item" data-screen="location"><span class="emoji">📍</span><span class="label">Location</span></button>
      <button class="menu-item" data-screen="themes"><span class="emoji">🎨</span><span class="label">Themes</span></button>
      <button class="menu-item" data-screen="privacy"><span class="emoji">🛡️</span><span class="label">Privacy</span></button>
      <button class="menu-item" data-screen="settings"><span class="emoji">⚙️</span><span class="label">Settings</span></button>
    </div>
    <div class="menu-footer">SPIKE DIGITAL · v2.0</div>
  </div>
</div>

<div id="status" class="status"></div>

<main id="app" class="app mobile-list">
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title">Messages</div>
      <input id="conversationSearch" class="search" type="search" placeholder="Search conversations..." autocomplete="off">
    </div>
    <div class="friend-picker">
      <select id="friendSelect"><option value="">Message a friend…</option></select>
    </div>
    <div id="conversationList" class="conversations"><div class="empty">Loading messages…</div></div>
  </aside>
  <section class="chat">
    <div id="chatHead" class="chat-head">
      <button id="backBtn" class="btn back">←</button>
      <div id="chatAvatar" class="avatar">💬</div>
      <div>
        <div id="chatName" class="chat-user">Select a conversation</div>
        <div id="chatStatus" class="chat-status">Choose a friend to start messaging.</div>
      </div>
      <div class="chat-tools">
        <button id="searchMessagesBtn" class="chat-tool" disabled>🔎</button>
        <button id="pinnedBtn" class="chat-tool" disabled>📌</button>
        <button id="voiceCallBtn" class="chat-tool" disabled>📞</button>
        <button id="videoCallBtn" class="chat-tool" disabled>📹</button>
        <button id="chatSettingsBtn" class="chat-tool" disabled>⚙️</button>
      </div>
    </div>
    <div id="searchPanel" class="search-panel">
      <input id="messageSearchInput" class="search" type="search" placeholder="Search messages in this chat...">
      <button id="closeSearchBtn" class="btn">×</button>
    </div>
    <div id="pinnedPanel" class="pinned-panel"></div>
    <div id="messages" class="messages"><div class="empty"><div><strong>Your messages are private.</strong><br><br>Select an accepted friend to start a conversation.</div></div></div>
    <div id="typing" class="typing"></div>

      <button id="voiceBtn" class="btn" type="button" disabled>🎙️</button>
      <textarea id="messageInput" class="message-input" rows="1" maxlength="4000" placeholder="Type a message…" disabled></textarea>
      <div class="expiry-row"><span>⏳</span><select id="expirySelect" disabled><option value="">Keep</option><option value="30">30s</option><option value="60">1m</option><option value="3600">1h</option><option value="86400">24h</option><option value="604800">7d</option></select></div>
      <button id="sendBtn" class="send" type="submit" disabled>➤</button>
    </form>
    <div id="attachmentPreview" class="attachment-preview"></div>
  </section>
</main>

<!-- SCREENS (hidden by default) -->
<div class="screen active" id="screen-messages"><!-- messages view is the main app --></div>
<div class="screen" id="screen-groups"></div>
<div class="screen" id="screen-stories"></div>
<div class="screen" id="screen-media"></div>
<div class="screen" id="screen-calls"></div>
<div class="screen" id="screen-location"></div>
<div class="screen" id="screen-themes"></div>
<div class="screen" id="screen-privacy"></div>
<div class="screen" id="screen-settings"></div>

</div>

<script type="module">
import { createClient } from '@supabase/supabase-js';

const SUPABASE_URL='https://bkrrewagsbjqgmxaaqyt.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_24Z2PQpdG13cf6_9w8C7nA_zXEzr60O';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

// ============================================================
//  HELPERS
// ============================================================
const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const nameOf=p=>p?.display_name||p?.username||'User';
const avatarMarkup=(p,small=false)=>{
 const n=nameOf(p), initial=escapeHtml(n.charAt(0).toUpperCase()||'U');
 return p?.avatar_url?`<div class="${small?'small-avatar':'avatar'}"><img src="${escapeHtml(p.avatar_url)}" alt=""></div>`:`<div class="${small?'small-avatar':'avatar'}">${initial}</div>`;
};
function timeAgo(iso){if(!iso)return'';const d=new Date(iso),diff=Date.now()-d.getTime(),m=Math.floor(diff/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const days=Math.floor(h/24);if(days<7)return days+'d';return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function friendly(e){const m=e?.message||String(e);if(m.includes('only message accepted friends'))return'You can only message accepted friends.';if(m.includes('Not authenticated'))return'Please sign in again.';if(m.includes('profile is missing'))return'Your profile is missing. Open Friends once, then try again.';if(m.includes('row-level security')||e?.code==='42501')return'You do not have permission to do that.';return m;}
function showStatus(msg,type='info'){
 clearTimeout(window.statusTimer);
 if(!msg){$('status').className='status';$('status').textContent='';return}
 $('status').className='status show '+type;$('status').textContent=msg;
 window.statusTimer=setTimeout(()=>showStatus(null),type==='error'?9000:5000);
}

// ============================================================
//  STATE
// ============================================================
let currentUser=null, currentProfile=null, profiles=new Map(), friends=[], conversations=[], activeConversation=null;
let messageChannel=null, typingChannel=null, presenceChannel=null;
let presenceUsers=new Set();
let replyTo=null;
let selectedAttachments=[];
let mediaRecorder=null, voiceChunks=[];
let messageSearchTerm='';
let notificationCount=0;
let typingTimeout=null;

// ============================================================
//  AUTH & INIT
// ============================================================
async function ensureSession(){
 const {data,error}=await supabase.auth.getSession(); if(error)throw error;
 currentUser=data.session?.user||null;
 if(!currentUser)throw new Error('Please sign in first.');
}
async function ensureProfile(){
 const {data,error}=await supabase.from('profiles').select('id,username,display_name,avatar_url').eq('id',currentUser.id).maybeSingle();
 if(error)throw error;
 if(data){currentProfile=data;updateHeader();return}
 const display=currentUser.user_metadata?.full_name||currentUser.user_metadata?.name||(currentUser.email||'').split('@')[0]||'Spike User';
 const ins=await supabase.from('profiles').insert({id:currentUser.id,display_name:display});
 if(ins.error&&ins.error.code!=='23505')throw ins.error;
 const reread=await supabase.from('profiles').select('id,username,display_name,avatar_url').eq('id',currentUser.id).single();
 if(reread.error)throw reread.error; currentProfile=reread.data;updateHeader();
}
function updateHeader(){
 if(!currentProfile)return;
 const n=nameOf(currentProfile);
 $('headerName').textContent=n;
 $('headerAvatar').outerHTML=avatarMarkup(currentProfile,true).replace('<div class="small-avatar">','<div id="headerAvatar" class="small-avatar">');
}

// ============================================================
//  DATA LOADING
// ============================================================
async function loadProfiles(){
 const {data,error}=await supabase.from('profiles').select('id,username,display_name,avatar_url').neq('id',currentUser.id);
 if(error)throw error; profiles.clear(); (data||[]).forEach(p=>profiles.set(p.id,p));
}
async function loadFriends(){
 const {data,error}=await supabase.from('friendships').select('user_id,friend_id,status').or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`).eq('status','accepted');
 if(error)throw error;
 const ids=(data||[]).map(r=>r.user_id===currentUser.id?r.friend_id:r.user_id);
 friends=ids.map(id=>profiles.get(id)).filter(Boolean);
 const select=$('friendSelect');
 select.innerHTML='<option value="">Message a friend…</option>'+friends.map(p=>`<option value="${p.id}">${escapeHtml(nameOf(p))}${p.username?' @'+escapeHtml(p.username):''}</option>`).join('');
}
async function loadConversations(){
 const {data,error}=await supabase.from('direct_conversations').select('id,user_one,user_two,created_at,updated_at,last_message_at').or(`user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`).order('last_message_at',{ascending:false,nullsFirst:false});
 if(error)throw error;
 conversations=data||[];
 await renderConversations();
}
async function lastPreview(conversationId){
 const {data}=await supabase.from('direct_messages').select('body,created_at,sender_id').eq('conversation_id',conversationId).is('deleted_at',null).order('created_at',{ascending:false}).limit(1);
 return data?.[0]||null;
}
async function renderConversations(){
 const q=$('conversationSearch').value.trim().toLowerCase();
 const items=[];
 for(const c of conversations){
  const otherId=c.user_one===currentUser.id?c.user_two:c.user_one;
  const p=profiles.get(otherId); if(!p)continue;
  const preview=await lastPreview(c.id);
  const searchable=(nameOf(p)+' '+(p.username||'')).toLowerCase();
  if(q&&!searchable.includes(q))continue;
  items.push({c,p,preview});
 }
 if(!items.length){$('conversationList').innerHTML='<div class="empty">No conversations yet.<br><br>Choose a friend above to start one.</div>';return}
 $('conversationList').innerHTML=items.map(({c,p,preview})=>`
  <div class="conversation ${activeConversation?.id===c.id?'active':''}" data-conversation="${c.id}">
   ${avatarMarkup(p,true)}
   <div class="conv-info">
    <div class="conv-top"><span class="conv-name"><span class="presence-dot ${presenceUsers.has(p.id)?'online':''}"></span>${escapeHtml(nameOf(p))}</span><span class="conv-time">${timeAgo(preview?.created_at||c.last_message_at)}</span></div>
    <div class="preview">${escapeHtml(preview?.body||'No messages yet')}</div>
   </div>
  </div>`).join('');
}

// ============================================================
//  MESSAGES - FULL ORIGINAL LOGIC
// ============================================================
function formatMessageTime(iso){const d=new Date(iso);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function formatMessageDateTime(iso){const d=new Date(iso);return d.toLocaleString([],{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function renderMessageBody(m){
 const type=m.message_type||'text';
 if(m.deleted_at)return '<em>Message deleted</em>';
 const url=m.attachment_url||((type!=='text'&&/^https?:\/\//.test(m.body||''))?m.body:'');
 if(type==='image'&&url)return `<div class="file-message"><img src="${escapeHtml(url)}" alt="${escapeHtml(m.attachment_name||'image')}"></div>`;
 if(type==='video'&&url)return `<div class="file-message"><video src="${escapeHtml(url)}" controls playsinline></video></div>`;
 if(type==='audio'&&url)return `<audio class="audio-message" src="${escapeHtml(url)}" controls></audio>`;
 if(type==='file'&&url)return `<a class="btn" target="_blank" rel="noopener" href="${escapeHtml(url)}">📄 ${escapeHtml(m.attachment_name||'Open file')}</a>`;
 return escapeHtml(m.body||'');
}
async function loadReactions(messageIds){
 if(!messageIds.length)return[];
 const {data,error}=await supabase.from('message_reactions').select('message_id,user_id,emoji').in('message_id',messageIds);
 if(error){console.warn('reactions',error);return []}
 return data||[];
}
function setChatPresence(otherId){
 const online=presenceUsers.has(otherId);
 const dot=online?'<span class="presence-dot online"></span>':'<span class="presence-dot"></span>';
 const state=online?'Online':'Offline';
 const signal=activeConversation?.signal?`<span class="signal">· ${escapeHtml(activeConversation.signal)}</span>`:'';
 $('chatStatus').innerHTML=dot+state+signal;
}
function setSignal(text){
 if(!activeConversation)return;
 activeConversation.signal=text||'';
 const otherId=activeConversation.user_one===currentUser.id?activeConversation.user_two:activeConversation.user_one;
 setChatPresence(otherId);
}
function subscribeTyping(){
 if(typingChannel)supabase.removeChannel(typingChannel);
 if(!activeConversation)return;
 typingChannel=supabase.channel('typing-'+activeConversation.id);
 typingChannel.on('broadcast',{event:'typing'},payload=>{
  if(payload.payload?.user_id===currentUser.id)return;
  $('typing').textContent=payload.payload?.typing?(nameOf(profiles.get(payload.payload.user_id))+' is typing…'):'';
  clearTimeout(typingTimeout);
  if(payload.payload?.typing)typingTimeout=setTimeout(()=>$('typing').textContent='',2500);
 }).subscribe();
}
function broadcastTyping(typing){
 if(!typingChannel)return;
 typingChannel.send({type:'broadcast',event:'typing',payload:{user_id:currentUser.id,typing}});
}
function expiryDate(){
 const seconds=Number($('expirySelect')?.value||0);
 return seconds?new Date(Date.now()+seconds*1000).toISOString():null;
}
function setReply(message){
 replyTo=message||null;
 const box=$('replying');
 if(!message){box.classList.remove('show');$('replyingText').textContent='';return}
 box.classList.add('show');
 $('replyingText').textContent='Replying to: '+(message.body||'message').slice(0,100);
}
async function reactToMessage(messageId,emoji){
 const {error}=await supabase.from('message_reactions').upsert(
  {message_id:messageId,user_id:currentUser.id,emoji},
  {onConflict:'message_id,user_id'}
 );
 if(error)throw error;
}
async function togglePin(messageId){
 const {data,error}=await supabase.from('direct_messages').select('pinned_at').eq('id',messageId).single();
 if(error)throw error;
 const update=data.pinned_at?{pinned_at:null,pinned_by:null}:{pinned_at:new Date().toISOString(),pinned_by:currentUser.id};
 const r=await supabase.from('direct_messages').update(update).eq('id',messageId);
 if(r.error)throw r.error;
 await loadMessages();await loadPinned();
}
async function loadPinned(){
 if(!activeConversation)return;
 const {data,error}=await supabase.from('direct_messages')
  .select('id,body,message_type,created_at,pinned_at')
  .eq('conversation_id',activeConversation.id).not('pinned_at','is',null)
  .is('deleted_at',null).order('pinned_at',{ascending:false});
 if(error){showStatus('Could not load pinned messages: '+friendly(error),'error');return}
 const panel=$('pinnedPanel');
 if(!data?.length){panel.innerHTML='<div class="pinned-item">No pinned messages.</div>';return}
 panel.innerHTML=data.map(m=>`<div class="pinned-item" data-jump="${escapeHtml(m.id)}">📌 ${escapeHtml((m.body||'Attachment').slice(0,120))}</div>`).join('');
}
async function markRead(){
 if(!activeConversation)return;
 const {error}=await supabase.from('direct_conversation_members').update({last_read_at:new Date().toISOString()}).eq('conversation_id',activeConversation.id).eq('user_id',currentUser.id);
 if(error)console.warn('mark read',error);
}
function subscribeToMessages(){
 if(messageChannel)supabase.removeChannel(messageChannel);
 if(!activeConversation)return;
 const cid=activeConversation.id;
 messageChannel=supabase.channel('spike-chat-'+cid)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+cid},
   async payload=>{await loadMessages();await markRead();await loadConversations();})
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+cid},
   async ()=>{await loadMessages();})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'direct_messages',filter:'conversation_id=eq.'+cid},
   async ()=>{await loadMessages();})
  .subscribe(status=>{
   if(status==='SUBSCRIBED')setSignal('Live');
   else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setSignal('Reconnecting…');
   else setSignal('Connecting…');
  });
}
async function loadMessages(){
 if(!activeConversation)return;
 const {data,error}=await supabase.from('direct_messages').select('id,conversation_id,sender_id,body,message_type,created_at,edited_at,deleted_at,attachment_url,attachment_name,reply_to_id,pinned_at,pinned_by,expires_at').eq('conversation_id',activeConversation.id).order('created_at',{ascending:true});
 if(error)throw error;
 renderMessages(data||[]);
}
async function renderMessages(rows){
 const now=Date.now();
 rows=rows.filter(m=>!m.expires_at || new Date(m.expires_at).getTime()>now);
 if(!rows.length){$('messages').innerHTML='<div class="empty"><div><strong>No messages yet.</strong><br>Say hello 👋</div></div>';return}
 const reactions=await loadReactions(rows.map(x=>x.id));
 const byMsg=new Map();
 reactions.forEach(r=>{if(!byMsg.has(r.message_id))byMsg.set(r.message_id,[]);byMsg.get(r.message_id).push(r)});
 let lastDay='';
 $('messages').innerHTML=rows.map(m=>{
  const d=new Date(m.created_at),day=d.toLocaleDateString();
  const dayHtml=day!==lastDay?(lastDay=day,`<div class="day">${escapeHtml(d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric',year:'numeric'}))}</div>`):'';
  const mine=m.sender_id===currentUser.id;
  const exact=formatMessageDateTime(m.created_at),time=formatMessageTime(m.created_at);
  const rs=byMsg.get(m.id)||[];
  const reactionsHtml=rs.length?`<div class="reactions">${rs.map(r=>`<span class="reaction-pill">${escapeHtml(r.emoji)}</span>`).join('')}</div>`:'';
  const replyHtml=m.reply_to_id?`<div class="reply-preview">↩ Reply</div>`:'';
  const actions=`<div class="message-actions">
   <button class="reaction-btn" data-react="${escapeHtml(m.id)}" data-emoji="❤️">❤️</button>
   <button class="reaction-btn" data-react="${escapeHtml(m.id)}" data-emoji="😂">😂</button>
   <button class="reaction-btn" data-react="${escapeHtml(m.id)}" data-emoji="👍">👍</button>
   <button class="reply-btn" data-reply="${escapeHtml(m.id)}">↩ Reply</button>
   <button class="reaction-btn" data-pin="${escapeHtml(m.id)}">${m.pinned_at?'📌 Unpin':'📌 Pin'}</button>
   ${mine&&!m.deleted_at?`<button class="delete-btn" data-delete="${escapeHtml(m.id)}">Delete</button>`:''}
  </div>`;
  return `${dayHtml}<div class="msg-row ${mine?'mine':'theirs'}"><div class="bubble" title="${escapeHtml(exact)}">${replyHtml}${renderMessageBody(m)}<div class="meta">${escapeHtml(time)}${m.edited_at?' · edited':''}</div><div class="message-date">${escapeHtml(exact)}</div>${reactionsHtml}${actions}</div></div>`;
 }).join('');
 $('messages').scrollTop=$('messages').scrollHeight;
}
async function openConversation(c){
 activeConversation=c;
 $('app').classList.remove('mobile-list');$('app').classList.add('mobile-chat');
 const otherId=c.user_one===currentUser.id?c.user_two:c.user_one,p=profiles.get(otherId);
 $('chatAvatar').outerHTML=avatarMarkup(p).replace('<div class="avatar">','<div id="chatAvatar" class="avatar">');
 $('chatName').textContent=nameOf(p);
 setChatPresence(otherId);
 $('messageInput').disabled=false;$('sendBtn').disabled=false;$('attachBtn').disabled=false;$('voiceBtn').disabled=false;$('searchMessagesBtn').disabled=false;$('pinnedBtn').disabled=false;$('voiceCallBtn').disabled=false;$('videoCallBtn').disabled=false;$('expirySelect').disabled=false;$('chatSettingsBtn').disabled=false;
 $('messageInput').focus();
 await loadMessages();
 await markRead();
 subscribeToMessages();subscribeTyping();
 await renderConversations();
}
async function sendMessage(){
 if(!activeConversation)return;
 const body=$('messageInput').value.trim();if(!body)return;
 $('sendBtn').disabled=true;$('messageInput').disabled=true;
 try{
  const {error}=await supabase.from('direct_messages').insert({conversation_id:activeConversation.id,sender_id:currentUser.id,body,message_type:'text',reply_to_id:replyTo?.id||null,expires_at:expiryDate()});
  if(error)throw error;
  $('messageInput').value='';$('messageInput').style.height='44px';setReply(null);broadcastTyping(false);
  await loadMessages();await loadConversations();
 }catch(e){showStatus('Could not send message: '+friendly(e),'error')}
 finally{$('messageInput').disabled=false;$('sendBtn').disabled=false;$('messageInput').focus()}
}
async function searchMessages(){
 if(!activeConversation)return;
 const q=messageSearchTerm.trim();
 if(!q){await loadMessages();return}
 const {data,error}=await supabase.from('direct_messages')
  .select('id,conversation_id,sender_id,body,message_type,created_at,edited_at,deleted_at,attachment_url,attachment_name,reply_to_id,pinned_at,pinned_by,expires_at')
  .eq('conversation_id',activeConversation.id)
  .is('deleted_at',null)
  .ilike('body','%'+q+'%')
  .order('created_at',{ascending:false}).limit(100);
 if(error){showStatus('Message search failed: '+friendly(error),'error');return}
 renderMessages(data||[]);
}
async function startChat(otherId){
 if(!otherId)return;
 $('friendSelect').value='';
 try{
  const {data,error}=await supabase.rpc('get_or_create_direct_conversation',{p_other_user:otherId});
  if(error)throw error;
  await loadConversations();
  const c=conversations.find(x=>x.id===data);
  if(c)await openConversation(c);
 }catch(e){showStatus('Could not start conversation: '+friendly(e),'error')}
}
function renderAttachmentPreview(){
 $('attachmentPreview').innerHTML=selectedAttachments.map((f,i)=>`
  <div class="attachment-chip"><span>${escapeHtml(f.name)}</span><button type="button" data-remove-file="${i}">×</button></div>`).join('');
}
async function uploadAttachment(file){
 const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
 const path=`${currentUser.id}/${crypto.randomUUID()}-${safe}`;
 const {error}=await supabase.storage.from('message-media').upload(path,file,{upsert:false});
 if(error)throw error;
 const {data}=supabase.storage.from('message-media').getPublicUrl(path);
 return {url:data.publicUrl,name:file.name,type:file.type,size:file.size};
}
async function sendAttachment(file){
 if(!activeConversation)throw new Error('Select a conversation first.');
 const uploaded=await uploadAttachment(file);
 const {error}=await supabase.from('direct_messages').insert({
  conversation_id:activeConversation.id,
  sender_id:currentUser.id,
  body:uploaded.url,
  message_type:file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file',
  attachment_url:uploaded.url,
  attachment_name:uploaded.name,
  reply_to_id:replyTo?.id||null
 });
 if(error)throw error;
}
async function sendVoice(){
 if(!activeConversation)return;
 if(!mediaRecorder||mediaRecorder.state!=='inactive')return;
 const blob=new Blob(voiceChunks,{type:'audio/webm'});
 const file=new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'});
 await sendAttachment(file);
}

async function startPresence(){
 if(!currentUser)return;
 if(presenceChannel)await supabase.removeChannel(presenceChannel);
 presenceChannel=supabase.channel('spike-presence',{
  config:{presence:{key:currentUser.id}}
 });
 presenceChannel
  .on('presence',{event:'sync'},()=>{
   const state=presenceChannel.presenceState();
   presenceUsers=new Set(Object.keys(state).filter(id=>id!==currentUser.id));
   if(activeConversation){
    const otherId=activeConversation.user_one===currentUser.id?activeConversation.user_two:activeConversation.user_one;
    setChatPresence(otherId);
   }
   renderConversations();
  })
  .subscribe(async status=>{
   if(status==='SUBSCRIBED'){
    await presenceChannel.track({user_id:currentUser.id,online_at:new Date().toISOString()});
   }
  });
}

function switchScreen(screenId){
 document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
 const target=document.getElementById('screen-'+screenId);
 if(target)target.classList.add('active');
 const app=$('app');
 if(screenId==='messages'){app.style.display='grid';}else{app.style.display='none';}
 if(screenId==='groups')renderGroups();
 if(screenId==='stories')renderStories();
 if(screenId==='media')renderMedia();
 if(screenId==='calls')renderCalls();
 if(screenId==='location')renderLocation();
 if(screenId==='themes')renderThemes();
 if(screenId==='privacy')renderPrivacy();
 if(screenId==='settings' && activeConversation)openChatSettings();
}

const menuOverlay=$('menuOverlay');

const menuClose=$('menuClose');

function openMenu(){
 menuOverlay.classList.add('open');
 document.body.style.overflow='hidden';
}

 menuOverlay.classList.remove('open');
 document.body.style.overflow='';
}
menuToggle.addEventListener('click',openMenu);

});

  switchScreen(screen);
  closeMenu();
 });
});

// Voice
$('voiceBtn').addEventListener('click',async()=>{
 if(!activeConversation){showStatus('Select a conversation first.','error');return}
 if(!navigator.mediaDevices?.getUserMedia){showStatus('Voice recording is not supported here.','error');return}
 if(mediaRecorder?.state==='recording'){mediaRecorder.stop();$('voiceBtn').textContent='🎙️';return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[];
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   try{await sendVoice();await loadMessages();await loadConversations();}
   catch(e){showStatus('Could not send voice message: '+friendly(e),'error')}
  };
  mediaRecorder.start();$('voiceBtn').textContent='⏹️';
 }catch(e){showStatus('Microphone permission is required for voice messages.','error')}
});

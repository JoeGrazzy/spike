<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPIKE Room – Full</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ... (styles remain unchanged) ... */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #0B0C10; --bg-secondary: #14161D; --bg-card: #1A1D27;
      --border-glow: #2C2F3A; --violet: #8A2BE2; --lime: #39FF14;
      --cyan: #00F0FF; --text-primary: #EDEDED; --text-muted: #8A8F9E;
      --shadow-neon: 0 0 15px rgba(138,43,226,0.3);
      --radius: 16px; --transition: all 0.25s ease;
    }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; }
    #app { width: 100%; max-width: 420px; height: 100vh; max-height: 820px; background: var(--bg-secondary); border-radius: 32px; border: 1px solid var(--border-glow); box-shadow: var(--shadow-neon), 0 20px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 10px; }

    header { padding: 16px 20px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-glow); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand .live-badge { font-size: 9px; font-weight: 700; background: var(--lime); color: #000; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; animation: pulse-dot 1.5s infinite; -webkit-text-fill-color: #000; }
    @keyframes pulse-dot { 0% { opacity:1; } 50% { opacity:0.5; } 100% { opacity:1; } }
    .user-mini { display: flex; align-items: center; gap: 8px; background: var(--bg-card); padding: 4px 12px 4px 4px; border-radius: 40px; border: 1px solid var(--border-glow); cursor: pointer; }
    .avatar-morph { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--violet), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; box-shadow: 0 0 12px rgba(138,43,226,0.5); transition: var(--transition); }
    .level-badge { font-size: 10px; font-weight: 700; color: var(--lime); background: rgba(57,255,20,0.15); padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(57,255,20,0.3); }

    .room-header { padding: 12px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-glow); flex-shrink: 0; }
    .room-selector { display: flex; gap: 8px; margin-bottom: 8px; }
    .room-btn { background: transparent; border: 1px solid var(--border-glow); color: var(--text-muted); padding: 4px 14px; border-radius: 30px; font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: inherit; }
    .room-btn.active { background: var(--violet); color: #fff; border-color: var(--violet); box-shadow: 0 0 20px rgba(138,43,226,0.4); }
    .room-tools { display:flex; gap:8px; margin-bottom:8px; }
    .room-tool-btn { flex:1; background:var(--bg-secondary); border:1px solid var(--border-glow); color:var(--text-primary); padding:8px 10px; border-radius:10px; font:600 11px inherit; cursor:pointer; }
    .room-tool-btn.primary { background:var(--violet); border-color:var(--violet); color:#fff; }
    .room-browser { display:none; position:absolute; inset:0; z-index:80; background:var(--bg-primary); flex-direction:column; }
    .room-browser.open { display:flex; }
    .browser-head { padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-glow); background:var(--bg-secondary); }
    .browser-head h2 { font-size:18px; }
    .browser-close { background:transparent; border:1px solid var(--border-glow); color:#fff; width:36px; height:36px; border-radius:50%; cursor:pointer; }
    .browser-body { padding:14px 16px; overflow:auto; flex:1; }
    .room-search { width:100%; background:var(--bg-card); border:1px solid var(--border-glow); color:#fff; padding:11px 14px; border-radius:12px; outline:none; margin-bottom:12px; }
    .room-card { background:var(--bg-card); border:1px solid var(--border-glow); border-radius:14px; padding:13px; margin-bottom:10px; }
    .room-card-top { display:flex; gap:10px; align-items:center; }
    .room-avatar { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--violet),var(--cyan)); font-weight:800; }
    .room-card-info { flex:1; min-width:0; }
    .room-card-name { font-weight:800; font-size:14px; }
    .room-card-meta { font-size:10px; color:var(--text-muted); margin-top:3px; }
    .room-card-desc { font-size:11px; color:var(--text-muted); margin:9px 0; line-height:1.4; }
    .room-card-actions { display:flex; gap:7px; }
    .room-card-actions button { flex:1; border:1px solid var(--border-glow); background:var(--bg-secondary); color:#fff; padding:8px; border-radius:9px; cursor:pointer; font:600 10px inherit; }
    .room-card-actions .join { background:var(--violet); border-color:var(--violet); }
    .create-form { background:var(--bg-card); border:1px solid var(--border-glow); border-radius:14px; padding:14px; margin-bottom:14px; }
    .create-form input,.create-form textarea { width:100%; background:var(--bg-secondary); border:1px solid var(--border-glow); color:#fff; border-radius:10px; padding:10px; margin-bottom:8px; font:inherit; outline:none; }
    .create-form textarea { min-height:70px; resize:none; }
    .create-form button { width:100%; padding:10px; border:0; border-radius:10px; background:var(--violet); color:#fff; font-weight:700; cursor:pointer; }
    .room-empty { text-align:center; color:var(--text-muted); padding:35px 15px; font-size:12px; }
    .message-menu { margin-left:auto; background:transparent; border:0; color:var(--text-muted); cursor:pointer; }

    .spark-topic { display: flex; align-items: center; gap: 10px; background: rgba(0,240,255,0.05); padding: 6px 12px; border-radius: 40px; border-left: 3px solid var(--cyan); }
    .spark-topic i { color: var(--cyan); font-size: 14px; }
    .spark-topic span { font-size: 13px; font-weight: 400; color: var(--text-primary); }
    .spark-topic .ai-tag { font-size: 8px; font-weight: 700; color: var(--cyan); background: rgba(0,240,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px; }

    .energy-section { padding: 8px 20px; background: var(--bg-secondary); flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
    .energy-label { font-size: 11px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .energy-track { flex: 1; height: 6px; background: var(--bg-card); border-radius: 10px; overflow: hidden; }
    .energy-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--lime), var(--cyan)); border-radius: 10px; transition: width 0.5s ease; }
    .energy-fill.danger { background: linear-gradient(90deg, #FF4D4D, #FF9D4D); }
    .coins-display { font-size: 13px; font-weight: 700; color: #FFD700; display: flex; align-items: center; gap: 4px; background: rgba(255,215,0,0.1); padding: 2px 10px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.2); }

    .panel { display: none; flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--bg-primary); flex-direction: column; gap: 12px; }
    .panel.active { display: flex; }
    #chat-panel { padding: 0; background: transparent; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

    .feed-item, .inbox-item { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 12px; padding: 12px 16px; }
    .feed-item .msg-text { font-size: 14px; margin-bottom: 4px; }
    .feed-item .meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; }
    .inbox-item .inbox-text { font-size: 14px; }
    .inbox-item .inbox-meta { font-size: 11px; color: var(--text-muted); }

    .profile-avatar { font-size: 64px; text-align: center; margin-bottom: 12px; }
    .profile-field { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-glow); }
    .profile-field .label { color: var(--text-muted); }
    .profile-field .value { font-weight: 600; }
    .edit-btn { background: var(--violet); border: none; color: #fff; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; margin-top: 12px; }

    .message { display: flex; flex-direction: column; max-width: 85%; animation: slide-up 0.2s ease-out; }
    @keyframes slide-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .message.self { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { background: var(--bg-card); padding: 10px 14px; border-radius: 14px; border-bottom-left-radius: 4px; border: 1px solid var(--border-glow); }
    .message.self .msg-bubble { background: var(--violet); border-color: var(--violet); border-bottom-right-radius: 4px; border-bottom-left-radius: 14px; }
    .msg-user { font-size: 10px; font-weight: 700; color: var(--cyan); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .message.self .msg-user { color: #fff; }
    .msg-text { font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .pulse-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: var(--transition); font-family: inherit; padding: 2px 6px; border-radius: 20px; }
    .pulse-btn:hover { color: var(--lime); }
    .pulse-btn.pulsed { color: var(--lime); }
    .msg-time { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

    .input-area { padding: 12px 16px; background: var(--bg-secondary); border-top: 1px solid var(--border-glow); display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .input-area input { flex: 1; background: var(--bg-card); border: 1px solid var(--border-glow); padding: 10px 16px; border-radius: 40px; color: #fff; font-family: inherit; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: var(--violet); box-shadow: 0 0 15px rgba(138,43,226,0.2); }
    .input-area input::placeholder { color: var(--text-muted); }
    .input-area button { background: var(--violet); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(138,43,226,0.3); }
    .input-area button:hover { transform: scale(1.05); background: #7A1BD6; }
    .crate-btn { background: transparent; border: 1px solid var(--border-glow); color: #FFD700; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: var(--transition); }
    .crate-btn:hover { background: rgba(255,215,0,0.1); border-color: #FFD700; }

    .bottom-nav { display: flex; justify-content: space-around; padding: 8px 0 12px; background: var(--bg-secondary); border-top: 1px solid var(--border-glow); flex-shrink: 0; }
    .nav-item { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; font-family: inherit; }
    .nav-item span { font-size: 8px; font-weight: 600; letter-spacing: 0.5px; }
    .nav-item.active { color: var(--violet); }

    .toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--lime); padding: 12px 24px; border-radius: 40px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 0 40px rgba(57,255,20,0.3); backdrop-filter: blur(10px); animation: toast-in 0.4s ease-out; z-index: 99; white-space: nowrap; }
    @keyframes toast-in { from { opacity:0; transform:translateX(-50%) translateY(30px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

    @media (max-width:440px) { #app { max-height:100vh; border-radius:0; border:none; } }
  </style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header>
    <div class="brand"><h1>⚡ SPIKE Room</h1><span class="live-badge">● Live</span></div>
    <div class="user-mini" id="headerProfileBtn">
      <div class="avatar-morph" id="avatarDisplay">S</div>
      <span class="level-badge" id="levelBadge">Lv.1</span>
    </div>
  </header>

  <!-- ROOM SELECTOR + SPARK -->
  <div class="room-header" id="roomHeader">
    <div class="room-tools">
      <button class="room-tool-btn primary" id="browseRoomsBtn"><i class="fas fa-compass"></i> Browse rooms</button>
      <button class="room-tool-btn" id="createRoomBtn"><i class="fas fa-plus"></i> Create room</button>
    </div>
    <div class="room-selector" id="roomSelector"></div>
    <div class="spark-topic">
      <i class="fas fa-bolt"></i>
      <span id="sparkTopic">"Is cereal a soup?"</span>
      <span class="ai-tag">AI SPARK</span>
    </div>
  </div>


  <div class="room-browser" id="roomBrowser">
    <div class="browser-head"><h2>⚡ Public Rooms</h2><button class="browser-close" id="closeBrowser"><i class="fas fa-times"></i></button></div>
    <div class="browser-body">
      <div id="createRoomForm" class="create-form" style="display:none">
        <input id="newRoomName" maxlength="80" placeholder="Room name" />
        <textarea id="newRoomDescription" maxlength="300" placeholder="What is this room about?"></textarea>
        <input id="newRoomTopic" maxlength="160" placeholder="Opening topic (optional)" />
        <button id="submitCreateRoom">Create public room</button>
      </div>
      <input id="roomSearch" class="room-search" placeholder="Search public rooms..." />
      <div id="roomDirectory"></div>
    </div>
  </div>

  <!-- ENERGY + COINS -->
  <div class="energy-section" id="energySection">
    <div class="energy-label"><i class="fas fa-bolt" style="color:var(--lime);"></i> <span id="energyText">100</span>%</div>
    <div class="energy-track"><div class="energy-fill" id="energyFill" style="width:100%;"></div></div>
    <div class="coins-display"><i class="fas fa-coins"></i> <span id="coinText">0</span></div>
  </div>

  <!-- CONTENT PANELS -->
  <div class="panel active" id="chat-panel">
    <div id="chat-container"></div>
  </div>

  <div class="panel" id="feed-panel">
    <h3 style="margin-bottom:8px;">🔥 Top Pulsed Messages</h3>
    <div id="feed-container"></div>
  </div>

  <div class="panel" id="inbox-panel">
    <h3 style="margin-bottom:8px;">📬 Notifications</h3>
    <div id="inbox-container"></div>
  </div>

  <div class="panel" id="profile-panel">
    <div id="profile-container"></div>
  </div>

  <!-- INPUT -->
  <div class="input-area" id="inputArea">
    <button class="crate-btn" id="crateBtn" title="Mystery Crate"><i class="fas fa-gift"></i></button>
    <input type="text" id="msgInput" placeholder="Type your vibe..." maxlength="140" />
    <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-item active" data-tab="chat"><i class="fas fa-comment-dots"></i><span>Rooms</span></button>
    <button class="nav-item" data-tab="feed"><i class="fas fa-fire"></i><span>Feed</span></button>
    <button class="nav-item" data-tab="inbox"><i class="fas fa-inbox"></i><span>Inbox</span></button>
    <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></button>
  </div>
</div>

<script>
// ================================================================
// SPIKE ROOM – migrated to the existing SPIKE Supabase schema
// Uses: profiles, rooms, room_members, room_messages,
// room_message_pulses, room_user_stats, room_crate_rewards,
// room_topics and notifications.
// ================================================================

const SUPABASE_URL = 'https://bkrrewagsbjqgmxaaqyt.spikeDB.co';
const SUPABASE_ANON_KEY = 'sb_publishable_24Z2PQpdG13cf6_9w8C7nA_zXEzr60O';
const spikeDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentRoom = null;
let currentRoomKey = 'arena';
let rooms = {};
let messages = [];
let energyInterval = null;
let toastTimer = null;
let subChannel = null;
let currentTab = 'chat';

const $ = id => document.getElementById(id);
const chatContainer = $('chat-container');
const feedContainer = $('feed-container');
const inboxContainer = $('inbox-container');
const profileContainer = $('profile-container');
const msgInput = $('msgInput');
const sendBtn = $('sendBtn');
const crateBtn = $('crateBtn');
const energyFill = $('energyFill');
const energyText = $('energyText');
const coinText = $('coinText');
const levelBadge = $('levelBadge');
const avatarDisplay = $('avatarDisplay');
const sparkTopic = $('sparkTopic');
const roomBtns = document.querySelectorAll('.room-btn');
const navBtns = document.querySelectorAll('.nav-item');
const roomBrowser = $('roomBrowser');
const roomDirectory = $('roomDirectory');
const roomSearch = $('roomSearch');
const createRoomForm = $('createRoomForm');
const panels = {
  chat: $('chat-panel'),
  feed: $('feed-panel'),
  inbox: $('inbox-panel'),
  profile: $('profile-panel')
};
const headerProfileBtn = $('headerProfileBtn');

const topics = [
  'Is cereal a soup?',
  'Which animal would rule the world?',
  'Is water wet?',
  'AI will take over in 2050.',
  'Would you rather fight 1 horse-sized duck?',
  'Pineapple on pizza?'
];

async function initAnonymousSession() {
  const { data, error } = await spikeDB.auth.getSession();
  if (data?.session?.user) return true;

  const { error: signInError } = await spikeDB.auth.signInAnonymously();
  if (signInError) {
    console.error(signInError);
    showToast('⚠️ Connection failed');
    return false;
  }
  return true;
}

async function getOrCreateProfile(userId) {
  let { data: profile, error } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', userId)
    .maybeSingle();

  if (error) {
    console.error(error);
    return null;
  }

  if (!profile) {
    const username = 'User_' + Math.floor(1000 + Math.random() * 9000);
    const { data, error: insertError } = await supabase
      .from('profiles')
      .insert([{ id: userId, username, display_name: username }])
      .select('*')
      .single();

    if (insertError) {
      console.error(insertError);
      return null;
    }
    profile = data;
  }

  return profile;
}

async function loadRooms() {
  const { data, error } = await spikeDB.from('rooms')
    .select('id,name,description,avatar_url,is_public,is_active,participant_count,owner_id,created_at')
    .eq('is_public', true).eq('is_active', true).order('created_at', { ascending:false });
  if (error) { console.error(error); showToast('❌ Could not load rooms'); return false; }
  const list = data || [];
  rooms = {};
  list.forEach(r => { rooms[r.id] = r; });
  renderRoomSelector(list);
  renderRoomDirectory(list);
  const saved = localStorage.getItem('spike_current_room');
  const candidate = list.find(r => r.id === saved);
  if (candidate) currentRoom = candidate.id;
  else if (list.length) currentRoom = list[0].id;
  else currentRoom = null;
  currentRoomKey = currentRoom || null;
  return !!currentRoom;
}

function renderRoomSelector(list) {
  const selector = $('roomSelector');
  selector.innerHTML = list.slice(0,5).map(r => `<button class="room-btn ${r.id===currentRoom?'active':''}" data-room-id="${r.id}">${escapeHtml(r.name)}</button>`).join('');
  selector.querySelectorAll('.room-btn').forEach(b => b.addEventListener('click', () => selectRoom(b.dataset.roomId)));
}

async function selectRoom(roomId) {
  const room = rooms[roomId];
  if (!room) return;
  const { data: member } = await spikeDB.from('room_members').select('room_id').eq('room_id',roomId).eq('user_id',currentUser.id).maybeSingle();
  if (!member) {
    if (!confirm(`Join ${room.name}?`)) return;
    const { error } = await spikeDB.rpc('join_public_room',{p_room_id:roomId});
    if (error) { showToast('❌ '+error.message); return; }
    showToast(`✓ Joined ${room.name}`);
  }
  currentRoom = roomId; currentRoomKey = roomId; localStorage.setItem('spike_current_room',roomId);
  document.querySelectorAll('.room-btn').forEach(b=>b.classList.toggle('active',b.dataset.roomId===roomId));
  if (subChannel) { await spikeDB.removeChannel(subChannel); subChannel=null; }
  await loadMessages(currentRoom); subscribeToRoom(currentRoom); await loadCurrentTopic();
  closeRoomBrowser();
}

function renderRoomDirectory(list) {
  const q=(roomSearch?.value||'').trim().toLowerCase();
  const filtered=list.filter(r => !q || r.name.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q));
  if (!filtered.length) { roomDirectory.innerHTML='<div class="room-empty">No public rooms found.<br>Create the first one.</div>'; return; }
  roomDirectory.innerHTML=filtered.map(r=>{
    const initial=escapeHtml((r.name||'R').charAt(0).toUpperCase());
    return `<div class="room-card"><div class="room-card-top"><div class="room-avatar">${initial}</div><div class="room-card-info"><div class="room-card-name">${escapeHtml(r.name)}</div><div class="room-card-meta">${Number(r.participant_count||0)} members • Public</div></div></div><div class="room-card-desc">${escapeHtml(r.description||'No description yet.')}</div><div class="room-card-actions"><button class="join" onclick="joinAndOpenRoom('${r.id}')">Open / Join</button><button onclick="toggleFavorite('${r.id}')">★ Favorite</button></div></div>`;
  }).join('');
}

window.joinAndOpenRoom = id => selectRoom(id);
window.toggleFavorite = async function(roomId) {
  const { data: existing } = await spikeDB.from('room_favorites').select('room_id').eq('room_id',roomId).eq('user_id',currentUser.id).maybeSingle();
  if (existing) { await spikeDB.from('room_favorites').delete().eq('room_id',roomId).eq('user_id',currentUser.id); showToast('★ Removed from favorites'); }
  else { const {error}=await spikeDB.from('room_favorites').insert({room_id:roomId,user_id:currentUser.id}); if(error){showToast('❌ Favorite failed');return;} showToast('★ Added to favorites'); }
};

function openRoomBrowser(showCreate=false) { roomBrowser.classList.add('open'); createRoomForm.style.display=showCreate?'block':'none'; renderRoomDirectory(Object.values(rooms)); }
function closeRoomBrowser() { roomBrowser.classList.remove('open'); createRoomForm.style.display='none'; }

async function createRoom() {
  const name=$('newRoomName').value.trim(), description=$('newRoomDescription').value.trim(), topic=$('newRoomTopic').value.trim();
  if(!name){showToast('Room name is required');return;}
  const {data:id,error}=await spikeDB.rpc('create_public_room',{p_name:name,p_description:description||null,p_avatar_url:null,p_topic:topic||null});
  if(error){console.error(error);showToast('❌ '+error.message);return;}
  $('newRoomName').value=''; $('newRoomDescription').value=''; $('newRoomTopic').value='';
  await loadRooms(); await selectRoom(id); showToast('✓ Room created');
}

async function loadUserState() {
  const { data: stats, error: statsError } = await supabase
    .from('room_user_stats')
    .select('energy,level')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (statsError) console.error(statsError);

  const { data: wallet, error: walletError } = await supabase
    .from('user_wallets')
    .select('coins')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (walletError) console.error(walletError);

  currentUser.energy = Number(stats?.energy ?? 100);
  currentUser.avatar_level = Number(stats?.level ?? 1);
  currentUser.coins = Number(wallet?.coins ?? 50);
  updateUI();
}

async function initApp() {
  if (!(await initAnonymousSession())) return;

  const { data: { user } } = await spikeDB.auth.getUser();
  if (!user) {
    showToast('❌ No user');
    return;
  }

  const profile = await getOrCreateProfile(user.id);
  if (!profile) {
    showToast('❌ Profile error');
    return;
  }

  currentUser = profile;

  if (!(await loadRooms())) {
    showToast('No public rooms yet — create one.');
  }
  await loadUserState();
  if (currentRoom) {
    await selectRoom(currentRoom);
    startEnergyDecay();
    await loadCurrentTopic();
  } else {
    sparkTopic.textContent = 'Create or join a public room to start';
    msgInput.disabled = true; sendBtn.disabled = true;
  }

  setTimeout(() => {
    addSystemMessage('👋 Welcome to SPIKE Room! Pulse, crate, level up!');
  }, 500);

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
  crateBtn.addEventListener('click', openCrate);

  $('browseRoomsBtn').addEventListener('click',()=>openRoomBrowser(false));
  $('createRoomBtn').addEventListener('click',()=>openRoomBrowser(true));
  $('closeBrowser').addEventListener('click',closeRoomBrowser);
  $('submitCreateRoom').addEventListener('click',createRoom);
  roomSearch.addEventListener('input',()=>renderRoomDirectory(Object.values(rooms)));

  navBtns.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  headerProfileBtn.addEventListener('click', () => switchTab('profile'));
}

async function loadCurrentTopic() {
  const { data } = await supabase
    .from('room_topics')
    .select('topic')
    .eq('room_id', currentRoom)
    .eq('is_active', true)
    .limit(20);

  if (data?.length) {
    sparkTopic.textContent = `"${data[Math.floor(Math.random() * data.length)].topic}"`;
  } else {
    sparkTopic.textContent = `"${topics[Math.floor(Math.random() * topics.length)]}"`;
  }
}

async function loadMessages(roomId) {
  const { data, error } = await supabase
    .from('room_messages')
    .select(`
      id,
      body,
      created_at,
      user_id,
      profiles(username,display_name),
      room_message_pulses(id,user_id)
    `)
    .eq('room_id', roomId)
    .order('created_at', { ascending: true })
    .limit(50);

  if (error) {
    console.error(error);
    showToast('❌ Could not load messages');
    return;
  }

  messages = (data || []).map(m => ({
    id: m.id,
    user: m.profiles?.display_name || m.profiles?.username || 'User',
    userId: m.user_id,
    text: m.body || '',
    pulse: m.room_message_pulses?.length || 0,
    time: formatTime(m.created_at),
    self: m.user_id === currentUser.id
  }));

  renderMessages();
}

function renderMessages() {
  chatContainer.innerHTML = '';

  messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = `message ${msg.self ? 'self' : 'other'}`;
    div.dataset.id = msg.id;

    div.innerHTML = `
      <div class="msg-bubble">
        <div class="msg-user">
          ${!msg.self ? `<i class="fas fa-user-circle"></i> ${escapeHtml(msg.user)}` : 'You'}
          ${!msg.self ? `<span style="color:var(--text-muted);font-weight:400;font-size:9px;">• ${msg.time}</span>` : ''}
        </div>
        <div class="msg-text">${escapeHtml(msg.text)}</div>
      </div>
      <div class="msg-actions">
        <button class="pulse-btn ${msg.pulse > 5 ? 'pulsed' : ''}" onclick="pulseMessage('${msg.id}')">
          <i class="fas fa-bolt"></i> <span class="pulse-count">${msg.pulse}</span>
        </button>
        <span class="msg-time">${msg.time}</span>
        ${!msg.self ? `<button class="message-menu" title="Report" onclick="reportMessage('${msg.id}')"><i class="fas fa-flag"></i></button>` : `<button class="message-menu" title="Delete" onclick="deleteOwnMessage('${msg.id}')"><i class="fas fa-trash"></i></button>`}
      </div>
    `;
    chatContainer.appendChild(div);
  });

  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function formatTime(value) {
  return new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getAvatarChar(level) {
  const chars = ['S', '⚡', '🔥', '💀', '👾', '🚀', '🌟', '⚡', '🔥', '💎', '👑'];
  return chars[Math.min(Math.max(Number(level) || 1, 1), 10)];
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  if (!currentRoom) { showToast('Join or create a room first'); return; }

  if (currentUser.energy < 2) {
    showToast('⚠️ Low Energy! Open a crate.');
    return;
  }

  const { data, error } = await supabase
    .from('room_messages')
    .insert([{
      room_id: currentRoom,
      user_id: currentUser.id,
      body: text
    }])
    .select('id,body,created_at,user_id')
    .single();

  if (error) {
    console.error(error);
    showToast(error.code === '42501' ? '❌ You are not a room member' : '❌ Failed to send');
    return;
  }

  currentUser.energy = Math.max(0, currentUser.energy - 2);
  currentUser.coins += 10;
  await syncUserStats();

  msgInput.value = '';

  if (!messages.some(m => m.id === data.id)) {
    messages.push({
      id: data.id,
      user: currentUser.display_name || currentUser.username,
      userId: currentUser.id,
      text: data.body,
      pulse: 0,
      time: formatTime(data.created_at),
      self: true
    });
    renderMessages();
  }
}

window.reportMessage = async function(messageId) {
  const reason = prompt('Why are you reporting this message?');
  if (!reason?.trim()) return;
  const details = prompt('Additional details (optional):') || null;
  const { error } = await spikeDB.rpc('report_room_message',{p_message_id:messageId,p_reason:reason.trim(),p_details:details});
  if (error) { console.error(error); showToast('❌ Could not report message'); return; }
  showToast('✓ Report submitted');
};

window.deleteOwnMessage = async function(messageId) {
  if (!confirm('Delete this message?')) return;
  const { error } = await spikeDB.from('room_messages').delete().eq('id',messageId).eq('user_id',currentUser.id);
  if (error) { console.error(error); showToast('❌ Could not delete'); return; }
  messages = messages.filter(m=>m.id!==messageId); renderMessages(); showToast('Message deleted');
};

window.pulseMessage = async function(messageId) {
  const msg = messages.find(m => m.id === messageId);
  if (!msg) return;
  if (msg.self) {
    showToast('You cannot pulse yourself');
    return;
  }

  const { error } = await supabase
    .from('room_message_pulses')
    .insert([{ message_id: messageId, user_id: currentUser.id }]);

  if (error) {
    if (error.code === '23505') showToast('Already pulsed');
    else {
      console.error(error);
      showToast('❌ Pulse failed');
    }
    return;
  }

  msg.pulse += 1;
  renderMessages();

  const { count } = await supabase
    .from('room_message_pulses')
    .select('id', { count: 'exact', head: true })
    .eq('user_id', currentUser.id);

  if (count && count % 5 === 0) {
    currentUser.avatar_level = Math.min(10, currentUser.avatar_level + 1);
    await supabase
      .from('room_user_stats')
      .update({ level: currentUser.avatar_level, updated_at: new Date().toISOString() })
      .eq('user_id', currentUser.id);
    showToast('🎉 Level Up!');
    updateUI();
  }
};

async function openCrate() {
  const rewards = [
    { type: 'energy', value: 20, label: 'Energy' },
    { type: 'coins', value: 30, label: 'Coins' },
    { type: 'energy', value: 50, label: 'Energy' },
    { type: 'coins', value: 15, label: 'Coins' },
    { type: 'sticker', value: 0, label: 'Rare Ghost' }
  ];

  const reward = rewards[Math.floor(Math.random() * rewards.length)];

  const { error } = await supabase
    .from('room_crate_rewards')
    .insert([{
      user_id: currentUser.id,
      reward_type: reward.type,
      reward_value: reward.value,
      reward_label: reward.label
    }]);

  if (error) {
    console.error(error);
    showToast('❌ Could not open crate');
    return;
  }

  if (reward.type === 'energy') {
    currentUser.energy = Math.min(100, currentUser.energy + reward.value);
    showToast(`✨ +${reward.value} Energy!`);
  } else if (reward.type === 'coins') {
    currentUser.coins += reward.value;
    showToast(`🪙 +${reward.value} Coins!`);
  } else {
    showToast(`🎨 Sticker: ${reward.label}!`);
  }

  await syncUserStats();
  updateUI();
}

async function switchRoom(roomKey) { return selectRoom(roomKey); }

function subscribeToRoom(roomId) {
  if (subChannel) spikeDB.removeChannel(subChannel);

  subChannel = supabase
    .channel(`spike-room:${roomId}`)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'room_messages',
      filter: `room_id=eq.${roomId}`
    }, async payload => {
      const newMsg = payload.new;
      if (messages.some(m => m.id === newMsg.id)) return;

      const { data: userData } = await supabase
        .from('profiles')
        .select('username,display_name')
        .eq('id', newMsg.user_id)
        .maybeSingle();

      messages.push({
        id: newMsg.id,
        user: userData?.display_name || userData?.username || 'User',
        userId: newMsg.user_id,
        text: newMsg.body || '',
        pulse: 0,
        time: formatTime(newMsg.created_at),
        self: newMsg.user_id === currentUser.id
      });
      renderMessages();
    })
    .subscribe();
}

function addSystemMessage(text) {
  messages.push({
    id: 'sys-' + Date.now(),
    user: 'System',
    userId: null,
    text,
    pulse: 0,
    time: 'Now',
    self: false
  });
  renderMessages();
}

function startEnergyDecay() {
  if (energyInterval) clearInterval(energyInterval);

  energyInterval = setInterval(async () => {
    if (!currentUser || currentUser.energy <= 0) return;

    currentUser.energy = Math.max(0, currentUser.energy - 1);
    updateUI();

    if (currentUser.energy === 0) {
      showToast('💤 Energy depleted! Open a crate.');
    } else if (currentUser.energy < 20) {
      showToast('⚠️ Energy low! Open a crate.');
    }

    if (currentUser.energy % 5 === 0 || currentUser.energy === 0) {
      await supabase
        .from('room_user_stats')
        .update({ energy: currentUser.energy, updated_at: new Date().toISOString() })
        .eq('user_id', currentUser.id);
    }
  }, 5000);
}

async function syncUserStats() {
  const [statsResult, walletResult] = await Promise.all([
    supabase
      .from('room_user_stats')
      .upsert({
        user_id: currentUser.id,
        energy: currentUser.energy,
        level: currentUser.avatar_level,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' }),
    supabase
      .from('user_wallets')
      .upsert({
        user_id: currentUser.id,
        coins: currentUser.coins,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' })
  ]);

  if (statsResult.error) console.error(statsResult.error);
  if (walletResult.error) console.error(walletResult.error);
  updateUI();
}

function updateUI() {
  if (!currentUser) return;

  const pct = Math.max(0, Math.min(100, Number(currentUser.energy)));
  energyFill.style.width = pct + '%';
  energyFill.classList.toggle('danger', pct < 25);
  energyText.textContent = Math.floor(pct);
  coinText.textContent = Math.floor(currentUser.coins);
  levelBadge.textContent = `Lv.${currentUser.avatar_level}`;
  avatarDisplay.textContent = getAvatarChar(currentUser.avatar_level);
  avatarDisplay.style.boxShadow = `0 0 ${12 + currentUser.avatar_level * 2}px rgba(138,43,226,0.6)`;
}

function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;

  navBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  Object.keys(panels).forEach(key => {
    panels[key].classList.toggle('active', key === tab);
  });

  const chatVisible = tab === 'chat';
  $('roomHeader').style.display = chatVisible ? 'block' : 'none';
  $('energySection').style.display = chatVisible ? 'flex' : 'none';
  $('inputArea').style.display = chatVisible ? 'flex' : 'none';

  if (tab === 'feed') loadFeed();
  else if (tab === 'inbox') loadInbox();
  else if (tab === 'profile') loadProfile();
}

async function loadFeed() {
  const { data, error } = await supabase
    .from('room_messages')
    .select('id,body,created_at,user_id,profiles(username,display_name),room_message_pulses(id)')
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    console.error(error);
    return;
  }

  const ranked = (data || [])
    .map(m => ({ ...m, pulseCount: m.room_message_pulses?.length || 0 }))
    .sort((a, b) => b.pulseCount - a.pulseCount)
    .slice(0, 10);

  feedContainer.innerHTML = ranked.length === 0
    ? '<div style="color:var(--text-muted);">No messages yet</div>'
    : ranked.map(m => `
      <div class="feed-item">
        <div class="msg-text">${escapeHtml(m.body)}</div>
        <div class="meta">
          <span>👤 ${escapeHtml(m.profiles?.display_name || m.profiles?.username || 'User')}</span>
          <span>⚡ ${m.pulseCount} pulses</span>
          <span>${new Date(m.created_at).toLocaleDateString()}</span>
        </div>
      </div>
    `).join('');
}

async function loadInbox() {
  const { data: myMessages, error: myError } = await supabase
    .from('room_messages')
    .select('id,body')
    .eq('user_id', currentUser.id);

  if (myError) {
    console.error(myError);
    return;
  }

  if (!myMessages?.length) {
    inboxContainer.innerHTML = '<div style="color:var(--text-muted);">No notifications yet</div>';
    return;
  }

  const ids = myMessages.map(m => m.id);

  const { data: pulses, error } = await supabase
    .from('room_message_pulses')
    .select('id,created_at,user_id,message_id,profiles(username,display_name)')
    .in('message_id', ids)
    .order('created_at', { ascending: false })
    .limit(20);

  if (error) {
    console.error(error);
    return;
  }

  if (!pulses?.length) {
    inboxContainer.innerHTML = '<div style="color:var(--text-muted);">No one has pulsed your messages yet</div>';
    return;
  }

  const bodyById = Object.fromEntries(myMessages.map(m => [m.id, m.body]));

  inboxContainer.innerHTML = pulses.map(p => `
    <div class="inbox-item">
      <div class="inbox-text">
        ⚡ <strong>${escapeHtml(p.profiles?.display_name || p.profiles?.username || 'User')}</strong>
        pulsed your message: “${escapeHtml(bodyById[p.message_id] || '')}”
      </div>
      <div class="inbox-meta">${new Date(p.created_at).toLocaleString()}</div>
    </div>
  `).join('');
}

async function loadProfile() {
  if (!currentUser) return;

  const { count: msgCount } = await supabase
    .from('room_messages')
    .select('id', { count: 'exact', head: true })
    .eq('user_id', currentUser.id);

  const { data: ownMessages } = await supabase
    .from('room_messages')
    .select('id')
    .eq('user_id', currentUser.id);

  let pulseCount = 0;
  if (ownMessages?.length) {
    const { count } = await supabase
      .from('room_message_pulses')
      .select('id', { count: 'exact', head: true })
      .in('message_id', ownMessages.map(m => m.id));
    pulseCount = count || 0;
  }

  profileContainer.innerHTML = `
    <div class="profile-avatar">${getAvatarChar(currentUser.avatar_level)}</div>
    <div class="profile-field"><span class="label">Username</span><span class="value">${escapeHtml(currentUser.username || '')}</span></div>
    <div class="profile-field"><span class="label">Level</span><span class="value">${currentUser.avatar_level}</span></div>
    <div class="profile-field"><span class="label">Coins</span><span class="value">${currentUser.coins}</span></div>
    <div class="profile-field"><span class="label">Energy</span><span class="value">${Math.floor(currentUser.energy)}%</span></div>
    <div class="profile-field"><span class="label">Messages Sent</span><span class="value">${msgCount || 0}</span></div>
    <div class="profile-field"><span class="label">Pulses Received</span><span class="value">${pulseCount}</span></div>
    <button class="edit-btn" onclick="editUsername()">✏️ Change Username</button>
    <button class="edit-btn" style="background:#FF4D4D; margin-top:8px;" onclick="logout()">🚪 Logout</button>
  `;
}

window.editUsername = async function() {
  const newName = prompt('Enter new username:', currentUser.username);
  if (!newName || !newName.trim()) return;

  const trimmed = newName.trim();

  const { data: existing } = await supabase
    .from('profiles')
    .select('id')
    .eq('username', trimmed)
    .neq('id', currentUser.id)
    .maybeSingle();

  if (existing) {
    showToast('❌ Username already taken');
    return;
  }

  const { error } = await supabase
    .from('profiles')
    .update({ username: trimmed, display_name: trimmed, updated_at: new Date().toISOString() })
    .eq('id', currentUser.id);

  if (error) {
    console.error(error);
    showToast('❌ Update failed');
    return;
  }

  currentUser.username = trimmed;
  currentUser.display_name = trimmed;
  showToast('✅ Username updated!');
  loadProfile();
};

window.logout = async function() {
  await spikeDB.auth.signOut();
  location.reload();
};

function showToast(text) {
  const old = document.querySelector('.toast');
  if (old) old.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = text;
  document.getElementById('app').appendChild(toast);

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.remove(), 2200);
}

initApp();
</script>
</body>
</html>
